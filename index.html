<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>タイチとハナの大冒険</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    sans-serif;
}

body{
  background:#1d3557;
}

button{
  font-family:inherit;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  touch-action:none;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(255,255,255,.45),
      transparent 25%
    ),
    linear-gradient(
      #87ceeb 0%,
      #87ceeb 45%,
      #72b64a 45%,
      #4f9138 100%
    );
}


/* =====================
   タイトル
===================== */

#title{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;

  width:95%;

  text-align:center;

  color:white;

  font-size:clamp(20px, 5vw, 28px);
  font-weight:bold;

  text-shadow:
    2px 2px 0 #234,
    0 0 8px rgba(0,0,0,.4);

  pointer-events:none;
}


/* =====================
   ステータス
===================== */

#status{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;

  display:flex;
  gap:10px;

  width:max-content;
  max-width:95%;
}

.statusBox{
  background:rgba(255,255,255,.92);

  padding:8px 14px;

  border-radius:20px;

  font-weight:bold;

  box-shadow:
    0 4px 10px rgba(0,0,0,.2);
}


/* =====================
   キャラクター選択
===================== */

#characterSelect{
  position:absolute;

  top:110px;

  left:50%;

  transform:translateX(-50%);

  z-index:30;

  display:flex;

  gap:10px;
}

.characterButton{
  border:none;

  border-radius:18px;

  padding:10px 16px;

  font-size:16px;

  font-weight:bold;

  background:white;

  box-shadow:
    0 4px 10px rgba(0,0,0,.25);

  touch-action:manipulation;
}

.characterButton.active{
  background:#ffd54f;

  transform:scale(1.05);
}


/* =====================
   背景
===================== */

.cloud{
  position:absolute;

  font-size:55px;

  opacity:.85;

  pointer-events:none;

  z-index:1;
}

.tree{
  position:absolute;

  font-size:65px;

  pointer-events:none;

  z-index:2;
}


/* =====================
   虫
===================== */

.bug{
  position:absolute;

  width:55px;
  height:55px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:42px;

  z-index:15;

  user-select:none;

  pointer-events:auto;

  cursor:pointer;

  touch-action:manipulation;

  filter:
    drop-shadow(
      2px 4px 2px rgba(0,0,0,.3)
    );

  animation:
    bugFloat
    1.5s
    ease-in-out
    infinite;
}

.bug:active{
  transform:scale(.85);
}


@keyframes bugFloat{

  0%{
    margin-top:0;
  }

  50%{
    margin-top:-5px;
  }

  100%{
    margin-top:0;
  }

}


/* =====================
   プレイヤー
===================== */

#player{
  position:absolute;

  width:72px;
  height:78px;

  z-index:20;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  transition:
    left .08s linear,
    top .08s linear;

  user-select:none;

  pointer-events:none;
}

#playerFace{
  width:54px;
  height:54px;

  border-radius:50%;

  background:#ffd7b5;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:32px;

  border:3px solid white;

  box-shadow:
    0 5px 8px rgba(0,0,0,.25);
}

#playerName{
  margin-top:3px;

  background:white;

  border-radius:12px;

  padding:3px 10px;

  font-size:14px;

  font-weight:bold;

  box-shadow:
    0 3px 6px rgba(0,0,0,.2);
}


/* =====================
   GETメッセージ
===================== */

#getEffect{
  position:absolute;

  z-index:100;

  font-size:28px;

  font-weight:bold;

  color:#ffca28;

  text-shadow:
    2px 2px 0 white,
    0 0 8px rgba(0,0,0,.3);

  pointer-events:none;

  transform:
    translate(-50%, -50%)
    scale(0);

  transition:.2s;

  opacity:0;
}

#getEffect.show{
  transform:
    translate(-50%, -80%)
    scale(1);

  opacity:1;
}


/* =====================
   クリアメッセージ
===================== */

#message{
  position:absolute;

  left:50%;
  top:45%;

  transform:
    translate(-50%,-50%)
    scale(0);

  z-index:100;

  width:82%;

  text-align:center;

  background:white;

  border-radius:25px;

  padding:25px;

  font-size:24px;

  font-weight:bold;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  transition:.3s;
}

#message.show{
  transform:
    translate(-50%,-50%)
    scale(1);
}


/* =====================
   操作ボタン
===================== */

#controls{
  position:absolute;

  bottom:25px;

  left:50%;

  transform:translateX(-50%);

  z-index:40;

  width:250px;

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  grid-template-rows:
    70px 70px;

  gap:8px;
}

.controlButton{
  border:none;

  border-radius:20px;

  font-size:34px;

  font-weight:bold;

  background:
    rgba(255,255,255,.92);

  color:#1976d2;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.25);

  touch-action:manipulation;
}

.controlButton:active{
  transform:scale(.92);

  background:#ffd54f;
}

#up{
  grid-column:2;
}

#left{
  grid-column:1;
  grid-row:2;
}

#down{
  grid-column:2;
  grid-row:2;
}

#right{
  grid-column:3;
  grid-row:2;
}


/* =====================
   小さい画面
===================== */

@media(max-height:700px){

  #controls{
    bottom:8px;
  }

  #characterSelect{
    top:105px;
  }

  #player{
    width:65px;
    height:70px;
  }

}


</style>

</head>


<body>


<div id="game">


  <div id="title">
    🌍 タイチとハナの大冒険 🌍
  </div>



  <div id="status">

    <div class="statusBox">
      ⭐ ポイント：
      <span id="score">0</span>
    </div>

    <div class="statusBox">
      🐞
      <span id="remaining">6</span>
      匹
    </div>

  </div>



  <div id="characterSelect">

    <button
      id="taichiButton"
      class="characterButton active">

      🧒 タイチ

    </button>


    <button
      id="hanaButton"
      class="characterButton">

      👧 ハナ

    </button>

  </div>



  <!-- 背景 -->

  <div
    class="cloud"
    style="left:5%; top:20%;">

    ☁️

  </div>


  <div
    class="cloud"
    style="right:5%; top:28%;">

    ☁️

  </div>


  <div
    class="tree"
    style="left:5%; bottom:180px;">

    🌳

  </div>


  <div
    class="tree"
    style="right:5%; bottom:170px;">

    🌲

  </div>



  <!-- プレイヤー -->

  <div id="player">

    <div id="playerFace">
      🧒
    </div>

    <div id="playerName">
      タイチ
    </div>

  </div>



  <!-- 虫 -->

  <div
    class="bug"
    style="left:15%; top:35%;">

    🪲

  </div>


  <div
    class="bug"
    style="left:70%; top:32%;">

    🦋

  </div>


  <div
    class="bug"
    style="left:40%; top:48%;">

    🐛

  </div>


  <div
    class="bug"
    style="left:75%; top:55%;">

    🐞

  </div>


  <div
    class="bug"
    style="left:18%; top:62%;">

    🦗

  </div>


  <div
    class="bug"
    style="left:52%; top:68%;">

    🪲

  </div>



  <!-- GET表示 -->

  <div id="getEffect">
    ⭐ GET! ⭐
  </div>



  <!-- クリア -->

  <div id="message">

    🎉 すべての虫を見つけた！ 🎉

    <br><br>

    ⭐ 大冒険クリア！ ⭐

  </div>



  <!-- 操作ボタン -->

  <div id="controls">


    <button
      id="up"
      class="controlButton">

      ↑

    </button>


    <button
      id="left"
      class="controlButton">

      ←

    </button>


    <button
      id="down"
      class="controlButton">

      ↓

    </button>


    <button
      id="right"
      class="controlButton">

      →

    </button>


  </div>


</div>



<script>


const player =
  document.getElementById("player");


const playerFace =
  document.getElementById("playerFace");


const playerName =
  document.getElementById("playerName");


const scoreText =
  document.getElementById("score");


const remainingText =
  document.getElementById("remaining");


const message =
  document.getElementById("message");


const getEffect =
  document.getElementById("getEffect");


const taichiButton =
  document.getElementById("taichiButton");


const hanaButton =
  document.getElementById("hanaButton");


const game =
  document.getElementById("game");


let playerX =
  window.innerWidth / 2 - 36;


let playerY =
  window.innerHeight - 260;


let score = 0;


const totalBugs =
  document.querySelectorAll(".bug").length;


updatePlayer();



/* =====================
   プレイヤー表示更新
===================== */

function updatePlayer(){

  player.style.left =
    playerX + "px";


  player.style.top =
    playerY + "px";

}



/* =====================
   移動
===================== */

function move(dx, dy){

  const speed = 35;


  playerX +=
    dx * speed;


  playerY +=
    dy * speed;


  const playerWidth =
    player.offsetWidth;


  const playerHeight =
    player.offsetHeight;


  if(playerX < 0){

    playerX = 0;

  }


  if(
    playerX >
    window.innerWidth - playerWidth
  ){

    playerX =
      window.innerWidth -
      playerWidth;

  }


  if(playerY < 170){

    playerY = 170;

  }


  const maxY =
    window.innerHeight -
    playerHeight -
    185;


  if(playerY > maxY){

    playerY = maxY;

  }


  updatePlayer();


  checkBugs();

}



/* =====================
   虫との距離チェック
===================== */

function checkBugs(){

  const bugs =
    document.querySelectorAll(".bug");


  bugs.forEach(function(bug){

    if(
      bug.dataset.collected ===
      "true"
    ){
      return;
    }


    const bugRect =
      bug.getBoundingClientRect();


    const playerRect =
      player.getBoundingClientRect();


    const playerCenterX =
      playerRect.left +
      playerRect.width / 2;


    const playerCenterY =
      playerRect.top +
      playerRect.height / 2;


    const bugCenterX =
      bugRect.left +
      bugRect.width / 2;


    const bugCenterY =
      bugRect.top +
      bugRect.height / 2;


    const distance =
      Math.sqrt(

        Math.pow(
          playerCenterX -
          bugCenterX,
          2
        )

        +

        Math.pow(
          playerCenterY -
          bugCenterY,
          2
        )

      );


    if(distance < 55){

      collectBug(bug);

    }

  });

}



/* =====================
   虫をゲット
===================== */

function collectBug(bug){

  if(
    bug.dataset.collected ===
    "true"
  ){
    return;
  }


  bug.dataset.collected =
    "true";


  const bugRect =
    bug.getBoundingClientRect();


  showGetEffect(
    bugRect.left +
    bugRect.width / 2,

    bugRect.top
  );


  bug.style.display =
    "none";


  score++;


  scoreText.textContent =
    score;


  const remaining =
    totalBugs -
    score;


  remainingText.textContent =
    remaining;


  if(remaining === 0){

    setTimeout(
      function(){

        message.classList.add(
          "show"
        );

      },
      500
    );

  }

}



/* =====================
   GETエフェクト
===================== */

function showGetEffect(x, y){

  getEffect.style.left =
    x + "px";


  getEffect.style.top =
    y + "px";


  getEffect.classList.remove(
    "show"
  );


  void getEffect.offsetWidth;


  getEffect.classList.add(
    "show"
  );


  setTimeout(
    function(){

      getEffect.classList.remove(
        "show"
      );

    },
    700
  );

}



/* =====================
   虫タップ
===================== */

document
.querySelectorAll(".bug")
.forEach(function(bug){

  bug.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      collectBug(bug);

    }
  );


  bug.addEventListener(
    "touchstart",
    function(event){

      event.preventDefault();

      collectBug(bug);

    },
    {
      passive:false
    }
  );

});



/* =====================
   画面の矢印
===================== */

function setupControl(id, dx, dy){

  const button =
    document.getElementById(id);


  button.addEventListener(
    "click",
    function(){

      move(dx, dy);

    }
  );


  button.addEventListener(
    "touchstart",
    function(event){

      event.preventDefault();

      move(dx, dy);

    },
    {
      passive:false
    }
  );

}


setupControl(
  "up",
  0,
  -1
);


setupControl(
  "down",
  0,
  1
);


setupControl(
  "left",
  -1,
  0
);


setupControl(
  "right",
  1,
  0
);



/* =====================
   キーボード操作
===================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "ArrowUp"
    ){

      event.preventDefault();

      move(0, -1);

    }


    if(
      event.key ===
      "ArrowDown"
    ){

      event.preventDefault();

      move(0, 1);

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      event.preventDefault();

      move(-1, 0);

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      event.preventDefault();

      move(1, 0);

    }

  }
);



/* =====================
   タイチ選択
===================== */

taichiButton.addEventListener(
  "click",
  function(){

    playerFace.textContent =
      "🧒";


    playerName.textContent =
      "タイチ";


    taichiButton.classList.add(
      "active"
    );


    hanaButton.classList.remove(
      "active"
    );

  }
);



/* =====================
   ハナ選択
===================== */

hanaButton.addEventListener(
  "click",
  function(){

    playerFace.textContent =
      "👧";


    playerName.textContent =
      "ハナ";


    hanaButton.classList.add(
      "active"
    );


    taichiButton.classList.remove(
      "active"
    );

  }
);



/* =====================
   画面サイズ変更
===================== */

window.addEventListener(
  "resize",
  function(){

    const maxX =
      window.innerWidth -
      player.offsetWidth;


    if(playerX > maxX){

      playerX = maxX;

    }


    const maxY =
      window.innerHeight -
      player.offsetHeight -
      185;


    if(playerY > maxY){

      playerY = maxY;

    }


    updatePlayer();

  }
);


</script>


</body>
</html>
