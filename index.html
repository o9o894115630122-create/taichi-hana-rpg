<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>タイチとハナの大冒険</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    sans-serif;
}

body{
  background:#222;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #62b7e8 0%,
      #8ed2ef 43%,
      #69a941 44%,
      #3f7f2d 100%
    );
}

/* =========================
   タイトル
========================= */

#title{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  text-align:center;

  font-size:24px;
  font-weight:900;

  color:white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.45);

  z-index:20;
}

/* =========================
   ステータス
========================= */

#status{
  position:absolute;

  top:70px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;

  width:310px;

  z-index:20;
}

.statusBox{
  background:
    rgba(255,255,255,.9);

  border-radius:22px;

  padding:
    10px 18px;

  font-size:20px;
  font-weight:800;

  min-width:140px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.18);
}

/* =========================
   キャラクター選択
========================= */

#characterSelect{

  position:absolute;

  top:155px;

  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:10px;

  z-index:20;
}

.characterButton{

  border:none;

  border-radius:22px;

  padding:
    12px 18px;

  font-size:20px;

  font-weight:900;

  background:white;

  color:#2870bb;

  box-shadow:
    0 5px 14px rgba(0,0,0,.2);

  cursor:pointer;
}

.characterButton.active{

  background:
    linear-gradient(
      135deg,
      #ffd94c,
      #ffb82e
    );

  color:white;
}

/* =========================
   空
========================= */

.cloud{

  position:absolute;

  font-size:62px;

  filter:
    drop-shadow(
      0 5px 4px rgba(0,0,0,.15)
    );

  pointer-events:none;
}

#cloud1{
  top:250px;
  left:30px;
}

#cloud2{
  top:330px;
  right:35px;
}

/* =========================
   木
========================= */

.tree{

  position:absolute;

  font-size:100px;

  bottom:290px;

  pointer-events:none;
}

#tree1{
  left:30px;
}

#tree2{
  right:25px;
}

/* =========================
   虫
========================= */

.bug{

  position:absolute;

  font-size:62px;

  cursor:pointer;

  z-index:10;

  transition:
    transform .15s,
    opacity .25s;

  user-select:none;

  -webkit-user-select:none;
}

.bug:active{

  transform:
    scale(1.35)
    rotate(10deg);
}

/* 虫の位置 */

#bug1{
  top:280px;
  left:110px;
}

#bug2{
  top:240px;
  right:120px;
}

#bug3{
  top:430px;
  left:150px;
}

#bug4{
  top:390px;
  right:80px;
}

#bug5{
  top:500px;
  left:55%;
}

/* =========================
   プレイヤー
========================= */

#player{

  position:absolute;

  left:50%;

  bottom:210px;

  transform:translateX(-50%);

  z-index:15;

  text-align:center;

  transition:
    left .12s linear,
    bottom .12s linear;
}

#playerFace{

  width:82px;

  height:82px;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:52px;

  background:white;

  border-radius:50%;

  border:
    5px solid
    rgba(255,255,255,.9);

  box-shadow:
    0 6px 15px
    rgba(0,0,0,.3);
}

#playerName{

  display:inline-block;

  margin-top:5px;

  background:white;

  padding:
    6px 18px;

  border-radius:20px;

  font-size:18px;

  font-weight:900;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,.2);
}

/* =========================
   操作ボタン
========================= */

#controls{

  position:absolute;

  bottom:20px;

  left:50%;

  transform:translateX(-50%);

  width:100%;

  z-index:30;
}

#upRow{

  display:flex;

  justify-content:center;

  margin-bottom:10px;
}

#downRow{

  display:flex;

  justify-content:center;

  gap:12px;
}

.controlButton{

  width:95px;

  height:85px;

  border:none;

  border-radius:22px;

  background:
    rgba(255,255,255,.9);

  font-size:46px;

  color:#2477bd;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.25);

  cursor:pointer;

  user-select:none;

  -webkit-user-select:none;
}

.controlButton:active{

  transform:
    scale(.94);

  background:#e6f2ff;
}

/* =========================
   メッセージ
========================= */

#message{

  position:absolute;

  top:220px;

  left:50%;

  transform:
    translateX(-50%)
    translateY(-20px);

  background:
    rgba(0,0,0,.75);

  color:white;

  padding:
    12px 22px;

  border-radius:25px;

  font-weight:900;

  font-size:20px;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .25s,
    transform .25s;

  z-index:50;

  white-space:nowrap;
}

#message.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   モバイル調整
========================= */

@media(max-height:700px){

  #title{
    top:10px;
    font-size:20px;
  }

  #status{
    top:50px;
  }

  #characterSelect{
    top:125px;
  }

  .controlButton{
    width:82px;
    height:72px;
    font-size:40px;
  }

}

</style>
</head>


<body>

<div id="game">

  <!-- タイトル -->

  <div id="title">
    🌍 タイチとハナの大冒険 🌍
  </div>


  <!-- ステータス -->

  <div id="status">

    <div class="statusBox">
      ⭐ ポイント：<span id="points">0</span>
    </div>

    <div class="statusBox">
      🐞 虫：<span id="bugCount">0</span>匹
    </div>

  </div>


  <!-- キャラクター選択 -->

  <div id="characterSelect">

    <button
      id="taichiButton"
      class="characterButton active"
    >
      🧒 タイチ
    </button>

    <button
      id="hanaButton"
      class="characterButton"
    >
      👧 ハナ
    </button>

  </div>


  <!-- 雲 -->

  <div
    id="cloud1"
    class="cloud"
  >
    ☁️
  </div>

  <div
    id="cloud2"
    class="cloud"
  >
    ☁️
  </div>


  <!-- 木 -->

  <div
    id="tree1"
    class="tree"
  >
    🌳
  </div>

  <div
    id="tree2"
    class="tree"
  >
    🌲
  </div>


  <!-- 虫 -->

  <div
    class="bug"
    id="bug1"
    data-name="カブトムシ"
    data-points="10"
  >
    🪲
  </div>


  <div
    class="bug"
    id="bug2"
    data-name="ちょうちょ"
    data-points="5"
  >
    🦋
  </div>


  <div
    class="bug"
    id="bug3"
    data-name="バッタ"
    data-points="8"
  >
    🦗
  </div>


  <div
    class="bug"
    id="bug4"
    data-name="てんとう虫"
    data-points="6"
  >
    🐞
  </div>


  <div
    class="bug"
    id="bug5"
    data-name="いもむし"
    data-points="7"
  >
    🐛
  </div>


  <!-- プレイヤー -->

  <div id="player">

    <div id="playerFace">
      🧒
    </div>

    <div id="playerName">
      タイチ
    </div>

  </div>


  <!-- メッセージ -->

  <div id="message">
    虫をゲット！
  </div>


  <!-- 操作ボタン -->

  <div id="controls">

    <div id="upRow">

      <button
        class="controlButton"
        id="upButton"
      >
        ↑
      </button>

    </div>


    <div id="downRow">

      <button
        class="controlButton"
        id="leftButton"
      >
        ←
      </button>


      <button
        class="controlButton"
        id="downButton"
      >
        ↓
      </button>


      <button
        class="controlButton"
        id="rightButton"
      >
        →
      </button>

    </div>

  </div>


</div>


<script>

/* =========================
   変数
========================= */

const player =
document.getElementById("player");

const playerFace =
document.getElementById("playerFace");

const playerName =
document.getElementById("playerName");

const pointsDisplay =
document.getElementById("points");

const bugCountDisplay =
document.getElementById("bugCount");

const message =
document.getElementById("message");

const taichiButton =
document.getElementById("taichiButton");

const hanaButton =
document.getElementById("hanaButton");


/* =========================
   ゲームデータ
========================= */

let points = 0;

let bugCount = 0;


/* プレイヤー位置 */

let playerX = 50;

let playerBottom = 210;


/* 選択キャラクター */

let selectedCharacter = "taichi";


/* =========================
   キャラクター変更
========================= */

taichiButton.addEventListener(
  "click",
  function(){

    selectedCharacter = "taichi";

    playerFace.textContent = "🧒";

    playerName.textContent = "タイチ";

    taichiButton.classList.add("active");

    hanaButton.classList.remove("active");

    showMessage(
      "🧒 タイチに交代！"
    );

  }
);


hanaButton.addEventListener(
  "click",
  function(){

    selectedCharacter = "hana";

    playerFace.textContent = "👧";

    playerName.textContent = "ハナ";

    hanaButton.classList.add("active");

    taichiButton.classList.remove("active");

    showMessage(
      "👧 ハナに交代！"
    );

  }
);


/* =========================
   移動
========================= */

function movePlayer(
  direction
){

  const step = 7;


  if(
    direction === "left"
  ){

    playerX -= step;

  }


  if(
    direction === "right"
  ){

    playerX += step;

  }


  if(
    direction === "up"
  ){

    playerBottom += 55;

  }


  if(
    direction === "down"
  ){

    playerBottom -= 55;

  }


  /* 横の範囲 */

  if(
    playerX < 10
  ){

    playerX = 10;

  }


  if(
    playerX > 90
  ){

    playerX = 90;

  }


  /* 縦の範囲 */

  if(
    playerBottom < 170
  ){

    playerBottom = 170;

  }


  if(
    playerBottom > 520
  ){

    playerBottom = 520;

  }


  player.style.left =
    playerX + "%";


  player.style.bottom =
    playerBottom + "px";

}


/* =========================
   ボタン操作
========================= */

document
.getElementById("upButton")
.addEventListener(
  "click",
  function(){

    movePlayer("up");

  }
);


document
.getElementById("downButton")
.addEventListener(
  "click",
  function(){

    movePlayer("down");

  }
);


document
.getElementById("leftButton")
.addEventListener(
  "click",
  function(){

    movePlayer("left");

  }
);


document
.getElementById("rightButton")
.addEventListener(
  "click",
  function(){

    movePlayer("right");

  }
);


/* =========================
   虫をタップ
========================= */

const bugs =
document.querySelectorAll(
  ".bug"
);


bugs.forEach(
  function(bug){

    bug.addEventListener(
      "click",
      function(event){

        event.stopPropagation();


        const bugName =
          bug.dataset.name;


        const bugPoints =
          Number(
            bug.dataset.points
          );


        /* ポイント追加 */

        points +=
          bugPoints;


        bugCount += 1;


        /* 表示更新 */

        pointsDisplay.textContent =
          points;


        bugCountDisplay.textContent =
          bugCount;


        /* 虫を捕まえた演出 */

        bug.style.transform =
          "scale(1.7) rotate(20deg)";


        bug.style.opacity =
          "0";


        /* メッセージ */

        showMessage(
          "🎉 " +
          bugName +
          "をゲット！ +" +
          bugPoints
        );


        /* 虫を消す */

        setTimeout(
          function(){

            bug.remove();

          },
          250
        );

      }
    );

  }
);


/* =========================
   メッセージ表示
========================= */

function showMessage(
  text
){

  message.textContent =
    text;


  message.classList.add(
    "show"
  );


  setTimeout(
    function(){

      message.classList.remove(
        "show"
      );

    },
    1600
  );

}


/* =========================
   キーボード操作
   PC用
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "ArrowUp"
    ){

      movePlayer("up");

    }


    if(
      event.key === "ArrowDown"
    ){

      movePlayer("down");

    }


    if(
      event.key === "ArrowLeft"
    ){

      movePlayer("left");

    }


    if(
      event.key === "ArrowRight"
    ){

      movePlayer("right");

    }

  }
);


</script>

</body>
</html>
