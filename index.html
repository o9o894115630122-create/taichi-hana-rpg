<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>タイチとハナの大冒険</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  background:#79cfff;
  color:#222;
  overflow:hidden;
}

#game{
  width:100vw;
  height:100vh;
  max-width:700px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#7ed5ff,#e8fbff);
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.screen.active{
  display:flex;
}

/* =========================
タイトル
========================= */

#titleScreen{
  background:
    radial-gradient(circle at 20% 20%, #fff 0 3%, transparent 4%),
    radial-gradient(circle at 80% 15%, #fff 0 4%, transparent 5%),
    linear-gradient(#72d4ff,#c8f4ff);
}

.title{
  font-size:42px;
  font-weight:900;
  text-align:center;
  color:#ff5f8f;
  text-shadow:
    3px 3px 0 white,
    6px 6px 0 rgba(0,0,0,.08);
  margin-bottom:10px;
}

.subtitle{
  font-size:18px;
  font-weight:bold;
  text-align:center;
  color:#4b3a66;
  margin-bottom:35px;
}

.hero{
  display:flex;
  gap:20px;
  align-items:flex-end;
  margin-bottom:35px;
}

.heroCharacter{
  width:135px;
  height:180px;
  border-radius:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 0 rgba(0,0,0,.12);
  border:5px solid white;
}

.taichiHero{
  background:#69b8ff;
}

.hanaHero{
  background:#ff91bd;
}

.heroEmoji{
  font-size:75px;
}

.heroName{
  font-size:25px;
  font-weight:900;
  color:white;
  text-shadow:2px 2px 0 rgba(0,0,0,.2);
}

.startButton{
  border:none;
  border-radius:50px;
  padding:18px 45px;
  font-size:24px;
  font-weight:900;
  color:white;
  background:#ff6b96;
  box-shadow:0 8px 0 #c94770;
}

.startButton:active{
  transform:translateY(5px);
  box-shadow:0 3px 0 #c94770;
}

/* =========================
共通
========================= */

.topBar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;
  background:rgba(255,255,255,.9);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  z-index:10;
}

.gameTitle{
  font-size:18px;
  font-weight:900;
}

.status{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:13px;
  font-weight:bold;
}

.statusBox{
  background:#eef8ff;
  padding:6px 10px;
  border-radius:20px;
}

.mainButton{
  border:none;
  border-radius:20px;
  padding:15px 20px;
  font-size:18px;
  font-weight:900;
  background:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.15);
}

.mainButton:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,.15);
}

.storyBox{
  width:100%;
  max-width:600px;
  background:white;
  border-radius:25px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.storyText{
  font-size:21px;
  font-weight:700;
  line-height:1.7;
  min-height:190px;
}

.nextButton{
  margin-top:20px;
  width:100%;
  border:none;
  padding:16px;
  border-radius:18px;
  font-size:20px;
  font-weight:900;
  background:#4c91ff;
  color:white;
}

/* =========================
ワールドマップ
========================= */

#mapScreen{
  justify-content:flex-start;
  padding-top:90px;
  background:linear-gradient(#82d9ff,#e9fcff);
  overflow-y:auto;
}

.mapTitle{
  font-size:28px;
  font-weight:900;
  margin-bottom:20px;
}

.worldList{
  width:100%;
  max-width:600px;
  display:flex;
  flex-direction:column;
  gap:15px;
  padding-bottom:30px;
}

.world{
  border:none;
  border-radius:25px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:18px;
  text-align:left;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
  background:white;
}

.world.locked{
  filter:grayscale(1);
  opacity:.55;
}

.worldIcon{
  width:70px;
  height:70px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.worldInfo h2{
  margin:0;
  font-size:21px;
}

.worldInfo p{
  margin:6px 0 0;
  color:#666;
  font-size:14px;
}

.forest{background:#7bd66b;}
.town{background:#ffc65c;}
.sky{background:#9f8cff;}
.sea{background:#61c8ff;}
.castle{background:#ff82a9;}

/* =========================
イベント
========================= */

#storyScreen{
  background:
    linear-gradient(rgba(100,210,255,.45),rgba(255,255,255,.75)),
    #bdeeff;
}

.characterStage{
  width:100%;
  max-width:600px;
  height:210px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:20px;
  margin-bottom:20px;
}

.characterCard{
  width:130px;
  height:170px;
  border-radius:30px;
  border:5px solid white;
  box-shadow:0 8px 0 rgba(0,0,0,.12);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.characterEmoji{
  font-size:65px;
}

.characterName{
  color:white;
  font-weight:900;
  font-size:19px;
  text-shadow:2px 2px 0 rgba(0,0,0,.25);
}

.taichi{
  background:#5da9ff;
}

.hana{
  background:#ff83b7;
}

.friend{
  background:#8bdf87;
}

/* =========================
バトル
========================= */

#battleScreen{
  background:linear-gradient(#ffd29b,#ffebd2);
  justify-content:flex-start;
  padding-top:90px;
}

.battleArea{
  width:100%;
  max-width:650px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.enemyArea{
  background:rgba(255,255,255,.85);
  border-radius:25px;
  padding:20px;
  text-align:center;
}

.enemyEmoji{
  font-size:80px;
}

.enemyName{
  font-size:24px;
  font-weight:900;
}

.hpBar{
  width:100%;
  height:20px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.hpFill{
  height:100%;
  width:100%;
  background:#4bd36a;
  transition:.3s;
}

.partyArea{
  display:flex;
  gap:10px;
}

.partyMember{
  flex:1;
  background:white;
  border-radius:20px;
  padding:10px;
  text-align:center;
  font-size:13px;
  font-weight:bold;
}

.partyEmoji{
  font-size:35px;
}

.battleLog{
  background:rgba(255,255,255,.9);
  border-radius:20px;
  padding:15px;
  min-height:100px;
  font-size:17px;
  font-weight:bold;
  line-height:1.6;
}

.commandGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.command{
  border:none;
  border-radius:20px;
  padding:17px 10px;
  font-size:18px;
  font-weight:900;
  color:white;
}

.attack{background:#ff6b6b;}
.skill{background:#7b6cff;}
.heal{background:#42c978;}
.run{background:#777;}

/* =========================
仲間
========================= */

#friendScreen{
  background:linear-gradient(#d8f7ff,#ffffff);
}

.friendBig{
  font-size:100px;
  margin-bottom:15px;
}

.friendTitle{
  font-size:30px;
  font-weight:900;
  text-align:center;
}

.friendText{
  max-width:600px;
  background:white;
  padding:25px;
  border-radius:25px;
  font-size:20px;
  line-height:1.7;
  font-weight:bold;
  box-shadow:0 10px 20px rgba(0,0,0,.12);
}

/* =========================
エンディング
========================= */

#endingScreen{
  background:linear-gradient(#19144d,#51308c,#ff91b8);
  color:white;
}

.endingTitle{
  font-size:38px;
  font-weight:900;
  text-align:center;
  margin-bottom:20px;
}

.endingText{
  text-align:center;
  font-size:20px;
  line-height:1.8;
  max-width:600px;
}

.endingCharacters{
  font-size:48px;
  text-align:center;
  margin:25px 0;
}

.restart{
  background:white;
  color:#51308c;
}

/* =========================
通知
========================= */

.toast{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 20px;
  border-radius:30px;
  font-weight:bold;
  display:none;
  z-index:50;
}

</style>
</head>

<body>

<div id="game">

<!-- タイトル -->
<div id="titleScreen" class="screen active">

  <div class="title">タイチとハナの大冒険</div>

  <div class="subtitle">
    〜世界をめぐる友情の冒険〜
  </div>

  <div class="hero">

    <div class="heroCharacter taichiHero">
      <div class="heroEmoji">🧒🏻🪲</div>
      <div class="heroName">タイチ</div>
    </div>

    <div class="heroCharacter hanaHero">
      <div class="heroEmoji">👧🏻🌸</div>
      <div class="heroName">ハナ</div>
    </div>

  </div>

  <button class="startButton" onclick="startGame()">
    冒険をはじめる！
  </button>

</div>


<!-- マップ -->
<div id="mapScreen" class="screen">

  <div class="topBar">

    <div class="gameTitle">
      🌍 世界マップ
    </div>

    <div class="status">
      <div class="statusBox">
        Lv <span id="level">1</span>
      </div>

      <div class="statusBox">
        EXP <span id="exp">0</span>
      </div>
    </div>

  </div>

  <div class="mapTitle">
    次はどこへ行く？
  </div>

  <div class="worldList">

    <button class="world" onclick="enterWorld(0)">
      <div class="worldIcon forest">🪲</div>

      <div class="worldInfo">
        <h2>① クワガタの森</h2>
        <p>レインボーとの出会い</p>
      </div>
    </button>


    <button id="world1" class="world locked" onclick="enterWorld(1)">
      <div class="worldIcon town">🦹‍♂️</div>

      <div class="worldInfo">
        <h2>② ドキドキ怪盗タウン</h2>
        <p>ちび怪盗くんが待っている！</p>
      </div>
    </button>


    <button id="world2" class="world locked" onclick="enterWorld(2)">
      <div class="worldIcon sky">☁️</div>

      <div class="worldInfo">
        <h2>③ くもくもの空島</h2>
        <p>空に浮かぶ不思議な島</p>
      </div>
    </button>


    <button id="world3" class="world locked" onclick="enterWorld(3)">
      <div class="worldIcon sea">🦈</div>

      <div class="worldInfo">
        <h2>④ シャーキュンの海</h2>
        <p>海の仲間たちの冒険</p>
      </div>
    </button>


    <button id="world4" class="world locked" onclick="enterWorld(4)">
      <div class="worldIcon castle">🏰</div>

      <div class="worldInfo">
        <h2>⑤ ますみん城</h2>
        <p>いよいよ最後の冒険！</p>
      </div>
    </button>

  </div>

</div>


<!-- ストーリー -->
<div id="storyScreen" class="screen">

  <div class="topBar">
    <div class="gameTitle" id="worldTitle">
      冒険
    </div>

    <button class="mainButton" onclick="showMap()">
      マップ
    </button>
  </div>


  <div class="characterStage">

    <div class="characterCard taichi">
      <div class="characterEmoji">🧒🏻🪲</div>
      <div class="characterName">タイチ</div>
    </div>

    <div class="characterCard hana">
      <div class="characterEmoji">👧🏻🌸</div>
      <div class="characterName">ハナ</div>
    </div>

  </div>


  <div class="storyBox">

    <div id="storyText" class="storyText"></div>

    <button class="nextButton" onclick="nextStory()">
      つぎへ ▶
    </button>

  </div>

</div>


<!-- 仲間 -->
<div id="friendScreen" class="screen">

  <div id="friendEmoji" class="friendBig"></div>

  <div id="friendName" class="friendTitle"></div>

  <div id="friendText" class="friendText"></div>

  <button class="nextButton" onclick="startBattle()">
    一緒に進む！
  </button>

</div>


<!-- バトル -->
<div id="battleScreen" class="screen">

  <div class="topBar">
    <div class="gameTitle">
      ⚔️ バトル！
    </div>

    <div class="status">
      Lv <span id="battleLevel">1</span>
    </div>
  </div>


  <div class="battleArea">

    <div class="enemyArea">

      <div id="enemyEmoji" class="enemyEmoji"></div>

      <div id="enemyName" class="enemyName"></div>

      <div class="hpBar">
        <div id="enemyHp" class="hpFill"></div>
      </div>

    </div>


    <div class="partyArea">

      <div class="partyMember">
        <div class="partyEmoji">🧒🏻🪲</div>
        タイチ
        <div class="hpBar">
          <div id="taichiHp" class="hpFill"></div>
        </div>
      </div>

      <div class="partyMember">
        <div class="partyEmoji">👧🏻🌸</div>
        ハナ
        <div class="hpBar">
          <div id="hanaHp" class="hpFill"></div>
        </div>
      </div>

    </div>


    <div id="battleLog" class="battleLog">
      モンスターが現れた！
    </div>


    <div class="commandGrid">

      <button class="command attack" onclick="attack()">
        ⚔️ こうげき
      </button>

      <button class="command skill" onclick="skill()">
        ✨ とくしゅわざ
      </button>

      <button class="command heal" onclick="heal()">
        💖 かいふく
      </button>

      <button class="command run" onclick="runAway()">
        💨 にげる
      </button>

    </div>

  </div>

</div>


<!-- エンディング -->
<div id="endingScreen" class="screen">

  <div class="endingTitle">
    🎉 大冒険クリア！ 🎉
  </div>

  <div class="endingCharacters">
    🧒🏻🪲 👧🏻🌸 🪲 🦹‍♂️ ☁️ 🦈 🐙 🦎 🦗 🏰
  </div>

  <div class="endingText">
    タイチとハナは、<br>
    たくさんの仲間たちと出会い、<br>
    世界をめぐる大冒険を終えました。<br><br>

    でも、二人の冒険は<br>
    これからもずっと続くのでした……✨
  </div>

  <button class="mainButton restart" onclick="restartGame()">
    もう一度遊ぶ！
  </button>

</div>


<div id="toast" class="toast"></div>

</div>


<script>

/* =========================
ゲームデータ
========================= */

const worlds = [

  {
    name:"クワガタの森",
    friend:"レインボー",
    friendEmoji:"🪲",
    enemy:"森のいたずらモンスター",
    enemyEmoji:"🐛",
    stories:[
      "ある日、タイチとハナの前に不思議な光が現れました。",
      "光の先にあったのは、巨大なクワガタの森！",
      "タイチ「すごい！クワガタがいっぱいだ！」",
      "すると森の奥から、虹色に輝くクワガタが現れました。"
    ]
  },

  {
    name:"ドキドキ怪盗タウン",
    friend:"ちび怪盗くん",
    friendEmoji:"🦹‍♂️",
    enemy:"パリピタイタイ",
    enemyEmoji:"😎",
    stories:[
      "次に二人が訪れたのは、ドキドキ怪盗タウン。",
      "町では大切な宝物が次々となくなっていました。",
      "そこへ現れたのは、謎のちび怪盗くん！",
      "ちび怪盗くん「犯人を追いかけよう！」"
    ]
  },

  {
    name:"くもくもの空島",
    friend:"くもくも",
    friendEmoji:"☁️",
    enemy:"空のあらしモンスター",
    enemyEmoji:"🌪️",
    stories:[
      "雲の上には、空に浮かぶ不思議な島がありました。",
      "そこで出会ったのは、ふわふわのくもくも。",
      "くもくも「風が強くて、みんな困っているんだ！」",
      "タイチとハナは、空島を守るために立ち上がりました。"
    ]
  },

  {
    name:"シャーキュンの海",
    friend:"シャーキュン",
    friendEmoji:"🦈",
    enemy:"たこたこ",
    enemyEmoji:"🐙",
    stories:[
      "今度の冒険の舞台は、青く広がる大きな海。",
      "そこで二人は、元気いっぱいのシャーキュンと出会いました。",
      "しかし海の底では、たこたこが大暴れ！",
      "みんなで力を合わせて、海を元に戻そう！"
    ]
  },

  {
    name:"ますみん城",
    friend:"とっくん・カマキチ",
    friendEmoji:"🦎🦗",
    enemy:"ますみん",
    enemyEmoji:"👑",
    stories:[
      "すべての世界を救ったタイチとハナ。",
      "しかし、最後に残された場所がありました。",
      "それは巨大な、ますみん城！",
      "いよいよ、世界をめぐる大冒険の最後の戦いです！"
    ]
  }

];


/* =========================
ゲーム状態
========================= */

let currentWorld = 0;
let storyIndex = 0;

let level = 1;
let exp = 0;

let enemyMaxHp = 100;
let enemyCurrentHp = 100;

let taichiMaxHp = 100;
let hanaMaxHp = 100;

let taichiCurrentHp = 100;
let hanaCurrentHp = 100;

let unlockedWorld = 0;


/* =========================
画面切り替え
========================= */

function showScreen(id){

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}


/* =========================
ゲーム開始
========================= */

function startGame(){

  showMap();

}


/* =========================
マップ
========================= */

function showMap(){

  showScreen("mapScreen");

  updateStatus();
  updateWorldLocks();

}


function updateStatus(){

  document.getElementById("level").textContent = level;
  document.getElementById("exp").textContent = exp;

}


function updateWorldLocks(){

  for(let i=1;i<5;i++){

    const world = document.getElementById("world"+i);

    if(i<=unlockedWorld){
      world.classList.remove("locked");
    }else{
      world.classList.add("locked");
    }

  }

}


function enterWorld(index){

  if(index > unlockedWorld){

    showToast("まだこのワールドには行けないよ！");

    return;

  }

  currentWorld = index;
  storyIndex = 0;

  document.getElementById("worldTitle").textContent =
    worlds[currentWorld].name;

  showScreen("storyScreen");

  showStory();

}


/* =========================
ストーリー
========================= */

function showStory(){

  document.getElementById("storyText").textContent =
    worlds[currentWorld].stories[storyIndex];

}


function nextStory(){

  storyIndex++;

  if(storyIndex < worlds[currentWorld].stories.length){

    showStory();

  }else{

    showFriend();

  }

}


/* =========================
仲間
========================= */

function showFriend(){

  const world = worlds[currentWorld];

  document.getElementById("friendEmoji").textContent =
    world.friendEmoji;

  document.getElementById("friendName").textContent =
    world.friend + " が仲間になった！";

  document.getElementById("friendText").textContent =
    "「これからは一緒に冒険しよう！」\n\n新しい仲間が加わった！";

  showScreen("friendScreen");

}


/* =========================
バトル
========================= */

function startBattle(){

  const world = worlds[currentWorld];

  enemyMaxHp = 100 + currentWorld * 45 + level * 10;
  enemyCurrentHp = enemyMaxHp;

  taichiMaxHp = 100 + (level-1)*20;
  hanaMaxHp = 100 + (level-1)*20;

  taichiCurrentHp = taichiMaxHp;
  hanaCurrentHp = hanaMaxHp;

  document.getElementById("enemyEmoji").textContent =
    world.enemyEmoji;

  document.getElementById("enemyName").textContent =
    world.enemy;

  document.getElementById("battleLevel").textContent =
    level;

  updateBattleBars();

  document.getElementById("battleLog").textContent =
    world.enemy + " が現れた！";

  showScreen("battleScreen");

}


function updateBattleBars(){

  document.getElementById("enemyHp").style.width =
    Math.max(0,enemyCurrentHp/enemyMaxHp*100) + "%";

  document.getElementById("taichiHp").style.width =
    Math.max(0,taichiCurrentHp/taichiMaxHp*100) + "%";

  document.getElementById("hanaHp").style.width =
    Math.max(0,hanaCurrentHp/hanaMaxHp*100) + "%";

}


/* =========================
攻撃
========================= */

function attack(){

  const damage =
    random(18,30) + level * 2;

  enemyCurrentHp -= damage;

  battleMessage(
    "タイチとハナのこうげき！\n" +
    damage + " ダメージ！"
  );

  updateBattleBars();

  setTimeout(checkEnemy,700);

}


/* =========================
特殊技
========================= */

function skill(){

  const damage =
    random(30,50) + level * 3;

  enemyCurrentHp -= damage;

  battleMessage(
    "✨ 二人の友情パワー！\n" +
    damage + " ダメージ！"
  );

  updateBattleBars();

  setTimeout(checkEnemy,700);

}


/* =========================
回復
========================= */

function heal(){

  const amount =
    random(18,30);

  taichiCurrentHp =
    Math.min(taichiMaxHp,
      taichiCurrentHp + amount);

  hanaCurrentHp =
    Math.min(hanaMaxHp,
      hanaCurrentHp + amount);

  battleMessage(
    "💖 ハナの不思議なパワー！\n" +
    "みんなのHPが回復した！"
  );

  updateBattleBars();

  setTimeout(enemyAttack,700);

}


/* =========================
敵チェック
========================= */

function checkEnemy(){

  if(enemyCurrentHp <= 0){

    winBattle();

  }else{

    enemyAttack();

  }

}


/* =========================
敵攻撃
========================= */

function enemyAttack(){

  const damage =
    random(10,22) + currentWorld * 3;

  if(Math.random() < .5){

    taichiCurrentHp -= damage;

    battleMessage(
      "敵の攻撃！\nタイチに " +
      damage + " ダメージ！"
    );

  }else{

    hanaCurrentHp -= damage;

    battleMessage(
      "敵の攻撃！\nハナに " +
      damage + " ダメージ！"
    );

  }

  updateBattleBars();

  setTimeout(checkPlayer,500);

}


/* =========================
プレイヤー敗北チェック
========================= */

function checkPlayer(){

  if(
    taichiCurrentHp <= 0 &&
    hanaCurrentHp <= 0
  ){

    battleMessage(
      "二人は力尽きてしまった…\nもう一度挑戦しよう！"
    );

    setTimeout(startBattle,1500);

  }

}


/* =========================
勝利
========================= */

function winBattle(){

  const gainedExp =
    30 + currentWorld * 20;

  exp += gainedExp;

  battleMessage(
    "🎉 勝利！\nEXPを " +
    gainedExp + " かくとく！"
  );

  if(exp >= level * 100){

    exp = 0;
    level++;

    showToast(
      "🎉 レベルアップ！ Lv." +
      level
    );

  }

  if(currentWorld === 4){

    setTimeout(()=>{
      showScreen("endingScreen");
    },1500);

    return;

  }

  unlockedWorld =
    Math.max(
      unlockedWorld,
      currentWorld + 1
    );

  setTimeout(showMap,1500);

}


/* =========================
逃げる
========================= */

function runAway(){

  battleMessage(
    "💨 うまく逃げ切った！"
  );

  setTimeout(showMap,800);

}


/* =========================
メッセージ
========================= */

function battleMessage(text){

  document.getElementById("battleLog").textContent =
    text;

}


/* =========================
ランダム
========================= */

function random(min,max){

  return Math.floor(
    Math.random() *
    (max-min+1)
  ) + min;

}


/* =========================
トースト
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.display = "none";
  },2000);

}


/* =========================
最初から
========================= */

function restartGame(){

  currentWorld = 0;
  storyIndex = 0;

  level = 1;
  exp = 0;

  unlockedWorld = 0;

  showScreen("titleScreen");

}

</script>

</body>
</html>
