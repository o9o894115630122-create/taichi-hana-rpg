<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>タイチとハナの大冒険</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Sans","Yu Gothic",sans-serif;
  background:#79cfff;
  color:#222;
  overflow:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
}

#game{
  width:100vw;
  height:100vh;
  max-width:700px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#7ed5ff;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.screen.active{
  display:flex;
}

/* タイトル */

#titleScreen{
  background:
  radial-gradient(circle at 20% 20%,#fff 0 3%,transparent 4%),
  radial-gradient(circle at 80% 15%,#fff 0 4%,transparent 5%),
  linear-gradient(#72d4ff,#c8f4ff);
}

.title{
  font-size:40px;
  font-weight:900;
  text-align:center;
  color:#ff5f8f;
  text-shadow:3px 3px white;
  margin-bottom:10px;
}

.subtitle{
  font-size:17px;
  font-weight:bold;
  margin-bottom:25px;
}

.hero{
  display:flex;
  gap:18px;
  margin-bottom:28px;
}

.heroCharacter{
  width:130px;
  height:165px;
  border-radius:28px;
  border:5px solid white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 0 rgba(0,0,0,.12);
}

.taichi{
  background:#5da9ff;
}

.hana{
  background:#ff83b7;
}

.heroEmoji{
  font-size:65px;
}

.heroName{
  color:white;
  font-size:23px;
  font-weight:900;
}

.startButton,
.mainButton,
.nextButton{
  border:none;
  font-weight:900;
  border-radius:22px;
}

.startButton{
  padding:17px 38px;
  font-size:22px;
  color:white;
  background:#ff6b96;
  box-shadow:0 6px 0 #c94770;
  margin:5px;
}

.continueButton{
  background:#4c91ff;
  box-shadow:0 6px 0 #2864c4;
}

/* 共通 */

.topBar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:rgba(255,255,255,.93);
  box-shadow:0 3px 10px rgba(0,0,0,.1);
  z-index:20;
}

.gameTitle{
  font-size:17px;
  font-weight:900;
}

.status{
  display:flex;
  gap:6px;
  font-size:12px;
  font-weight:bold;
}

.statusBox{
  background:#eef8ff;
  padding:7px 9px;
  border-radius:20px;
}

.mainButton{
  padding:10px 14px;
  font-size:15px;
  background:white;
  box-shadow:0 4px 0 rgba(0,0,0,.15);
}

.nextButton{
  width:100%;
  padding:15px;
  margin-top:16px;
  font-size:19px;
  color:white;
  background:#4c91ff;
}

/* マップ */

#mapScreen{
  justify-content:flex-start;
  padding-top:90px;
  background:linear-gradient(#82d9ff,#e9fcff);
  overflow-y:auto;
}

.mapTitle{
  font-size:27px;
  font-weight:900;
  margin-bottom:18px;
}

.worldList{
  width:100%;
  max-width:600px;
  display:flex;
  flex-direction:column;
  gap:13px;
  padding-bottom:30px;
}

.world{
  border:none;
  border-radius:24px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:15px;
  text-align:left;
  background:white;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
}

.world.locked{
  filter:grayscale(1);
  opacity:.5;
}

.world.cleared{
  border:4px solid #ffd24d;
}

.worldIcon{
  width:65px;
  height:65px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:37px;
}

.forest{background:#7bd66b;}
.town{background:#ffc65c;}
.sky{background:#9f8cff;}
.sea{background:#61c8ff;}
.castle{background:#ff82a9;}

.worldInfo h2{
  margin:0;
  font-size:19px;
}

.worldInfo p{
  margin:5px 0 0;
  color:#666;
  font-size:13px;
}

/* ストーリー */

#storyScreen{
  background:linear-gradient(#9de1ff,#ffffff);
}

.characterStage{
  width:100%;
  max-width:600px;
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:15px;
}

.characterCard{
  width:125px;
  height:155px;
  border-radius:28px;
  border:5px solid white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:0 7px 0 rgba(0,0,0,.12);
}

.characterEmoji{
  font-size:58px;
}

.characterName{
  color:white;
  font-size:18px;
  font-weight:900;
}

.storyBox{
  width:100%;
  max-width:600px;
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 10px 20px rgba(0,0,0,.12);
}

.storyText{
  min-height:145px;
  font-size:20px;
  font-weight:700;
  line-height:1.7;
}

/* 仲間 */

#friendScreen{
  background:linear-gradient(#d8f7ff,#ffffff);
}

.friendBig{
  font-size:95px;
}

.friendTitle{
  font-size:28px;
  font-weight:900;
  text-align:center;
  margin:10px;
}

.friendText{
  width:100%;
  max-width:600px;
  background:white;
  padding:22px;
  border-radius:24px;
  font-size:19px;
  font-weight:bold;
  line-height:1.7;
}

/* 仲間選択 */

#partyScreen{
  justify-content:flex-start;
  padding-top:85px;
  background:linear-gradient(#fff2b7,#ffffff);
  overflow-y:auto;
}

.partyTitle{
  font-size:26px;
  font-weight:900;
  margin-bottom:8px;
}

.partyHelp{
  font-size:15px;
  margin-bottom:18px;
}

.friendList{
  width:100%;
  max-width:600px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.friendSelect{
  border:4px solid transparent;
  border-radius:22px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:14px;
  background:white;
  text-align:left;
  box-shadow:0 5px 0 rgba(0,0,0,.1);
}

.friendSelect.selected{
  border-color:#ffca3a;
  background:#fff8d8;
}

.friendSelect.locked{
  opacity:.4;
}

.friendSelectEmoji{
  font-size:42px;
}

.friendSelectName{
  font-size:19px;
  font-weight:900;
}

.friendSelectSkill{
  font-size:13px;
  color:#666;
  margin-top:3px;
}

/* バトル */

#battleScreen{
  justify-content:flex-start;
  padding-top:82px;
  background:linear-gradient(#ffd29b,#ffebd2);
}

.battleArea{
  width:100%;
  max-width:650px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.enemyArea{
  background:rgba(255,255,255,.88);
  border-radius:24px;
  padding:13px;
  text-align:center;
}

.enemyEmoji{
  font-size:67px;
}

.enemyName{
  font-size:21px;
  font-weight:900;
}

.hpBar{
  width:100%;
  height:16px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}

.hpFill{
  height:100%;
  width:100%;
  background:#4bd36a;
  transition:.3s;
}

.partyArea{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.partyMember{
  background:white;
  border-radius:18px;
  padding:8px;
  text-align:center;
  font-size:11px;
  font-weight:900;
}

.partyEmoji{
  font-size:30px;
}

.battleLog{
  background:rgba(255,255,255,.92);
  border-radius:18px;
  padding:13px;
  min-height:75px;
  font-size:16px;
  font-weight:bold;
  line-height:1.5;
}

.commandGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.command{
  border:none;
  border-radius:18px;
  padding:14px 7px;
  font-size:15px;
  font-weight:900;
  color:white;
}

.attack{background:#ff6b6b;}
.skill{background:#7b6cff;}
.heal{background:#42c978;}
.friendSkill{background:#ff9f43;}
.run{background:#777;}

.command:disabled{
  opacity:.45;
}

/* エンディング */

#endingScreen{
  background:linear-gradient(#19144d,#51308c,#ff91b8);
  color:white;
}

.endingTitle{
  font-size:35px;
  font-weight:900;
  text-align:center;
}

.endingCharacters{
  font-size:42px;
  text-align:center;
  margin:22px 0;
}

.endingText{
  text-align:center;
  font-size:18px;
  line-height:1.8;
}

.restart{
  margin-top:20px;
  color:#51308c;
}

/* トースト */

.toast{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 20px;
  border-radius:30px;
  font-weight:bold;
  display:none;
  z-index:100;
  text-align:center;
}

@media(max-height:650px){
  .heroCharacter{height:130px;}
  .heroEmoji{font-size:50px;}
  .characterCard{height:125px;}
  .storyText{min-height:100px;font-size:17px;}
}
</style>
</head>

<body>

<div id="game">

<!-- タイトル -->
<div id="titleScreen" class="screen active">

<div class="title">タイチとハナの大冒険</div>

<div class="subtitle">
〜世界をめぐる友情の冒険〜
</div>

<div class="hero">
<div class="heroCharacter taichi">
<div class="heroEmoji">🧒🏻🪲</div>
<div class="heroName">タイチ</div>
</div>

<div class="heroCharacter hana">
<div class="heroEmoji">👧🏻🌸</div>
<div class="heroName">ハナ</div>
</div>
</div>

<button class="startButton" onclick="newGame()">
🌟 はじめから
</button>

<button id="continueButton"
class="startButton continueButton"
onclick="continueGame()">
▶️ つづきから
</button>

</div>

<!-- マップ -->
<div id="mapScreen" class="screen">

<div class="topBar">
<div class="gameTitle">🌍 世界マップ</div>

<div class="status">
<div class="statusBox">Lv <span id="level">1</span></div>
<div class="statusBox">EXP <span id="exp">0</span>/100</div>
</div>
</div>

<div class="mapTitle">次はどこへ行く？</div>

<div class="worldList">

<button id="world0" class="world" onclick="enterWorld(0)">
<div class="worldIcon forest">🪲</div>
<div class="worldInfo">
<h2>① クワガタの森</h2>
<p>レインボーとの出会い</p>
</div>
</button>

<button id="world1" class="world locked" onclick="enterWorld(1)">
<div class="worldIcon town">🦹‍♂️</div>
<div class="worldInfo">
<h2>② ドキドキ怪盗タウン</h2>
<p>ちび怪盗くんが待っている！</p>
</div>
</button>

<button id="world2" class="world locked" onclick="enterWorld(2)">
<div class="worldIcon sky">☁️</div>
<div class="worldInfo">
<h2>③ くもくもの空島</h2>
<p>空に浮かぶ不思議な島</p>
</div>
</button>

<button id="world3" class="world locked" onclick="enterWorld(3)">
<div class="worldIcon sea">🦈</div>
<div class="worldInfo">
<h2>④ シャーキュンの海</h2>
<p>海の仲間たちの冒険</p>
</div>
</button>

<button id="world4" class="world locked" onclick="enterWorld(4)">
<div class="worldIcon castle">👑</div>
<div class="worldInfo">
<h2>⑤ ますみん城</h2>
<p>世界最後の大冒険！</p>
</div>
</button>

<button id="world5" class="world locked" onclick="enterTrueBoss()">
<div class="worldIcon castle">⭐</div>
<div class="worldInfo">
<h2>真・ますみん</h2>
<p>クリア後の最強バトル！</p>
</div>
</button>

</div>
</div>

<!-- ストーリー -->
<div id="storyScreen" class="screen">

<div class="topBar">
<div class="gameTitle" id="worldTitle">冒険</div>
<button class="mainButton" onclick="showMap()">マップ</button>
</div>

<div class="characterStage">
<div class="characterCard taichi">
<div class="characterEmoji">🧒🏻🪲</div>
<div class="characterName">タイチ</div>
</div>

<div class="characterCard hana">
<div class="characterEmoji">👧🏻🌸</div>
<div class="characterName">ハナ</div>
</div>
</div>

<div class="storyBox">
<div id="storyText" class="storyText"></div>

<button class="nextButton" onclick="nextStory()">
つぎへ ▶
</button>
</div>

</div>

<!-- 仲間加入 -->
<div id="friendScreen" class="screen">

<div id="friendEmoji" class="friendBig"></div>

<div id="friendName" class="friendTitle"></div>

<div id="friendText" class="friendText"></div>

<button class="nextButton" onclick="showPartySelect()">
仲間を選ぶ！
</button>

</div>

<!-- 仲間選択 -->
<div id="partyScreen" class="screen">

<div class="topBar">
<div class="gameTitle">👥 仲間を選ぼう</div>
<button class="mainButton" onclick="showMap()">マップ</button>
</div>

<div class="partyTitle">一緒に戦う仲間</div>

<div class="partyHelp">
仲間を1人選んで冒険へ出発！
</div>

<div id="friendList" class="friendList"></div>

<button class="nextButton"
onclick="startBattle()">
⚔️ この仲間と戦う！
</button>

</div>

<!-- バトル -->
<div id="battleScreen" class="screen">

<div class="topBar">
<div class="gameTitle">⚔️ バトル！</div>
<div class="status">
<div class="statusBox">Lv <span id="battleLevel">1</span></div>
</div>
</div>

<div class="battleArea">

<div class="enemyArea">
<div id="enemyEmoji" class="enemyEmoji"></div>
<div id="enemyName" class="enemyName"></div>

<div class="hpBar">
<div id="enemyHp" class="hpFill"></div>
</div>
</div>

<div class="partyArea">

<div class="partyMember">
<div class="partyEmoji">🧒🏻🪲</div>
タイチ
<div class="hpBar">
<div id="taichiHp" class="hpFill"></div>
</div>
</div>

<div class="partyMember">
<div class="partyEmoji">👧🏻🌸</div>
ハナ
<div class="hpBar">
<div id="hanaHp" class="hpFill"></div>
</div>
</div>

<div class="partyMember">
<div id="battleFriendEmoji" class="partyEmoji">❓</div>
<div id="battleFriendName">仲間</div>
<div class="hpBar">
<div id="friendHp" class="hpFill"></div>
</div>
</div>

</div>

<div id="battleLog" class="battleLog">
敵が現れた！
</div>

<div class="commandGrid">

<button class="command attack" onclick="attack()">
⚔️ こうげき
</button>

<button id="specialButton"
class="command skill"
onclick="specialAttack()">
🪲 必殺技
</button>

<button class="command heal" onclick="heal()">
💖 ハナ回復
</button>

<button id="friendSkillButton"
class="command friendSkill"
onclick="useFriendSkill()">
✨ 仲間技
</button>

<button class="command run" onclick="runAway()">
💨 にげる
</button>

</div>

</div>
</div>

<!-- エンディング -->
<div id="endingScreen" class="screen">

<div class="endingTitle">
🎉 大冒険クリア！ 🎉
</div>

<div class="endingCharacters">
🧒🏻🪲 👧🏻🌸 🪲 🦹‍♂️ ☁️ 🦈 🦎 🦗 👑
</div>

<div class="endingText">
タイチとハナは、<br>
たくさんの仲間たちと力を合わせ、<br>
世界を救いました！<br><br>

そして二人の冒険は、<br>
これからもずっと続くのでした……✨<br><br>

⭐ 真・ますみんが現れた！
</div>

<button class="mainButton restart"
onclick="showMap()">
クリア後の世界へ！
</button>

</div>

<div id="toast" class="toast"></div>

</div>

<script>

/* =====================
ワールド
===================== */

const worlds = [

{
name:"クワガタの森",
friend:"レインボー",
friendEmoji:"🪲",
skill:"レインボーホーン",
enemy:"森のいたずらモンスター",
enemyEmoji:"🐛",
stories:[
"ある日、タイチとハナの前に不思議な光が現れました。",
"光の先にあったのは、巨大なクワガタの森！",
"タイチ「すごい！クワガタがいっぱいだ！」",
"すると森の奥から、虹色に輝くクワガタが現れました。"
]
},

{
name:"ドキドキ怪盗タウン",
friend:"ちび怪盗くん",
friendEmoji:"🦹‍♂️",
skill:"怪盗トリック",
enemy:"パリピタイタイ",
enemyEmoji:"😎",
stories:[
"次に二人が訪れたのは、ドキドキ怪盗タウン。",
"町では大切な宝物が次々となくなっていました。",
"そこへ現れたのは、謎のちび怪盗くん！",
"ちび怪盗くん「犯人を追いかけよう！」"
]
},

{
name:"くもくもの空島",
friend:"くもくも",
friendEmoji:"☁️",
skill:"ふわふわストーム",
enemy:"空のあらしモンスター",
enemyEmoji:"🌪️",
stories:[
"雲の上には、空に浮かぶ不思議な島がありました。",
"そこで出会ったのは、ふわふわのくもくも。",
"くもくも「風が強くて、みんな困っているんだ！」",
"タイチとハナは、空島を守るために立ち上がりました。"
]
},

{
name:"シャーキュンの海",
friend:"シャーキュン",
friendEmoji:"🦈",
skill:"シャークアタック",
enemy:"たこたこ",
enemyEmoji:"🐙",
stories:[
"今度の冒険の舞台は、青く広がる大きな海。",
"そこで二人は、元気いっぱいのシャーキュンと出会いました。",
"しかし海の底では、たこたこが大暴れ！",
"みんなで力を合わせて、海を元に戻そう！"
]
},

{
name:"ますみん城",
friend:"とっくん＆カマキチ",
friendEmoji:"🦎🦗",
skill:"ダブル昆虫コンボ",
enemy:"ますみん",
enemyEmoji:"👑",
stories:[
"すべての世界を救ったタイチとハナ。",
"しかし、最後に残された場所がありました。",
"それは巨大な、ますみん城！",
"いよいよ世界をめぐる大冒険、最後の戦いです！"
]
}

];


/* =====================
ゲームデータ
===================== */

let currentWorld = 0;
let storyIndex = 0;

let level = 1;
let exp = 0;

let unlockedWorld = 0;

let clearedWorlds = [];

let unlockedFriends = [];

let selectedFriend = null;

let gameCleared = false;

let trueBossMode = false;


/* HP */

let enemyMaxHp = 100;
let enemyCurrentHp = 100;

let taichiMaxHp = 100;
let taichiCurrentHp = 100;

let hanaMaxHp = 100;
let hanaCurrentHp = 100;

let friendMaxHp = 100;
let friendCurrentHp = 100;

let battleLocked = false;


/* =====================
保存
===================== */

function saveGame(){

const data = {
level,
exp,
unlockedWorld,
clearedWorlds,
unlockedFriends,
selectedFriend,
gameCleared
};

localStorage.setItem(
"taichiHanaAdventureSave",
JSON.stringify(data)
);

}


function loadGame(){

const saved =
localStorage.getItem(
"taichiHanaAdventureSave"
);

if(!saved){
return false;
}

try{

const data = JSON.parse(saved);

level = data.level || 1;
exp = data.exp || 0;
unlockedWorld = data.unlockedWorld || 0;

clearedWorlds =
data.clearedWorlds || [];

unlockedFriends =
data.unlockedFriends || [];

selectedFriend =
data.selectedFriend || null;

gameCleared =
data.gameCleared || false;

return true;

}catch(error){

return false;

}

}


/* =====================
画面
===================== */

function showScreen(id){

document.querySelectorAll(".screen")
.forEach(screen=>{
screen.classList.remove("active");
});

document
.getElementById(id)
.classList.add("active");

}


/* =====================
タイトル
===================== */

function updateTitle(){

const hasSave = !!localStorage.getItem(
"taichiHanaAdventureSave"
);

document
.getElementById("continueButton")
.style.display =
hasSave ? "inline-block" : "none";

}


function newGame(){

if(
!confirm(
"最初から新しい冒険を始める？\n今のセーブデータは上書きされるよ。"
)
){
return;
}

level = 1;
exp = 0;
unlockedWorld = 0;
clearedWorlds = [];
unlockedFriends = [];
selectedFriend = null;
gameCleared = false;

saveGame();

showMap();

}


function continueGame(){

if(loadGame()){
showMap();
}else{
newGame();
}

}


/* =====================
マップ
===================== */

function showMap(){

showScreen("mapScreen");

updateStatus();
updateWorldLocks();

saveGame();

}


function updateStatus(){

document
.getElementById("level")
.textContent = level;

document
.getElementById("exp")
.textContent = exp;

}


function updateWorldLocks(){

for(let i=0;i<5;i++){

const world =
document.getElementById(
"world"+i
);

world.classList.remove(
"locked",
"cleared"
);

if(i > unlockedWorld){
world.classList.add("locked");
}

if(clearedWorlds.includes(i)){
world.classList.add("cleared");
}

}

const trueWorld =
document.getElementById("world5");

if(gameCleared){
trueWorld.classList.remove("locked");
}else{
trueWorld.classList.add("locked");
}

}


function enterWorld(index){

if(index > unlockedWorld){

showToast(
"まだこのワールドには行けないよ！"
);

return;

}

currentWorld = index;
storyIndex = 0;
trueBossMode = false;

document
.getElementById("worldTitle")
.textContent =
worlds[index].name;

showScreen("storyScreen");

showStory();

}


/* =====================
ストーリー
===================== */

function showStory(){

document
.getElementById("storyText")
.textContent =
worlds[currentWorld]
.stories[storyIndex];

}


function nextStory(){

storyIndex++;

if(
storyIndex <
worlds[currentWorld]
.stories.length
){

showStory();

}else{

showFriend();

}

}


/* =====================
仲間
===================== */

function showFriend(){

const world =
worlds[currentWorld];

if(
!unlockedFriends.includes(
currentWorld
)
){

unlockedFriends.push(
currentWorld
);

saveGame();

}

document
.getElementById("friendEmoji")
.textContent =
world.friendEmoji;

document
.getElementById("friendName")
.textContent =
world.friend +
" が仲間になった！";

document
.getElementById("friendText")
.textContent =
"「これからは一緒に冒険しよう！」\n\n" +
world.friend +
"の必殺技\n【" +
world.skill +
"】が使えるようになった！";

showScreen("friendScreen");

}


/* =====================
仲間選択
===================== */

function showPartySelect(){

const list =
document.getElementById(
"friendList"
);

list.innerHTML = "";

unlockedFriends
.forEach(index=>{

const friend =
worlds[index];

const button =
document.createElement("button");

button.className =
"friendSelect";

if(selectedFriend === index){
button.classList.add("selected");
}

button.innerHTML = `
<div class="friendSelectEmoji">
${friend.friendEmoji}
</div>

<div>
<div class="friendSelectName">
${friend.friend}
</div>

<div class="friendSelectSkill">
✨ ${friend.skill}
</div>
</div>
`;

button.onclick = ()=>{

selectedFriend = index;

showPartySelect();

};

list.appendChild(button);

});

showScreen("partyScreen");

}


function getCurrentFriend(){

if(selectedFriend === null){

selectedFriend =
unlockedFriends[0];

}

return worlds[selectedFriend];

}


/* =====================
バトル開始
===================== */

function startBattle(){

const world =
worlds[currentWorld];

const friend =
getCurrentFriend();

battleLocked = false;

taichiMaxHp =
100 + (level-1)*8;

hanaMaxHp =
100 + (level-1)*7;

friendMaxHp =
90 + (level-1)*9;

taichiCurrentHp =
taichiMaxHp;

hanaCurrentHp =
hanaMaxHp;

friendCurrentHp =
friendMaxHp;

if(trueBossMode){

enemyMaxHp =
650 + level*20;

}else{

enemyMaxHp =
110 +
currentWorld*70 +
level*12;

}

enemyCurrentHp =
enemyMaxHp;

document
.getElementById("enemyEmoji")
.textContent =
trueBossMode ?
"👑⭐" :
world.enemyEmoji;

document
.getElementById("enemyName")
.textContent =
trueBossMode ?
"真・ますみん" :
world.enemy;

document
.getElementById("battleFriendEmoji")
.textContent =
friend.friendEmoji;

document
.getElementById("battleFriendName")
.textContent =
friend.friend;

document
.getElementById("battleLevel")
.textContent =
level;

document
.getElementById("friendSkillButton")
.textContent =
"✨ " +
friend.skill;

document
.getElementById("battleLog")
.textContent =
(trueBossMode ?
"⭐ 真・ますみん" :
world.enemy) +
" が現れた！";

updateBattleBars();

showScreen("battleScreen");

}


/* =====================
HP表示
===================== */

function updateBattleBars(){

document
.getElementById("enemyHp")
.style.width =
Math.max(
0,
enemyCurrentHp /
enemyMaxHp * 100
) + "%";

document
.getElementById("taichiHp")
.style.width =
Math.max(
0,
taichiCurrentHp /
taichiMaxHp * 100
) + "%";

document
.getElementById("hanaHp")
.style.width =
Math.max(
0,
hanaCurrentHp /
hanaMaxHp * 100
) + "%";

document
.getElementById("friendHp")
.style.width =
Math.max(
0,
friendCurrentHp /
friendMaxHp * 100
) + "%";

}


/* =====================
攻撃
===================== */

function attack(){

if(battleLocked)return;

battleLocked = true;

const damage =
random(18,30) +
level*3;

enemyCurrentHp -= damage;

battleMessage(
"⚔️ タイチとハナのこうげき！\n" +
damage +
" ダメージ！"
);

updateBattleBars();

setTimeout(
checkEnemy,
700
);

}


/* =====================
必殺技
===================== */

function specialAttack(){

if(battleLocked)return;

battleLocked = true;

let damage;

if(level >= 30){

damage =
random(65,95) +
level*4;

battleMessage(
"🌈 超・友情パワー炸裂！\n" +
damage +
" ダメージ！"
);

}else if(level >= 10){

damage =
random(45,70) +
level*4;

battleMessage(
"🪲 クワガタブレード！\n" +
damage +
" ダメージ！"
);

}else{

damage =
random(30,50) +
level*3;

battleMessage(
"✨ 二人の友情パワー！\n" +
damage +
" ダメージ！"
);

}

enemyCurrentHp -= damage;

updateBattleBars();

setTimeout(
checkEnemy,
700
);

}


/* =====================
回復
===================== */

function heal(){

if(battleLocked)return;

battleLocked = true;

const amount =
random(25,40) +
level;

taichiCurrentHp =
Math.min(
taichiMaxHp,
taichiCurrentHp + amount
);

hanaCurrentHp =
Math.min(
hanaMaxHp,
hanaCurrentHp + amount
);

friendCurrentHp =
Math.min(
friendMaxHp,
friendCurrentHp + amount
);

battleMessage(
"💖 ハナのフラワーヒール！\n" +
"みんなのHPが " +
amount +
" 回復した！"
);

updateBattleBars();

setTimeout(
enemyAttack,
700
);

}


/* =====================
仲間技
===================== */

function useFriendSkill(){

if(battleLocked)return;

battleLocked = true;

const friend =
getCurrentFriend();

let damage =
random(35,60) +
level*4;

if(selectedFriend === 4){

damage += 25;

}

enemyCurrentHp -= damage;

battleMessage(
friend.friendEmoji +
" " +
friend.friend +
"の【" +
friend.skill +
"】！\n" +
damage +
" ダメージ！"
);

updateBattleBars();

setTimeout(
checkEnemy,
700
);

}


/* =====================
敵チェック
===================== */

function checkEnemy(){

if(enemyCurrentHp <= 0){

winBattle();

}else{

enemyAttack();

}

}


/* =====================
敵攻撃
===================== */

function enemyAttack(){

const damage =
random(12,25) +
currentWorld*5 +
(trueBossMode ? 15 : 0);

const targets = [];

if(taichiCurrentHp > 0)
targets.push("taichi");

if(hanaCurrentHp > 0)
targets.push("hana");

if(friendCurrentHp > 0)
targets.push("friend");

if(targets.length === 0){

checkPlayer();

return;

}

const target =
targets[
random(
0,
targets.length-1
)
];

if(target === "taichi"){

taichiCurrentHp -= damage;

battleMessage(
"敵の攻撃！\nタイチに " +
damage +
" ダメージ！"
);

}

if(target === "hana"){

hanaCurrentHp -= damage;

battleMessage(
"敵の攻撃！\nハナに " +
damage +
" ダメージ！"
);

}

if(target === "friend"){

friendCurrentHp -= damage;

battleMessage(
"敵の攻撃！\n仲間に " +
damage +
" ダメージ！"
);

}

updateBattleBars();

setTimeout(
checkPlayer,
600
);

}


/* =====================
敗北チェック
===================== */

function checkPlayer(){

if(
taichiCurrentHp <= 0 &&
hanaCurrentHp <= 0 &&
friendCurrentHp <= 0
){

battleMessage(
"みんなは力尽きてしまった…\nもう一度挑戦しよう！"
);

setTimeout(
startBattle,
1500
);

}else{

battleLocked = false;

}

}


/* =====================
勝利
===================== */

function winBattle(){

battleLocked = true;

const gainedExp =
trueBossMode ?
250 :
40 + currentWorld*25;

exp += gainedExp;

battleMessage(
"🎉 勝利！\nEXPを " +
gainedExp +
" かくとく！"
);

levelUpCheck();

if(trueBossMode){

saveGame();

setTimeout(()=>{

alert(
"🎉 真・ますみんを倒した！\n\nタイチとハナは、最強の冒険者になった！"
);

showMap();

},1500);

return;

}

if(
!clearedWorlds.includes(
currentWorld
)
){

clearedWorlds.push(
currentWorld
);

}

if(currentWorld < 4){

unlockedWorld =
Math.max(
unlockedWorld,
currentWorld+1
);

}else{

gameCleared = true;

}

saveGame();

setTimeout(()=>{

if(currentWorld === 4){

showScreen(
"endingScreen"
);

}else{

showMap();

}

},1500);

}


/* =====================
レベルアップ
===================== */

function levelUpCheck(){

let leveled = false;

while(
exp >= 100 &&
level < 50
){

exp -= 100;

level++;

leveled = true;

}

if(level >= 50){

level = 50;

if(exp > 99){
exp = 99;
}

}

if(leveled){

showToast(
"🎉 レベルアップ！\nLv." +
level
);

}

saveGame();

}


/* =====================
真・ますみん
===================== */

function enterTrueBoss(){

if(!gameCleared){

showToast(
"まずは、ますみん城をクリアしよう！"
);

return;

}

currentWorld = 4;

trueBossMode = true;

showPartySelect();

}


/* =====================
逃げる
===================== */

function runAway(){

if(battleLocked)return;

battleLocked = true;

battleMessage(
"💨 うまく逃げ切った！"
);

setTimeout(
showMap,
800
);

}


/* =====================
メッセージ
===================== */

function battleMessage(text){

document
.getElementById("battleLog")
.textContent =
text;

}


/* =====================
ランダム
===================== */

function random(min,max){

return Math.floor(
Math.random() *
(max-min+1)
) + min;

}


/* =====================
トースト
===================== */

function showToast(message){

const toast =
document.getElementById(
"toast"
);

toast.textContent =
message;

toast.style.display =
"block";

setTimeout(()=>{

toast.style.display =
"none";

},2200);

}


/* =====================
起動
===================== */

updateTitle();

</script>

</body>
</html>
