<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>タイチとハナの大冒険</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    sans-serif;
}

body{
  background:#222;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #62b7e8 0%,
      #8ed2ef 43%,
      #69a941 44%,
      #3f7f2d 100%
    );
}

/* =========================
   タイトル
========================= */

#title{
  position:absolute;
  top:18px;
  left:50%;

  transform:
    translateX(-50%);

  width:100%;

  text-align:center;

  font-size:24px;
  font-weight:900;

  color:white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.45);

  z-index:20;
}

/* =========================
   ステージ表示
========================= */

#stageLabel{
  position:absolute;

  top:48px;
  left:50%;

  transform:
    translateX(-50%);

  z-index:20;

  background:
    rgba(33,100,35,.82);

  color:white;

  padding:
    6px 18px;

  border-radius:20px;

  font-size:15px;
  font-weight:900;

  box-shadow:
    0 4px 10px rgba(0,0,0,.18);
}

/* =========================
   ステータス
========================= */

#status{
  position:absolute;

  top:80px;
  left:50%;

  transform:
    translateX(-50%);

  display:flex;
  flex-wrap:wrap;

  justify-content:center;

  gap:10px;

  width:310px;

  z-index:20;
}

.statusBox{
  background:
    rgba(255,255,255,.9);

  border-radius:22px;

  padding:
    10px 18px;

  font-size:20px;
  font-weight:800;

  min-width:140px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.18);
}

/* =========================
   キャラクター選択
========================= */

#characterSelect{
  position:absolute;

  top:165px;
  left:50%;

  transform:
    translateX(-50%);

  display:flex;

  gap:10px;

  z-index:20;
}

.characterButton{
  border:none;

  border-radius:22px;

  padding:
    12px 18px;

  font-size:20px;

  font-weight:900;

  background:white;

  color:#2870bb;

  box-shadow:
    0 5px 14px rgba(0,0,0,.2);

  cursor:pointer;
}

.characterButton.active{
  background:
    linear-gradient(
      135deg,
      #ffd94c,
      #ffb82e
    );

  color:white;
}

/* =========================
   空
========================= */

.cloud{
  position:absolute;

  font-size:62px;

  filter:
    drop-shadow(
      0 5px 4px rgba(0,0,0,.15)
    );

  pointer-events:none;
}

#cloud1{
  top:250px;
  left:30px;
}

#cloud2{
  top:330px;
  right:35px;
}

/* =========================
   木
========================= */

.tree{
  position:absolute;

  font-size:100px;

  bottom:290px;

  pointer-events:none;
}

#tree1{
  left:30px;
}

#tree2{
  right:25px;
}

/* =========================
   虫
========================= */

.bug{
  position:absolute;

  font-size:62px;

  cursor:pointer;

  z-index:10;

  transition:
    transform .15s,
    opacity .25s;

  user-select:none;

  -webkit-user-select:none;
}

.bug:active{
  transform:
    scale(1.35)
    rotate(10deg);
}

#bug1{
  top:280px;
  left:110px;
}

#bug2{
  top:240px;
  right:120px;
}

#bug3{
  top:430px;
  left:150px;
}

#bug4{
  top:390px;
  right:80px;
}

#bug5{
  top:500px;
  left:55%;
}

/* =========================
   プレイヤー
========================= */

#player{
  position:absolute;

  left:50%;

  bottom:210px;

  transform:
    translateX(-50%);

  z-index:15;

  text-align:center;

  transition:
    left .12s linear,
    bottom .12s linear;
}

#playerFace{
  width:82px;
  height:82px;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:52px;

  background:white;

  border-radius:50%;

  border:
    5px solid
    rgba(255,255,255,.9);

  box-shadow:
    0 6px 15px
    rgba(0,0,0,.3);
}

#playerName{
  display:inline-block;

  margin-top:5px;

  background:white;

  padding:
    6px 18px;

  border-radius:20px;

  font-size:18px;

  font-weight:900;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,.2);
}

/* =========================
   操作ボタン
========================= */

#controls{
  position:absolute;

  bottom:20px;
  left:50%;

  transform:
    translateX(-50%);

  width:100%;

  z-index:30;
}

#upRow{
  display:flex;

  justify-content:center;

  margin-bottom:10px;
}

#downRow{
  display:flex;

  justify-content:center;

  gap:12px;
}

.controlButton{
  width:95px;

  height:85px;

  border:none;

  border-radius:22px;

  background:
    rgba(255,255,255,.9);

  font-size:46px;

  color:#2477bd;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.25);

  cursor:pointer;

  user-select:none;

  -webkit-user-select:none;
}

.controlButton:active{
  transform:
    scale(.94);

  background:#e6f2ff;
}

/* =========================
   メッセージ
========================= */

#message{
  position:absolute;

  top:225px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(-20px);

  background:
    rgba(0,0,0,.75);

  color:white;

  padding:
    12px 22px;

  border-radius:25px;

  font-weight:900;

  font-size:20px;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .25s,
    transform .25s;

  z-index:50;

  white-space:nowrap;
}

#message.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   ステージクリア
========================= */

#clearScreen{
  position:absolute;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.55);

  z-index:100;

  padding:25px;
}

#clearScreen.show{
  display:flex;
}

#clearBox{
  width:min(360px, 100%);

  background:
    linear-gradient(
      135deg,
      #fff8b0,
      #ffffff
    );

  border-radius:30px;

  padding:
    35px 25px;

  text-align:center;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.35);
}

#clearTitle{
  font-size:32px;

  font-weight:900;

  color:#d88900;
}

#clearText{
  margin-top:15px;

  font-size:19px;

  font-weight:800;

  line-height:1.6;
}

#clearPoints{
  margin-top:15px;

  font-size:22px;

  font-weight:900;

  color:#e05d00;
}

#restartButton{
  margin-top:25px;

  width:100%;

  border:none;

  border-radius:22px;

  padding:16px;

  font-size:20px;

  font-weight:900;

  color:white;

  background:
    linear-gradient(
      135deg,
      #4caf50,
      #218838
    );

  box-shadow:
    0 6px 14px
    rgba(0,0,0,.2);

  cursor:pointer;
}

#restartButton:active{
  transform:
    scale(.97);
}

/* =========================
   モバイル調整
========================= */

@media(max-height:700px){

  #title{
    top:10px;
    font-size:20px;
  }

  #stageLabel{
    top:40px;
  }

  #status{
    top:70px;
  }

  #characterSelect{
    top:145px;
  }

  .controlButton{
    width:82px;
    height:72px;
    font-size:40px;
  }

}

</style>
</head>

<body>

<div id="game">

  <div id="title">
    🌍 タイチとハナの大冒険 🌍
  </div>

  <div id="stageLabel">
    🌲 ステージ1：虫の森
  </div>

  <div id="status">

    <div class="statusBox">
      ⭐ ポイント：<span id="points">0</span>
    </div>

    <div class="statusBox">
      🐞 虫：<span id="bugCount">0</span> / 5匹
    </div>

  </div>

  <div id="characterSelect">

    <button
      id="taichiButton"
      class="characterButton active"
    >
      🧒 タイチ
    </button>

    <button
      id="hanaButton"
      class="characterButton"
    >
      👧 ハナ
    </button>

  </div>

  <div
    id="cloud1"
    class="cloud"
  >
    ☁️
  </div>

  <div
    id="cloud2"
    class="cloud"
  >
    ☁️
  </div>

  <div
    id="tree1"
    class="tree"
  >
    🌳
  </div>

  <div
    id="tree2"
    class="tree"
  >
    🌲
  </div>

  <!-- 虫 -->

  <div
    class="bug"
    id="bug1"
    data-name="カブトムシ"
    data-points="10"
  >
    🪲
  </div>

  <div
    class="bug"
    id="bug2"
    data-name="ちょうちょ"
    data-points="5"
  >
    🦋
  </div>

  <div
    class="bug"
    id="bug3"
    data-name="バッタ"
    data-points="8"
  >
    🦗
  </div>

  <div
    class="bug"
    id="bug4"
    data-name="てんとう虫"
    data-points="6"
  >
    🐞
  </div>

  <div
    class="bug"
    id="bug5"
    data-name="いもむし"
    data-points="7"
  >
    🐛
  </div>

  <!-- プレイヤー -->

  <div id="player">

    <div id="playerFace">
      🧒
    </div>

    <div id="playerName">
      タイチ
    </div>

  </div>

  <!-- メッセージ -->

  <div id="message">
    虫をゲット！
  </div>

  <!-- 操作ボタン -->

  <div id="controls">

    <div id="upRow">

      <button
        class="controlButton"
        id="upButton"
      >
        ↑
      </button>

    </div>

    <div id="downRow">

      <button
        class="controlButton"
        id="leftButton"
      >
        ←
      </button>

      <button
        class="controlButton"
        id="downButton"
      >
        ↓
      </button>

      <button
        class="controlButton"
        id="rightButton"
      >
        →
      </button>

    </div>

  </div>

  <!-- ステージクリア -->

  <div id="clearScreen">

    <div id="clearBox">

      <div id="clearTitle">
        🎉 ステージ1クリア！ 🎉
      </div>

      <div id="clearText">
        虫の森の虫を<br>
        全部見つけた！
      </div>

      <div id="clearPoints">
        ⭐ クリアボーナス +100！
      </div>

      <button id="restartButton">
        🔄 もう一度遊ぶ
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   要素
========================= */

const player =
  document.getElementById("player");

const playerFace =
  document.getElementById("playerFace");

const playerName =
  document.getElementById("playerName");

const pointsDisplay =
  document.getElementById("points");

const bugCountDisplay =
  document.getElementById("bugCount");

const message =
  document.getElementById("message");

const clearScreen =
  document.getElementById("clearScreen");

const restartButton =
  document.getElementById("restartButton");

const taichiButton =
  document.getElementById("taichiButton");

const hanaButton =
  document.getElementById("hanaButton");


/* =========================
   ゲームデータ
========================= */

let points = 0;

let bugCount = 0;

const totalBugs = 5;

let gameCleared = false;


/* =========================
   プレイヤー位置
========================= */

let playerX = 50;

let playerBottom = 210;


/* =========================
   キャラクター変更
========================= */

taichiButton.addEventListener(
  "click",
  function(){

    if(gameCleared){
      return;
    }

    playerFace.textContent =
      "🧒";

    playerName.textContent =
      "タイチ";

    taichiButton.classList.add(
      "active"
    );

    hanaButton.classList.remove(
      "active"
    );

    showMessage(
      "🧒 タイチに交代！"
    );

  }
);


hanaButton.addEventListener(
  "click",
  function(){

    if(gameCleared){
      return;
    }

    playerFace.textContent =
      "👧";

    playerName.textContent =
      "ハナ";

    hanaButton.classList.add(
      "active"
    );

    taichiButton.classList.remove(
      "active"
    );

    showMessage(
      "👧 ハナに交代！"
    );

  }
);


/* =========================
   移動
========================= */

function movePlayer(
  direction
){

  if(gameCleared){
    return;
  }

  const step = 7;


  if(direction === "left"){

    playerX -= step;

  }


  if(direction === "right"){

    playerX += step;

  }


  if(direction === "up"){

    playerBottom += 55;

  }


  if(direction === "down"){

    playerBottom -= 55;

  }


  if(playerX < 10){

    playerX = 10;

  }


  if(playerX > 90){

    playerX = 90;

  }


  if(playerBottom < 170){

    playerBottom = 170;

  }


  if(playerBottom > 520){

    playerBottom = 520;

  }


  player.style.left =
    playerX + "%";


  player.style.bottom =
    playerBottom + "px";


  /* =========================
     移動後に虫との当たり判定
  ========================= */

  checkBugCollisions();

}


/* =========================
   虫をゲットする共通処理
========================= */

function catchBug(
  bug
){

  /* すでに捕まえた虫なら終了 */

  if(
    !bug ||
    bug.dataset.caught === "true" ||
    gameCleared
  ){

    return;

  }


  /* 捕獲済みにする */

  bug.dataset.caught =
    "true";


  const bugName =
    bug.dataset.name;


  const bugPoints =
    Number(
      bug.dataset.points
    );


  /* ポイント追加 */

  points +=
    bugPoints;


  bugCount += 1;


  /* 表示更新 */

  pointsDisplay.textContent =
    points;


  bugCountDisplay.textContent =
    bugCount;


  /* 捕獲演出 */

  bug.style.pointerEvents =
    "none";


  bug.style.transform =
    "scale(1.7) rotate(20deg)";


  bug.style.opacity =
    "0";


  showMessage(
    "🎉 " +
    bugName +
    "をゲット！ +" +
    bugPoints
  );


  /* 少し後に消す */

  setTimeout(
    function(){

      if(
        bug.parentNode
      ){

        bug.remove();

      }


      /* 全部捕まえたか確認 */

      if(
        bugCount >=
        totalBugs
      ){

        stageClear();

      }

    },
    250
  );

}


/* =========================
   虫をタップしてゲット
========================= */

function setupBugTap(){

  const bugs =
    document.querySelectorAll(
      ".bug"
    );


  bugs.forEach(
    function(bug){

      bug.addEventListener(
        "click",
        function(event){

          event.stopPropagation();

          catchBug(
            bug
          );

        }
      );

    }
  );

}


setupBugTap();


/* =========================
   虫との当たり判定
========================= */

function checkBugCollisions(){

  const bugs =
    document.querySelectorAll(
      ".bug"
    );


  const playerRect =
    player.getBoundingClientRect();


  bugs.forEach(
    function(bug){

      /* 捕獲済みは無視 */

      if(
        bug.dataset.caught ===
        "true"
      ){

        return;

      }


      const bugRect =
        bug.getBoundingClientRect();


      /*
        当たり判定

        プレイヤーと虫の
        四角形が重なったら
        ゲット
      */

      const isColliding =

        playerRect.left <
        bugRect.right

        &&

        playerRect.right >
        bugRect.left

        &&

        playerRect.top <
        bugRect.bottom

        &&

        playerRect.bottom >
        bugRect.top;


      if(
        isColliding
      ){

        catchBug(
          bug
        );

      }

    }
  );

}


/* =========================
   操作ボタン
========================= */

document
.getElementById("upButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "up"
    );

  }
);


document
.getElementById("downButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "down"
    );

  }
);


document
.getElementById("leftButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "left"
    );

  }
);


document
.getElementById("rightButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "right"
    );

  }
);


/* =========================
   ステージクリア
========================= */

function stageClear(){

  if(gameCleared){
    return;
  }


  gameCleared =
    true;


  setTimeout(
    function(){

      points +=
        100;


      pointsDisplay.textContent =
        points;


      clearScreen.classList.add(
        "show"
      );

    },
    700
  );

}


/* =========================
   もう一度遊ぶ
========================= */

restartButton.addEventListener(
  "click",
  function(){

    location.reload();

  }
);


/* =========================
   メッセージ
========================= */

function showMessage(
  text
){

  message.textContent =
    text;


  message.classList.add(
    "show"
  );


  setTimeout(
    function(){

      message.classList.remove(
        "show"
      );

    },
    1600
  );

}


/* =========================
   PCキーボード操作
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "ArrowUp"){

      movePlayer(
        "up"
      );

    }


    if(event.key === "ArrowDown"){

      movePlayer(
        "down"
      );

    }


    if(event.key === "ArrowLeft"){

      movePlayer(
        "left"
      );

    }


    if(event.key === "ArrowRight"){

      movePlayer(
        "right"
      );

    }

  }
);


</script>

</body>
</html>
