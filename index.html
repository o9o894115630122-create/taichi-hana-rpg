<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>タイチとハナの大冒険</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
    "Yu Gothic", sans-serif;
  background: linear-gradient(180deg, #79cfff, #dff6ff);
  color: #222;
  overflow: hidden;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* =========================
   タイトル画面
========================= */

#titleScreen {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(70,180,255,0.8), rgba(255,255,255,0.9)),
    radial-gradient(circle at center, #fff, #8fdcff);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  text-align: center;
  padding: 20px;
}

.title-logo {
  font-size: 42px;
  font-weight: 900;
  color: #ff4f91;
  text-shadow:
    3px 3px 0 white,
    5px 5px 0 #7b4bff;
  line-height: 1.25;
}

.subtitle {
  font-size: 18px;
  margin-top: 15px;
  font-weight: bold;
}

#startButton {
  margin-top: 40px;
  padding: 18px 45px;
  border: none;
  border-radius: 50px;
  font-size: 24px;
  font-weight: bold;
  background: linear-gradient(135deg, #ff4f91, #ff8a4f);
  color: white;
  box-shadow: 0 7px 0 #b93367;
}

#startButton:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 #b93367;
}

/* =========================
   ゲーム画面
========================= */

#gameScreen {
  display: none;
  width: 100%;
  height: 100%;
}

#topBar {
  height: 90px;
  background: rgba(255,255,255,0.88);
  border-bottom: 3px solid #ffffff;
  padding: 10px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  position: relative;
  z-index: 20;
}

#worldName {
  font-size: 19px;
  font-weight: 900;
  text-align: center;
}

#message {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  min-height: 20px;
}

/* =========================
   マップ
========================= */

#map {
  position: absolute;
  top: 90px;
  bottom: 170px;
  left: 0;
  right: 0;
  overflow: hidden;
  transition: background 0.5s;
}

.world-forest {
  background:
    radial-gradient(circle at 20% 20%, #c5ff9e 0 8%, transparent 9%),
    radial-gradient(circle at 70% 30%, #8ee67b 0 10%, transparent 11%),
    linear-gradient(#8ce8ff 0 45%, #75c85b 45% 100%);
}

.world-sea {
  background:
    radial-gradient(circle at 30% 20%, #ffffff99 0 4%, transparent 5%),
    linear-gradient(#72d8ff 0%, #178bd8 100%);
}

.world-castle {
  background:
    radial-gradient(circle at 50% 20%, #fff 0 5%, transparent 6%),
    linear-gradient(#55466f, #201a35);
}

.world-fire {
  background:
    radial-gradient(circle at 50% 30%, #ffcf4f 0 10%, transparent 11%),
    linear-gradient(#ff754f, #a91f24);
}

.world-final {
  background:
    radial-gradient(circle at 50% 25%, #ffb5d4 0 10%, transparent 11%),
    linear-gradient(#6b3c78, #1e1530);
}

/* =========================
   キャラクター
========================= */

.character {
  position: absolute;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 37px;
  border: 4px solid white;
  box-shadow: 0 5px 10px rgba(0,0,0,0.25);
  transition: left 0.12s linear, top 0.12s linear;
  z-index: 10;
}

#player {
  background: linear-gradient(135deg, #ffcb52, #ff774f);
}

#partner {
  background: linear-gradient(135deg, #ff8ac2, #c466ff);
}

.enemy {
  background: linear-gradient(135deg, #4b4b4b, #1e1e1e);
}

.friend {
  background: linear-gradient(135deg, #7cffb3, #28a55e);
}

/* =========================
   HP
========================= */

#status {
  position: absolute;
  top: 95px;
  left: 10px;
  right: 10px;
  z-index: 30;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.statusCard {
  background: rgba(255,255,255,0.9);
  border-radius: 14px;
  padding: 7px 12px;
  min-width: 130px;
  text-align: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

.hpbar {
  width: 100%;
  height: 10px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 4px;
}

.hp {
  height: 100%;
  width: 100%;
  background: #49c768;
  transition: width 0.3s;
}

/* =========================
   操作ボタン
========================= */

#controls {
  position: absolute;
  bottom: 0;
  height: 170px;
  left: 0;
  right: 0;
  background: rgba(255,255,255,0.92);
  border-top: 3px solid white;
  display: flex;
  justify-content: space-between;
  padding: 15px;
}

#dpad {
  width: 180px;
  position: relative;
}

.controlButton {
  width: 55px;
  height: 55px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(#ffffff, #dfeaff);
  box-shadow: 0 4px 0 #9eb1c8;
  font-size: 24px;
  font-weight: bold;
}

.controlButton:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #9eb1c8;
}

#up {
  position: absolute;
  left: 62px;
  top: 0;
}

#left {
  position: absolute;
  left: 0;
  top: 58px;
}

#down {
  position: absolute;
  left: 62px;
  top: 58px;
}

#right {
  position: absolute;
  left: 124px;
  top: 58px;
}

#actionArea {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
}

.actionButton {
  min-width: 150px;
  padding: 15px;
  border: none;
  border-radius: 25px;
  font-size: 17px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, #ff4f91, #9a55ff);
  box-shadow: 0 4px 0 #6930b2;
}

.actionButton:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #6930b2;
}

/* =========================
   バトル画面
========================= */

#battleScreen {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 200;
  background:
    radial-gradient(circle at center, #ffffff, #b4ddff);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#enemyName {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 15px;
}

#enemySprite {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 70px;
  background: #333;
  border: 6px solid white;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

#battleMessage {
  margin: 25px 0;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  min-height: 50px;
}

#battleButtons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 380px;
}

.battleButton {
  padding: 18px 8px;
  border: none;
  border-radius: 18px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  background: linear-gradient(135deg, #ff5b5b, #ff9f4f);
  box-shadow: 0 5px 0 #bd4c35;
}

.battleButton:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #bd4c35;
}

#enemyHPWrap {
  width: 100%;
  max-width: 350px;
  margin-top: 15px;
}

#enemyHPBar {
  width: 100%;
  height: 20px;
  border-radius: 20px;
  background: #ddd;
  overflow: hidden;
}

#enemyHP {
  height: 100%;
  width: 100%;
  background: #ff4b4b;
  transition: width 0.4s;
}

/* =========================
   イベント
========================= */

#eventPopup {
  position: absolute;
  z-index: 300;
  left: 20px;
  right: 20px;
  top: 25%;
  background: white;
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  display: none;
  text-align: center;
}

#eventText {
  font-size: 19px;
  line-height: 1.7;
  font-weight: bold;
}

#eventButton {
  margin-top: 20px;
  padding: 14px 40px;
  border: none;
  border-radius: 30px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  background: #6b63ff;
}

#worldProgress {
  position: absolute;
  top: 145px;
  right: 10px;
  z-index: 40;
  background: rgba(255,255,255,0.85);
  padding: 8px 12px;
  border-radius: 15px;
  font-size: 13px;
  font-weight: bold;
}

</style>
</head>

<body>

<div id="game">

<!-- タイトル -->

<div id="titleScreen">

  <div class="title-logo">
    タイチとハナの<br>
    大冒険！
  </div>

  <div class="subtitle">
    🌍 ふしぎな世界を旅して<br>
    仲間を集め、ますみんを救え！
  </div>

  <button id="startButton" onclick="startGame()">
    ▶ ぼうけんをはじめる！
  </button>

</div>


<!-- ゲーム -->

<div id="gameScreen">

  <div id="topBar">
    <div id="worldName">🌳 はじまりの森</div>
    <div id="message">
      タイチとハナの冒険が始まる！
    </div>
  </div>

  <div id="map" class="world-forest">

    <div id="status">

      <div class="statusCard">
        🧒 タイチ
        <div class="hpbar">
          <div id="taichiHP" class="hp"></div>
        </div>
      </div>

      <div class="statusCard">
        👧 ハナ
        <div class="hpbar">
          <div id="hanaHP" class="hp"></div>
        </div>
      </div>

    </div>

    <div id="worldProgress">
      ワールド 1 / 5
    </div>

    <div id="player" class="character">
      🧒
    </div>

    <div id="partner" class="character">
      👧
    </div>

  </div>


  <!-- 操作 -->

  <div id="controls">

    <div id="dpad">

      <button id="up" class="controlButton" onclick="movePlayer(0,-1)">▲</button>

      <button id="left" class="controlButton" onclick="movePlayer(-1,0)">◀</button>

      <button id="down" class="controlButton" onclick="movePlayer(0,1)">▼</button>

      <button id="right" class="controlButton" onclick="movePlayer(1,0)">▶</button>

    </div>

    <div id="actionArea">

      <button class="actionButton" onclick="searchArea()">
        🔍 しらべる
      </button>

      <button class="actionButton" onclick="showStatus()">
        ⭐ なかま
      </button>

    </div>

  </div>

</div>


<!-- バトル -->

<div id="battleScreen">

  <div id="enemyName">
    敵
  </div>

  <div id="enemySprite">
    👾
  </div>

  <div id="enemyHPWrap">
    <div id="enemyHPBar">
      <div id="enemyHP"></div>
    </div>
  </div>

  <div id="battleMessage">
    バトル開始！
  </div>

  <div id="battleButtons">

    <button class="battleButton" onclick="attack('taichi')">
      🧒 タイチ<br>むしアタック
    </button>

    <button class="battleButton" onclick="attack('hana')">
      👧 ハナ<br>キラキラ魔法
    </button>

    <button class="battleButton" onclick="attack('rainbow')">
      🪲 レインボー<br>クワガタ斬り
    </button>

    <button class="battleButton" onclick="attack('tockun')">
      🦎 とっくん<br>しっぽアタック
    </button>

  </div>

</div>


<!-- イベント -->

<div id="eventPopup">

  <div id="eventText"></div>

  <button id="eventButton" onclick="closeEvent()">
    OK！
  </button>

</div>

</div>


<script>

/* =========================
   基本データ
========================= */

let playerX = 45;
let playerY = 55;

let currentWorld = 0;

let taichiHealth = 100;
let hanaHealth = 100;

let enemyHealth = 100;
let currentEnemy = null;

let defeatedEnemies = 0;


/* =========================
   ワールド
========================= */

const worlds = [

  {
    name: "🌳 はじまりの森",
    className: "world-forest",
    enemy: {
      name: "🦗 カマキチ",
      icon: "🦗",
      hp: 80
    },
    story:
      "森の奥から不思議な声が聞こえる！<br><br>『タイチ！ハナ！大変だ！』<br><br>カマキチが待っている！"
  },

  {
    name: "🌊 シャーキュンの海",
    className: "world-sea",
    enemy: {
      name: "🦈 シャーキュン",
      icon: "🦈",
      hp: 100
    },
    story:
      "海の世界に到着！<br><br>そこには巨大な波と、<br>シャーキュンが待っていた！"
  },

  {
    name: "🏰 ちび怪盗くんの城",
    className: "world-castle",
    enemy: {
      name: "🦹 ちび怪盗くん",
      icon: "🦹",
      hp: 120
    },
    story:
      "謎の城に潜入！<br><br>お宝を盗んだちび怪盗くんを<br>追いかけよう！"
  },

  {
    name: "🔥 パリピタイタイ火山",
    className: "world-fire",
    enemy: {
      name: "😎 パリピタイタイ",
      icon: "😎",
      hp: 150
    },
    story:
      "ド派手な音楽が鳴り響く火山！<br><br>パリピタイタイとの<br>熱いバトルが始まる！"
  },

  {
    name: "🌸 ますみん城",
    className: "world-final",
    enemy: {
      name: "👑 ラスボス・ますみん",
      icon: "👑",
      hp: 220
    },
    story:
      "ついに最後の世界！<br><br>すべての冒険の先にいるのは…<br><br>ラスボス・ますみん！！"
  }

];


/* =========================
   ゲーム開始
========================= */

function startGame() {

  document.getElementById("titleScreen").style.display = "none";

  document.getElementById("gameScreen").style.display = "block";

  updatePlayerPosition();

  showWorldIntro();

}


/* =========================
   プレイヤー移動
========================= */

function movePlayer(dx, dy) {

  playerX += dx * 7;
  playerY += dy * 7;

  playerX = Math.max(5, Math.min(85, playerX));
  playerY = Math.max(25, Math.min(80, playerY));

  updatePlayerPosition();

  randomEncounter();

}


function updatePlayerPosition() {

  const player = document.getElementById("player");
  const partner = document.getElementById("partner");

  player.style.left = playerX + "%";
  player.style.top = playerY + "%";

  partner.style.left = (playerX - 8) + "%";
  partner.style.top = (playerY + 8) + "%";

}


/* =========================
   エリア探索
========================= */

function searchArea() {

  const messages = [

    "🌱 草むらを調べた！<br>何かが動いた気がする…",

    "🪲 タイチは虫の気配を感じた！",

    "🎀 ハナがキラキラしたものを見つけた！",

    "🌟 不思議な力を感じる！",

    "🦎 とっくんが近くにいる気がする…",

    "🪲 レインボーが仲間になりたそうにしている！"

  ];

  const text =
    messages[Math.floor(Math.random() * messages.length)];

  showEvent(text);

}


function showStatus() {

  showEvent(
    "⭐ 現在の仲間 ⭐<br><br>" +
    "🧒 タイチ<br>" +
    "👧 ハナ<br>" +
    "🪲 レインボー<br>" +
    "🦎 とっくん<br><br>" +
    "これからさらに仲間が増えるかも！？"
  );

}


/* =========================
   ランダムエンカウント
========================= */

function randomEncounter() {

  const chance = Math.random();

  if (chance < 0.18) {

    startBattle();

  }

}


/* =========================
   ワールド開始
========================= */

function showWorldIntro() {

  const world = worlds[currentWorld];

  document.getElementById("worldName").innerText =
    world.name;

  document.getElementById("worldProgress").innerText =
    "ワールド " + (currentWorld + 1) +
    " / " + worlds.length;

  const map = document.getElementById("map");

  map.className = "";

  map.classList.add(world.className);

  document.getElementById("message").innerText =
    "冒険を進めよう！";

  showEvent(world.story);

}


/* =========================
   バトル開始
========================= */

function startBattle() {

  const world = worlds[currentWorld];

  currentEnemy = world.enemy;

  enemyHealth = currentEnemy.hp;

  document.getElementById("enemyName").innerText =
    currentEnemy.name;

  document.getElementById("enemySprite").innerText =
    currentEnemy.icon;

  document.getElementById("enemyHP").style.width =
    "100%";

  document.getElementById("battleMessage").innerText =
    currentEnemy.name + " が現れた！";

  document.getElementById("battleScreen").style.display =
    "flex";

}


/* =========================
   攻撃
========================= */

function attack(type) {

  let damage = 0;
  let attackName = "";

  if (type === "taichi") {

    damage =
      Math.floor(Math.random() * 20) + 15;

    attackName =
      "🧒 タイチの むしアタック！";

  }

  if (type === "hana") {

    damage =
      Math.floor(Math.random() * 20) + 18;

    attackName =
      "👧 ハナの キラキラ魔法！";

  }

  if (type === "rainbow") {

    damage =
      Math.floor(Math.random() * 25) + 20;

    attackName =
      "🪲 レインボーの クワガタ斬り！";

  }

  if (type === "tockun") {

    damage =
      Math.floor(Math.random() * 25) + 18;

    attackName =
      "🦎 とっくんの しっぽアタック！";

  }


  enemyHealth -= damage;

  if (enemyHealth < 0) {
    enemyHealth = 0;
  }


  const maxHP = currentEnemy.hp;

  const percent =
    (enemyHealth / maxHP) * 100;

  document.getElementById("enemyHP").style.width =
    percent + "%";

  document.getElementById("battleMessage").innerHTML =
    attackName +
    "<br>" +
    damage +
    " ダメージ！";


  if (enemyHealth <= 0) {

    setTimeout(victory, 700);

    return;

  }


  setTimeout(enemyAttack, 600);

}


/* =========================
   敵の攻撃
========================= */

function enemyAttack() {

  const damage =
    Math.floor(Math.random() * 12) + 5;

  if (Math.random() < 0.5) {

    taichiHealth -= damage;

  } else {

    hanaHealth -= damage;

  }

  taichiHealth =
    Math.max(0, taichiHealth);

  hanaHealth =
    Math.max(0, hanaHealth);


  document.getElementById("taichiHP").style.width =
    taichiHealth + "%";

  document.getElementById("hanaHP").style.width =
    hanaHealth + "%";


  document.getElementById("battleMessage").innerHTML =
    currentEnemy.name +
    " の攻撃！<br>" +
    damage +
    " ダメージ！";


  if (
    taichiHealth <= 0 &&
    hanaHealth <= 0
  ) {

    setTimeout(gameOver, 700);

  }

}


/* =========================
   勝利
========================= */

function victory() {

  document.getElementById("battleScreen").style.display =
    "none";

  defeatedEnemies++;

  if (currentWorld < worlds.length - 1) {

    showEvent(
      "🎉 勝利！！<br><br>" +
      currentEnemy.name +
      " を倒した！<br><br>" +
      "次の世界への道が開いた！"
    );

    currentWorld++;

    setTimeout(() => {

      showWorldIntro();

    }, 1000);

  } else {

    showEvent(
      "🎉🎉🎉 クリア！！！ 🎉🎉🎉<br><br>" +
      "ラスボス・ますみんを倒した！<br><br>" +
      "タイチとハナの大冒険は<br>大成功！！<br><br>" +
      "🌈 これからも冒険は続く… 🌈"
    );

  }

}


/* =========================
   ゲームオーバー
========================= */

function gameOver() {

  document.getElementById("battleScreen").style.display =
    "none";

  showEvent(
    "💦 タイチとハナは<br>少し疲れてしまった…<br><br>" +
    "でも大丈夫！<br>また挑戦しよう！"
  );

  taichiHealth = 100;
  hanaHealth = 100;

  document.getElementById("taichiHP").style.width =
    "100%";

  document.getElementById("hanaHP").style.width =
    "100%";

}


/* =========================
   ポップアップ
========================= */

function showEvent(text) {

  document.getElementById("eventText").innerHTML =
    text;

  document.getElementById("eventPopup").style.display =
    "block";

}


function closeEvent() {

  document.getElementById("eventPopup").style.display =
    "none";

}


/* =========================
   キーボード操作
========================= */

document.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "ArrowUp") {
      movePlayer(0,-1);
    }

    if (e.key === "ArrowDown") {
      movePlayer(0,1);
    }

    if (e.key === "ArrowLeft") {
      movePlayer(-1,0);
    }

    if (e.key === "ArrowRight") {
      movePlayer(1,0);
    }

  }
);

</script>

</body>
</html>
