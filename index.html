<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>タイチとハナの大冒険 ～7つの世界とますみんのひみつ～</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
button{font:inherit;color:#fff;border:0;border-radius:14px;padding:13px 18px;background:#315cff;font-weight:800;box-shadow:0 4px 0 #17308b}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #17308b}
#app{height:100%;display:flex;justify-content:center;align-items:center}
.screen{width:min(100%,900px);height:100%;position:relative;overflow:hidden}
.hide{display:none!important}
.title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#315cbd,#101a3c 55%,#050912)}
.logo{font-size:clamp(30px,8vw,66px);font-weight:1000;line-height:1.1;text-shadow:0 6px 0 #17234b,0 0 25px #78c8ff}
.sub{font-size:18px;margin:12px 0 28px;color:#bdeaff}
.hero{width:270px;height:170px;position:relative;margin-bottom:20px}
.char{position:absolute;bottom:0;width:82px;height:115px;border-radius:42px 42px 25px 25px;border:4px solid #111;box-shadow:0 7px 0 #0005}
.char:before{content:"";position:absolute;left:15px;top:-37px;width:45px;height:45px;border:4px solid #111;border-radius:50%;background:#ffd0a8}
.char:after{content:"";position:absolute;left:28px;top:-20px;width:7px;height:7px;border-radius:50%;background:#111;box-shadow:20px 0 #111}
.taichi{left:30px;background:#2d74df}.hana{right:30px;background:#ff72c9}
.hero .taichi:before{background:#f1b887}.hero .hana:before{background:#ffd1b1}
.btns{display:flex;flex-direction:column;gap:13px;width:min(82%,330px)}
.header{height:72px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#101b35;border-bottom:2px solid #304878}
.header b{font-size:18px}.stats{font-size:12px;color:#c9d9ff}
.map{height:calc(100% - 72px);overflow:auto;padding:18px;background:linear-gradient(#142650,#091225)}
.world{margin-bottom:20px;border:2px solid #38528b;border-radius:20px;padding:15px;background:#101b35}
.world h2{margin:0 0 12px;font-size:21px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stage{min-height:62px;padding:7px;border-radius:12px;background:#263b67;box-shadow:0 3px 0 #111;font-size:11px;font-weight:800}
.stage.done{background:#247a5d}.stage.now{outline:3px solid #ffd84d}
.stage.lock{opacity:.35}
.game{height:calc(100% - 72px);position:relative;overflow:hidden}
.field{position:absolute;inset:0;background:linear-gradient(#71c7ff 0 52%,#57a746 52%);overflow:hidden}
.sun{position:absolute;width:70px;height:70px;border-radius:50%;background:#fff09a;right:8%;top:7%;box-shadow:0 0 35px #fff}
.cloud{position:absolute;width:130px;height:35px;background:#fff;border-radius:30px;opacity:.8}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55px;height:55px;left:25px;top:-25px}.cloud:after{width:45px;height:45px;right:20px;top:-18px}
.c1{left:7%;top:15%}.c2{right:12%;top:28%}
.ground{position:absolute;bottom:0;left:0;right:0;height:48%;background:repeating-linear-gradient(135deg,#4d963d 0 18px,#589f43 18px 36px)}
.tree{position:absolute;bottom:34%;width:65px;height:125px}.tree:before{content:"";position:absolute;bottom:0;left:28px;width:12px;height:75px;background:#74452d}.tree:after{content:"";position:absolute;top:0;left:0;width:65px;height:65px;border-radius:50%;background:#176b35;box-shadow:28px 20px 0 #217d3e,-25px 25px 0 #2c8b45}
.t1{left:8%}.t2{right:8%}
.player{position:absolute;bottom:27%;left:28%;width:62px;height:82px;background:#2d74df;border:3px solid #111;border-radius:28px 28px 14px 14px;z-index:4}
.player:before{content:"";position:absolute;left:9px;top:-34px;width:38px;height:38px;border:3px solid #111;border-radius:50%;background:#f1b887}
.player:after{content:"";position:absolute;left:18px;top:-20px;width:6px;height:6px;background:#111;border-radius:50%;box-shadow:17px 0 #111}
.hanaField{left:39%;background:#ff72c9}
.enemy{position:absolute;bottom:29%;right:27%;width:70px;height:70px;background:#7854d9;border:4px solid #161020;border-radius:50%;z-index:4;box-shadow:0 6px 0 #301d55}
.enemy:before{content:"";position:absolute;left:17px;top:20px;width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:25px 0 #fff}
.enemy:after{content:"";position:absolute;left:26px;top:42px;width:20px;height:7px;background:#24152f;border-radius:50%}
.name{position:absolute;bottom:calc(29% + 82px);right:26%;font-weight:900;text-shadow:0 2px #000;z-index:5}
.controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}
.pad{display:grid;grid-template-columns:55px 55px 55px;gap:5px}.pad button{padding:10px;font-size:20px}
.actions{display:flex;gap:6px;align-items:end}
.battle{height:100%;background:linear-gradient(#172b58,#080e20);padding:15px;display:flex;flex-direction:column}
.battleTop{display:flex;justify-content:space-between}
.boss{height:45%;display:flex;align-items:center;justify-content:center;position:relative}
.boss .enemy{position:relative;right:auto;bottom:auto;width:110px;height:110px}
.battleInfo{background:#101a32;border:2px solid #405b92;border-radius:16px;padding:12px}
.hp{height:12px;background:#321c25;border-radius:8px;overflow:hidden;margin:5px 0 10px}
.hp i{display:block;height:100%;background:#45df76}
.cmd{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.dialog{position:absolute;left:12px;right:12px;bottom:92px;padding:15px;border:2px solid #9bb7ff;border-radius:16px;background:#071126ee;z-index:20;font-weight:800;line-height:1.7}
.modal{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.box{background:#121d38;border:2px solid #6282c8;border-radius:22px;padding:22px;width:min(92%,500px);text-align:center}
.box h2{margin-top:0}
.end{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle,#433f91,#080b18)}
.end h1{font-size:34px}
.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:20px;background:#000c;z-index:100}
@media(max-width:500px){.stages{gap:5px}.stage{font-size:9px;padding:5px}.header{height:64px}.game{height:calc(100% - 64px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const W=[
["🌳 モリモリの森","カマキチ",["旅立ち","森の奥へ","クワガタの森","危険な森","カマキチ戦"]],
["🌊 シャーキュンの海","シャーキュン",["海へ出発","たこたこ海岸","深海への道","海の危機","シャーキュン戦"]],
["🔥 灼熱ファイヤーランド","ファイヤー",["灼熱の入口","あつあつ街","炎の洞窟","燃える大地","ファイヤー戦"]],
["☁️ フワフワ天空島","くもくも",["天空へ","雲の村","空中迷路","天空の危機","くもくも戦"]],
["🌙 ユメユメの世界","ユメちゃん",["夢の入口","おかしな夢","夢の森","悪夢の城","ユメちゃん戦"]],
["🌀 ゆがんだ時空","パリピタイタイ",["時空の入口","過去と未来","ゆがみの街","時空崩壊","パリピタイタイ戦"]],
["🏰 ますみん城","ますみん",["城門","城下町","秘密の廊下","ますみんの部屋","ますみん戦"]]
];

let state={screen:"title",world:0,stage:0,level:1,exp:0,hp:100,maxhp:100,mp:30,save:null};
try{Object.assign(state,JSON.parse(localStorage.taichiHana||"{}"))}catch(e){}

function save(){localStorage.taichiHana=JSON.stringify({...state,screen:"map"});toast("セーブしました！")}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1300)}
function app(){document.getElementById("app").innerHTML=""; if(state.screen==="title")title();else if(state.screen==="map")map();else if(state.screen==="field")field();else if(state.screen==="battle")battle();else ending()}
function title(){
document.getElementById("app").innerHTML=`<main class="screen title">
<div class="hero"><div class="char taichi"></div><div class="char hana"></div></div>
<div class="logo">タイチとハナの<br>大冒険</div><div class="sub">～7つの世界とますみんのひみつ～</div>
<div class="btns"><button onclick="newGame()">▶ はじめから</button><button onclick="continueGame()">💾 つづきから</button></div>
</main>`}
function newGame(){state={screen:"map",world:0,stage:0,level:1,exp:0,hp:100,maxhp:100,mp:30};save();app()}
function continueGame(){if(localStorage.taichiHana){state=JSON.parse(localStorage.taichiHana);state.screen="map";app()}else toast("セーブデータがありません")}
function map(){
let h=`<main class="screen"><header class="header"><b>🗺️ ワールドマップ</b><span class="stats">Lv.${state.level}　EXP ${state.exp}/100　❤️${state.hp}</span></header><section class="map">`;
W.forEach((w,wi)=>{h+=`<div class="world"><h2>${w[0]} <small>ボス：${w[1]}</small></h2><div class="stages">`;
w[2].forEach((n,si)=>{let id=wi*5+si,open=id<=state.world*5+state.stage;h+=`<button class="stage ${id===state.world*5+state.stage?"now":""} ${!open?"lock":""}" onclick="${open?`start(${wi},${si})`:"toast('まだ進めません')"}">${si+1}. ${n}</button>`});h+=`</div></div>`});
h+=`<div style="text-align:center;padding:10px"><button onclick="save()">💾 セーブ</button></div></section></main>`;document.getElementById("app").innerHTML=h}
function start(w,s){state.world=w;state.stage=s;if(s===4){state.screen="battle";}else state.screen="field";app()}
function field(){
let w=W[state.world], n=w[2][state.stage];
document.getElementById("app").innerHTML=`<main class="screen"><header class="header"><b>${w[0]}</b><span>${state.stage+1}/5　Lv.${state.level}</span></header>
<section class="game"><div class="field"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="tree t1"></div><div class="tree t2"></div><div class="ground"></div><div class="player"></div><div class="player hanaField"></div><div class="name">りょうちゃん</div><div class="enemy"></div>
<div class="dialog">タイチ「${n}だ！」<br>ハナ「いっしょに行こう！」</div>
<div class="controls"><div class="pad"><span></span><button onclick="move()">▲</button><span></span><button onclick="move()">◀</button><button onclick="move()">▼</button><button onclick="move()">▶</button></div><div class="actions"><button onclick="talk()">💬</button><button onclick="battleStart()">⚔️</button><button onclick="save()">💾</button></div></div></div></section></main>`}
function move(){toast(["りょうちゃんが出てきた！","草むらを進んだ！","ハナ「こっちだよ！」","ゼロ「先へ進みましょう！」"][Math.floor(Math.random()*4)])}
function talk(){toast("ゼロ「この先に世界の秘密があります！」")}
function battleStart(){state.screen="battle";app()}
let enemyHP=100;
function battle(){
enemyHP=100;
document.getElementById("app").innerHTML=`<main class="screen battle"><div class="battleTop"><b>⚔️ BATTLE</b><span>Lv.${state.level}</span></div>
<div class="boss"><div><div class="enemy"></div><div style="text-align:center;font-weight:900">${W[state.world][1]}</div></div></div>
<div class="battleInfo"><b>タイチ ＆ ハナ</b><div class="hp"><i id="myhp" style="width:${state.hp}%"></i></div>❤️ ${state.hp}/${state.maxhp}<div class="hp"><i id="ehp" style="width:100%"></i></div>敵 HP <span id="et">100</span></div>
<div class="cmd"><button onclick="attack()">⚔️ こうげき</button><button onclick="skill()">✨ スキル</button><button onclick="heal()">💚 かいふく</button><button onclick="item()">🎒 アイテム</button></div>
<div id="msg" class="dialog">どうする？</div></main>`}
function attack(){damage(18+state.level*2,"タイチのこうげき！")}
function skill(){if(state.mp<10){msg("MPが足りない！");return}state.mp-=10;damage(30+state.level*3,"ハナのスペシャル攻撃！")}
function heal(){state.hp=Math.min(state.maxhp,state.hp+25);msg("ハナ「元気になったよ！」");enemyTurn()}
function item(){state.hp=Math.min(state.maxhp,state.hp+15);msg("回復アイテムを使った！");enemyTurn()}
function damage(d,t){enemyHP-=d;if(enemyHP<=0){enemyHP=0;win();return}msg(t);enemyTurn();updateBattle()}
function enemyTurn(){let d=8+state.world*2;state.hp=Math.max(0,state.hp-d);if(state.hp<=0){msg("力尽きた……");setTimeout(()=>{state.hp=state.maxhp;state.screen="map";app()},1000)}updateBattle()}
function updateBattle(){let a=document.getElementById("myhp"),b=document.getElementById("ehp"),c=document.getElementById("et");if(a)a.style.width=state.hp+"%";if(b)b.style.width=enemyHP+"%";if(c)c.textContent=enemyHP}
function msg(t){let x=document.getElementById("msg");if(x)x.textContent=t}
function win(){
state.exp+=40+state.world*10;
if(state.exp>=100){state.exp-=100;state.level++;state.maxhp+=15;state.hp=state.maxhp;toast("レベルアップ！")}
if(state.stage===4){if(state.world===6){state.screen="end";app();return}state.world++;state.stage=0}else state.stage++;
setTimeout(()=>{state.screen="map";save();app()},700)
}
function ending(){
document.getElementById("app").innerHTML=`<main class="screen end"><div><div style="font-size:70px">🌈✨</div><h1>冒険クリア！</h1><p>タイチ「どんな世界でも、いっしょなら行ける！」</p><p>ハナ「これからもずっといっしょ！」</p><p>ゼロ「……冒険はまだ終わりません。」</p><p>りょうちゃん「俺もいるぞ！」</p><p style="margin-top:25px">そして、ますみんは優しくみんなを見守っていた……。</p><button onclick="state.screen='title';app()">タイトルへ</button></div></main>`
}
app();
</script>
</body>
</html>
