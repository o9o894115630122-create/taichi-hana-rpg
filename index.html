<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>タイチとハナの大冒険</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    sans-serif;
}

body{
  background:#222;
}


/* =====================
   ゲーム画面
===================== */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #62b7e8 0%,
      #8ed2ef 43%,
      #69a941 44%,
      #3f7f2d 100%
    );

  transition:background .7s;
}


/* 海 */

#game.seaStage{
  background:
    linear-gradient(
      to bottom,
      #46b9e8 0%,
      #67d5f4 32%,
      #1887c9 33%,
      #064f89 100%
    );
}


/* =====================
   タイトル
===================== */

#title{
  position:absolute;
  top:12px;
  left:50%;

  transform:translateX(-50%);

  width:100%;

  text-align:center;

  font-size:24px;
  font-weight:900;

  color:white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.45);

  z-index:20;
}


/* =====================
   ステージ表示
===================== */

#stageLabel{
  position:absolute;

  top:48px;
  left:50%;

  transform:translateX(-50%);

  background:
    rgba(33,100,35,.85);

  color:white;

  padding:6px 18px;

  border-radius:20px;

  font-size:15px;
  font-weight:900;

  z-index:20;
}

.seaStage #stageLabel{
  background:
    rgba(0,73,140,.9);
}


/* =====================
   ステータス
===================== */

#status{
  position:absolute;

  top:82px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:8px;

  z-index:20;
}

.statusBox{
  background:
    rgba(255,255,255,.92);

  padding:10px 14px;

  border-radius:20px;

  font-size:17px;
  font-weight:900;

  box-shadow:
    0 5px 14px rgba(0,0,0,.2);
}


/* =====================
   キャラクター選択
===================== */

#characterSelect{
  position:absolute;

  top:137px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:10px;

  z-index:20;
}

.characterButton{
  border:none;

  border-radius:20px;

  padding:10px 16px;

  font-size:18px;
  font-weight:900;

  background:white;

  color:#2870bb;

  box-shadow:
    0 5px 14px rgba(0,0,0,.2);
}

.characterButton.active{
  background:
    linear-gradient(
      135deg,
      #ffd94c,
      #ffb82e
    );

  color:white;
}


/* =====================
   仲間表示
===================== */

#friends{
  position:absolute;

  top:190px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:8px;

  z-index:20;
}

.friend{
  display:none;

  background:
    rgba(255,255,255,.9);

  padding:6px 12px;

  border-radius:20px;

  font-size:17px;

  font-weight:900;

  box-shadow:
    0 4px 10px rgba(0,0,0,.2);
}

.friend.show{
  display:block;
}


/* =====================
   背景
===================== */

.backgroundItem{
  position:absolute;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
}

.cloud{
  font-size:60px;
}

#cloud1{
  top:240px;
  left:20px;
}

#cloud2{
  top:320px;
  right:20px;
}

.tree{
  font-size:95px;
  bottom:290px;
}

#tree1{
  left:20px;
}

#tree2{
  right:20px;
}


/* 海背景 */

.wave,
.fishBackground{
  display:none;
}

.wave{
  font-size:70px;
}

.fishBackground{
  font-size:52px;
}

#seaWave1{
  top:270px;
  left:5px;
}

#seaWave2{
  top:410px;
  right:5px;
}

#seaFish1{
  top:250px;
  left:20px;
}

#seaFish2{
  top:350px;
  right:20px;
}

.seaStage .wave,
.seaStage .fishBackground{
  display:block;
}

.seaStage .tree{
  display:none;
}

.seaStage .cloud{
  opacity:.45;
}


/* =====================
   アイテム
===================== */

.item{
  position:absolute;

  width:70px;
  height:70px;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:56px;

  z-index:10;

  cursor:pointer;

  user-select:none;
  -webkit-user-select:none;

  transition:
    transform .2s,
    opacity .25s;
}

.item:active{
  transform:
    scale(1.25);
}


/* シャーキュン */

.bossItem{
  font-size:70px;

  filter:
    drop-shadow(
      0 5px 6px rgba(0,0,0,.35)
    );

  animation:
    sharkMove 1.2s infinite alternate;
}

@keyframes sharkMove{

  from{
    transform:
      translateX(-8px);
  }

  to{
    transform:
      translateX(8px);
  }

}


/* =====================
   プレイヤー
===================== */

#player{
  position:absolute;

  width:100px;

  left:50%;

  bottom:200px;

  transform:
    translateX(-50%);

  z-index:15;

  text-align:center;

  transition:
    left .1s linear,
    bottom .1s linear;
}

#playerFace{
  width:82px;
  height:82px;

  margin:auto;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:52px;

  background:white;

  border-radius:50%;

  box-shadow:
    0 6px 15px rgba(0,0,0,.3);
}

#playerName{
  display:inline-block;

  margin-top:5px;

  background:white;

  padding:5px 14px;

  border-radius:20px;

  font-size:17px;
  font-weight:900;
}


/* =====================
   メッセージ
===================== */

#message{
  position:absolute;

  top:225px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(-15px);

  padding:12px 20px;

  border-radius:25px;

  background:
    rgba(0,0,0,.78);

  color:white;

  font-size:19px;
  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .2s,
    transform .2s;

  z-index:50;

  white-space:nowrap;
}

#message.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================
   操作ボタン
===================== */

#controls{
  position:absolute;

  bottom:20px;
  left:50%;

  transform:translateX(-50%);

  width:100%;

  z-index:30;
}

#upRow{
  display:flex;

  justify-content:center;

  margin-bottom:8px;
}

#downRow{
  display:flex;

  justify-content:center;

  gap:12px;
}

.controlButton{
  width:90px;
  height:75px;

  border:none;

  border-radius:20px;

  background:
    rgba(255,255,255,.92);

  font-size:42px;

  color:#2477bd;

  box-shadow:
    0 6px 16px rgba(0,0,0,.25);
}

.controlButton:active{
  transform:scale(.94);
}


/* =====================
   ステージクリア画面
===================== */

#stageScreen{
  position:absolute;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.58);

  z-index:100;

  padding:20px;
}

#stageScreen.show{
  display:flex;
}

#stageBox{
  width:min(370px,100%);

  padding:32px 24px;

  text-align:center;

  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      #fff6a5,
      #ffffff
    );

  box-shadow:
    0 12px 35px rgba(0,0,0,.35);
}

#stageTitle{
  font-size:29px;

  font-weight:900;

  color:#d88900;
}

#stageText{
  margin-top:15px;

  font-size:19px;
  font-weight:800;

  line-height:1.6;
}

#stageBonus{
  margin-top:15px;

  font-size:22px;
  font-weight:900;

  color:#e05d00;
}

#nextStageButton,
#restartButton{
  margin-top:25px;

  width:100%;

  padding:16px;

  border:none;

  border-radius:22px;

  color:white;

  font-size:20px;
  font-weight:900;
}

#nextStageButton{
  background:
    linear-gradient(
      135deg,
      #258ad6,
      #075ca5
    );
}

#restartButton{
  display:none;

  background:
    linear-gradient(
      135deg,
      #4caf50,
      #218838
    );
}


/* =====================
   シャーキュンイベント
===================== */

#eventScreen{
  position:absolute;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,30,60,.65);

  z-index:200;

  padding:20px;
}

#eventScreen.show{
  display:flex;
}

#eventBox{
  width:min(380px,100%);

  text-align:center;

  padding:30px 22px;

  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      #b8f0ff,
      #ffffff
    );

  box-shadow:
    0 15px 40px rgba(0,0,0,.4);
}

#eventCharacter{
  font-size:90px;

  animation:
    eventShark 1s infinite alternate;
}

@keyframes eventShark{

  from{
    transform:
      translateY(-5px);
  }

  to{
    transform:
      translateY(5px);
  }

}

#eventTitle{
  margin-top:8px;

  font-size:28px;

  font-weight:900;

  color:#075ca5;
}

#eventText{
  margin-top:15px;

  font-size:19px;

  font-weight:800;

  line-height:1.7;
}

#joinButton{
  margin-top:24px;

  width:100%;

  padding:16px;

  border:none;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      #ff8c3a,
      #e65100
    );

  color:white;

  font-size:20px;
  font-weight:900;
}


/* =====================
   小さい画面
===================== */

@media(max-height:700px){

  #title{
    top:7px;
    font-size:20px;
  }

  #stageLabel{
    top:38px;
  }

  #status{
    top:68px;
  }

  #characterSelect{
    top:120px;
  }

  #friends{
    top:175px;
  }

  .controlButton{
    width:78px;
    height:65px;

    font-size:36px;
  }

}

</style>
</head>


<body>

<div id="game">


  <!-- タイトル -->

  <div id="title">
    🌍 タイチとハナの大冒険 🌍
  </div>


  <!-- ステージ -->

  <div id="stageLabel">
    🌲 ステージ1：虫の森
  </div>


  <!-- ステータス -->

  <div id="status">

    <div class="statusBox">
      ⭐ <span id="points">0</span>
    </div>

    <div class="statusBox">
      🗺️ <span id="itemCount">0</span> / <span id="totalCount">5</span>
    </div>

  </div>


  <!-- キャラクター -->

  <div id="characterSelect">

    <button
      id="taichiButton"
      class="characterButton active"
    >
      🧒 タイチ
    </button>

    <button
      id="hanaButton"
      class="characterButton"
    >
      👧 ハナ
    </button>

  </div>


  <!-- 仲間 -->

  <div id="friends">

    <div
      id="sharkFriend"
      class="friend"
    >
      🦈 シャーキュン
    </div>

  </div>


  <!-- 背景 -->

  <div
    id="cloud1"
    class="backgroundItem cloud"
  >
    ☁️
  </div>

  <div
    id="cloud2"
    class="backgroundItem cloud"
  >
    ☁️
  </div>

  <div
    id="tree1"
    class="backgroundItem tree"
  >
    🌳
  </div>

  <div
    id="tree2"
    class="backgroundItem tree"
  >
    🌲
  </div>


  <!-- 海背景 -->

  <div
    id="seaWave1"
    class="backgroundItem wave"
  >
    🌊
  </div>

  <div
    id="seaWave2"
    class="backgroundItem wave"
  >
    🌊
  </div>

  <div
    id="seaFish1"
    class="backgroundItem fishBackground"
  >
    🐠
  </div>

  <div
    id="seaFish2"
    class="backgroundItem fishBackground"
  >
    🐟
  </div>


  <!-- アイテム -->

  <div id="items"></div>


  <!-- プレイヤー -->

  <div id="player">

    <div id="playerFace">
      🧒
    </div>

    <div id="playerName">
      タイチ
    </div>

  </div>


  <!-- メッセージ -->

  <div id="message"></div>


  <!-- 操作 -->

  <div id="controls">

    <div id="upRow">

      <button
        id="upButton"
        class="controlButton"
      >
        ↑
      </button>

    </div>


    <div id="downRow">

      <button
        id="leftButton"
        class="controlButton"
      >
        ←
      </button>

      <button
        id="downButton"
        class="controlButton"
      >
        ↓
      </button>

      <button
        id="rightButton"
        class="controlButton"
      >
        →
      </button>

    </div>

  </div>


  <!-- ステージクリア -->

  <div id="stageScreen">

    <div id="stageBox">

      <div id="stageTitle"></div>

      <div id="stageText"></div>

      <div id="stageBonus"></div>

      <button id="nextStageButton">
        🌊 海の世界へ！
      </button>

      <button id="restartButton">
        🔄 最初から遊ぶ
      </button>

    </div>

  </div>


  <!-- シャーキュンイベント -->

  <div id="eventScreen">

    <div id="eventBox">

      <div id="eventCharacter">
        🦈
      </div>

      <div id="eventTitle">
        シャーキュン登場！
      </div>

      <div id="eventText">
        「ぼくも一緒に<br>
        冒険していい？」
      </div>

      <button id="joinButton">
        🤝 仲間にする！
      </button>

    </div>

  </div>


</div>


<script>


/* =====================
   要素
===================== */

const game =
document.getElementById("game");

const itemsContainer =
document.getElementById("items");

const player =
document.getElementById("player");

const playerFace =
document.getElementById("playerFace");

const playerName =
document.getElementById("playerName");

const pointsDisplay =
document.getElementById("points");

const itemCountDisplay =
document.getElementById("itemCount");

const totalCountDisplay =
document.getElementById("totalCount");

const stageLabel =
document.getElementById("stageLabel");

const message =
document.getElementById("message");

const stageScreen =
document.getElementById("stageScreen");

const stageTitle =
document.getElementById("stageTitle");

const stageText =
document.getElementById("stageText");

const stageBonus =
document.getElementById("stageBonus");

const nextStageButton =
document.getElementById("nextStageButton");

const restartButton =
document.getElementById("restartButton");

const eventScreen =
document.getElementById("eventScreen");

const joinButton =
document.getElementById("joinButton");

const sharkFriend =
document.getElementById("sharkFriend");

const taichiButton =
document.getElementById("taichiButton");

const hanaButton =
document.getElementById("hanaButton");


/* =====================
   ゲームデータ
===================== */

let points = 0;

let itemCount = 0;

let currentStage = 1;

let stageFinished = false;

let eventActive = false;

let sharkEventDone = false;


/* プレイヤー位置 */

let playerX = 50;

let playerY = 200;


/* =====================
   ステージデータ
===================== */

const stages = {

  1:{

    name:
    "🌲 ステージ1：虫の森",

    clearText:
    "虫の森の生き物を<br>全部見つけた！",

    items:[

      {
        emoji:"🪲",
        name:"カブトムシ",
        points:10,
        top:"260px",
        left:"100px"
      },

      {
        emoji:"🦋",
        name:"ちょうちょ",
        points:5,
        top:"250px",
        right:"90px"
      },

      {
        emoji:"🦗",
        name:"バッタ",
        points:8,
        top:"410px",
        left:"130px"
      },

      {
        emoji:"🐞",
        name:"てんとう虫",
        points:6,
        top:"390px",
        right:"65px"
      },

      {
        emoji:"🐛",
        name:"いもむし",
        points:7,
        top:"500px",
        left:"50%"
      }

    ]

  },


  2:{

    name:
    "🌊 ステージ2：海の世界",

    clearText:
    "海の仲間たちと<br>すてきな出会いがあった！",

    items:[

      {
        emoji:"🐟",
        name:"おさかな",
        points:10,
        top:"250px",
        left:"100px"
      },

      {
        emoji:"🐙",
        name:"たこたこ",
        points:15,
        top:"300px",
        right:"80px"
      },

      {
        emoji:"🦀",
        name:"カニ",
        points:8,
        top:"420px",
        left:"120px"
      },

      {
        emoji:"🐢",
        name:"カメ",
        points:12,
        top:"400px",
        right:"55px"
      },

      {
        emoji:"🦈",
        name:"シャーキュン",
        points:0,
        top:"500px",
        left:"50%",
        event:true
      }

    ]

  }

};


/* =====================
   ステージ読み込み
===================== */

function loadStage(
  stageNumber
){

  currentStage =
  stageNumber;

  itemCount =
  0;

  stageFinished =
  false;

  eventActive =
  false;


  const stage =
  stages[stageNumber];


  stageLabel.innerHTML =
  stage.name;


  itemCountDisplay.textContent =
  itemCount;


  totalCountDisplay.textContent =
  stage.items.length;


  /* 海 */

  if(stageNumber === 2){

    game.classList.add(
      "seaStage"
    );

  }
  else{

    game.classList.remove(
      "seaStage"
    );

  }


  /* アイテム削除 */

  itemsContainer.innerHTML =
  "";


  /* 作成 */

  stage.items.forEach(
  function(itemData){

    const item =
    document.createElement(
      "div"
    );


    item.className =
    "item";


    if(itemData.event){

      item.classList.add(
        "bossItem"
      );

      item.dataset.event =
      "shark";

    }


    item.textContent =
    itemData.emoji;


    item.dataset.name =
    itemData.name;


    item.dataset.points =
    itemData.points;


    if(itemData.top){

      item.style.top =
      itemData.top;

    }


    if(itemData.left){

      item.style.left =
      itemData.left;

    }


    if(itemData.right){

      item.style.right =
      itemData.right;

    }


    item.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      catchItem(
        item
      );

    }
    );


    itemsContainer.appendChild(
      item
    );

  }
  );


  showMessage(
    stage.name +
    " スタート！"
  );

}


/* =====================
   キャラクター変更
===================== */

taichiButton.addEventListener(
"click",
function(){

  if(stageFinished ||
     eventActive){
    return;
  }

  playerFace.textContent =
  "🧒";

  playerName.textContent =
  "タイチ";

  taichiButton.classList.add(
    "active"
  );

  hanaButton.classList.remove(
    "active"
  );

  showMessage(
    "🧒 タイチに交代！"
  );

}
);


hanaButton.addEventListener(
"click",
function(){

  if(stageFinished ||
     eventActive){
    return;
  }

  playerFace.textContent =
  "👧";

  playerName.textContent =
  "ハナ";

  hanaButton.classList.add(
    "active"
  );

  taichiButton.classList.remove(
    "active"
  );

  showMessage(
    "👧 ハナに交代！"
  );

}
);


/* =====================
   プレイヤー更新
===================== */

function updatePlayer(){

  player.style.left =
  playerX + "%";

  player.style.bottom =
  playerY + "px";

}


/* =====================
   移動
===================== */

function movePlayer(
direction
){

  if(stageFinished ||
     eventActive){
    return;
  }


  const horizontalStep =
  7;

  const verticalStep =
  45;


  if(direction === "left"){

    playerX -=
    horizontalStep;

  }

  if(direction === "right"){

    playerX +=
    horizontalStep;

  }

  if(direction === "up"){

    playerY +=
    verticalStep;

  }

  if(direction === "down"){

    playerY -=
    verticalStep;

  }


  if(playerX < 8){

    playerX = 8;

  }

  if(playerX > 92){

    playerX = 92;

  }

  if(playerY < 150){

    playerY = 150;

  }

  if(playerY > 520){

    playerY = 520;

  }


  updatePlayer();


  requestAnimationFrame(
  function(){

    checkItemCollisions();

  }
  );

}


/* =====================
   アイテム取得
===================== */

function catchItem(
item
){

  if(
    !item ||
    item.dataset.caught === "true" ||
    stageFinished ||
    eventActive
  ){
    return;
  }


  /* シャーキュン */

  if(
    item.dataset.event ===
    "shark"
  ){

    startSharkEvent(
      item
    );

    return;

  }


  item.dataset.caught =
  "true";


  const itemName =
  item.dataset.name;


  const itemPoints =
  Number(
    item.dataset.points
  );


  points +=
  itemPoints;


  itemCount +=
  1;


  pointsDisplay.textContent =
  points;


  itemCountDisplay.textContent =
  itemCount;


  item.style.pointerEvents =
  "none";


  item.style.transform =
  "scale(1.6) rotate(20deg)";


  item.style.opacity =
  "0";


  showMessage(
    "🎉 " +
    itemName +
    "をゲット！ +" +
    itemPoints
  );


  setTimeout(
  function(){

    if(item.parentNode){

      item.remove();

    }


    checkStageClear();

  },
  250
  );

}


/* =====================
   シャーキュンイベント
===================== */

function startSharkEvent(
item
){

  if(
    sharkEventDone ||
    eventActive
  ){
    return;
  }


  eventActive =
  true;


  item.style.opacity =
  "0";


  setTimeout(
  function(){

    eventScreen.classList.add(
      "show"
    );

  },
  300
  );

}


/* =====================
   仲間にする
===================== */

joinButton.addEventListener(
"click",
function(){

  eventScreen.classList.remove(
    "show"
  );


  sharkEventDone =
  true;


  eventActive =
  false;


  itemCount +=
  1;


  itemCountDisplay.textContent =
  itemCount;


  sharkFriend.classList.add(
    "show"
  );


  showMessage(
    "🎉 シャーキュンが仲間になった！"
  );


  const shark =
  document.querySelector(
    '[data-event="shark"]'
  );


  if(shark){

    shark.remove();

  }


  setTimeout(
  function(){

    checkStageClear();

  },
  700
  );

}
);


/* =====================
   当たり判定
===================== */

function checkItemCollisions(){

  if(
    stageFinished ||
    eventActive
  ){
    return;
  }


  const items =
  document.querySelectorAll(
    ".item"
  );


  const playerRect =
  playerFace
  .getBoundingClientRect();


  const playerCenterX =
  playerRect.left +
  playerRect.width / 2;


  const playerCenterY =
  playerRect.top +
  playerRect.height / 2;


  items.forEach(
  function(item){

    if(
      item.dataset.caught ===
      "true"
    ){
      return;
    }


    const itemRect =
    item.getBoundingClientRect();


    const itemCenterX =
    itemRect.left +
    itemRect.width / 2;


    const itemCenterY =
    itemRect.top +
    itemRect.height / 2;


    const distanceX =
    Math.abs(
      playerCenterX -
      itemCenterX
    );


    const distanceY =
    Math.abs(
      playerCenterY -
      itemCenterY
    );


    if(
      distanceX < 65 &&
      distanceY < 65
    ){

      catchItem(
        item
      );

    }

  }
  );

}


/* =====================
   ステージクリア確認
===================== */

function checkStageClear(){

  const total =
  stages[currentStage]
  .items
  .length;


  if(
    itemCount >= total
  ){

    stageClear();

  }

}


/* =====================
   ステージクリア
===================== */

function stageClear(){

  if(stageFinished){
    return;
  }


  stageFinished =
  true;


  setTimeout(
  function(){

    points +=
    100;


    pointsDisplay.textContent =
    points;


    stageTitle.innerHTML =
    "🎉 ステージ" +
    currentStage +
    "クリア！ 🎉";


    stageText.innerHTML =
    stages[currentStage]
    .clearText;


    stageBonus.innerHTML =
    "⭐ クリアボーナス +100！";


    if(currentStage === 1){

      nextStageButton.style.display =
      "block";


      restartButton.style.display =
      "none";


      nextStageButton.textContent =
      "🌊 海の世界へ！";

    }


    if(currentStage === 2){

      nextStageButton.style.display =
      "none";


      restartButton.style.display =
      "block";

    }


    stageScreen.classList.add(
      "show"
    );

  },
  500
  );

}

text
