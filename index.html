<script>
const WORLDS=[["モリモリの森","🌳","森の奥に広がる、虫たちと緑の世界。","カマキチ",["森の入口","きのこの道","クヌギの森","古の大木","森の守り神"]],["シャーキュンの海","🌊","青い海に異変発生！シャーキュンと海の秘密を追う。","シャーキュン",["砂浜の浜","サンゴの海","沈没船","海の洞窟","海の守り人"]],["灼熱ファイヤーランド","🔥","火山が暴走中。ファイヤーと炎の世界を進め！","ファイヤー",["火山の麓","溶岩の道","炎の橋","マグマの奥","炎の王"]],["フワフワ天空島","☁️","雲の上の島々。虹の橋を渡り、空の異変を止めよう。","くもくも",["雲の道","風の塔","空の庭園","虹の橋","空の守り人"]],["ユメユメの世界","🌙","夢と記憶が交差する、不思議な世界。","ユメちゃん",["夢の入口","鏡の迷宮","ねむりの森","記憶の間","ユメちゃん"]],["ゆがんだ時空","🌀","世界のゲートが歪んだ。ゼロの記憶を追って進め！","パリピタイタイ",["時の裂け目","逆さの町","崩れた世界","最後の試練","時空の支配者"]],["ますみん城","🏰","すべての答えが待つ最終世界。最後の扉を開こう。","ますみん",["城門","最後の回廊","運命の間","ひみつの部屋","ますみん"]]];
const ASSETS={taichi:"A1",hana:"A2",zero:"A3",ryo:"A4",paripi:"A5",rainbow:"A6",shark:"A7",tokkun:"A8",kamakichi:"A9",hino:"A10",masumin:"A11",kumokumo:"A12",scene_village:"A13",scene_dungeon:"A14",scene_castle:"A15",ending:"A16",battle_ryo:"A4",battle_paripi:"A5",battle_rainbow:"A6",battle_shark:"A7",battle_tokkun:"A8",battle_kamakichi:"A9",battle_hino:"A10",battle_masumin:"A11"};
const STAGES=['旅立ち','なかまとの出会い','ひみつの道','世界の危機','ボスバトル'];
let w=0,s=0,dialogIndex=0,enemyHP=100,playerHP=120,turnLock=false,level=1,exp=0,inventory=3;
const storySets=[
 [['タイチ','今日は虫探しだ！','元気に森へ出発！'],['ハナ','もうちょっとだけならね！','ハナも一緒に行くよ！'],['ゼロ','……ゲート反応を確認。','世界の境目に異常がある。'],['タイチ','じゃあ、行ってみよう！','みんなで進もう！'],['ハナ','いっしょなら大丈夫！','絶対に帰ってこようね！']],
 [['ゼロ','次の世界は海だ。','青いゲートを抜けるぞ。'],['タイチ','海にも虫いるかな？','まず海を見よう！'],['ハナ','なんか嫌な予感……。','でも、行くよ！'],['シャーキュン','海の異変を止めて！','ぼくが道案内するよ！'],['タイチ','よし、みんなで行こう！','海の奥へ！']],
 [['タイチ','暑すぎるーー！','火山がすごい！'],['ハナ','もう無理ーー！💢','でも進まなきゃ！'],['ゼロ','文句を言う元気はあるようだな。','まだ先がある。'],['レインボー','ここは任せて。','光で道を開くよ。'],['タイチ','ありがとう！','よし、炎の奥へ！']],
 [['ハナ','雲の上だー！','ふわふわだね！'],['りょうちゃん','落ちてきた。','なぜか空から登場。'],['タイチ','どうやって！？','びっくりした！'],['ゼロ','説明している暇はない！','ゲートが揺れている。'],['ハナ','みんなで空を守ろう！','虹の橋へ！']],
 [['ゼロ','ここは夢の世界だ。','記憶のデータにも干渉がある。'],['タイチ','夢でも冒険だ！','負けないぞ！'],['ハナ','怖くても一緒なら平気！','手をつないで進もう。'],['ゼロ','出口は記憶の奥だ。','急ごう。'],['タイチ','みんなのところへ帰ろう！','最後まで行くぞ！']],
 [['ゼロ','ここがゲート異常の中心だ。','時空が歪んでいる。'],['りょうちゃん','俺も来ちゃった。','なぜかいる。'],['パリピタイタイ','ウェーイ！ここから先は通さないぜ！','時空でもパリピだ！'],['タイチ','みんなを助ける！','パリピタイタイも元に戻そう！'],['ハナ','一緒なら負けないよ！','最後の世界へ！']],
 [['タイチ','ついに最後の城だ！','ここまで来た！'],['ハナ','みんなでここまで来たね！','もうすぐ答えが分かる。'],['ゼロ','最後のゲートの中心。','答えはここにある。'],['ますみん','よくここまで来たね……。','ずっと見ていたよ。'],['りょうちゃん','俺も来ちゃった！','なんか一緒に帰るわ！']]
];
const charImg={taichi:ASSETS.taichi,hana:ASSETS.hana};
function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');}
function save(){localStorage.setItem('th_save',JSON.stringify({w,s,level,exp,inventory}));$('continueBtn').style.display='block';}
function load(){try{return JSON.parse(localStorage.getItem('th_save'))}catch(e){return null}}
function newGame(){w=0;s=0;level=1;exp=0;inventory=3;save();show('map');updateMap();}
function continueGame(){const d=load();if(!d)return newGame();Object.assign(window,{w:d.w||0,s:d.s||0,level:d.level||1,exp:d.exp||0,inventory:d.inventory||3});show('map');updateMap();}
function showGallery(){show('gallery')}
function updateMap(){$('mapLv').textContent=level}
function openWorld(i){w=i;renderStages();show('stages')}
function renderStages(){const q=WORLDS[w];$('worldTitle').textContent=(w+1)+'. '+q[0];$('heading').textContent=q[4].map((x,i)=>(i+1)+'-'+(i+1)+' '+x).join('　');$('worldDesc').textContent=q[2];$('stageLv').textContent=level;const g=$('stageGrid');g.innerHTML='';q[4].forEach((name,i)=>{const b=document.createElement('button');b.className='stage'+(i===4?' boss':'');b.innerHTML=(i===4?'👑 ':'🌟 ')+(i+1)+'<br>'+name+'<br><small>'+STAGES[i]+'</small>';b.onclick=()=>enterStage(i);g.appendChild(b)})}
function enterStage(i){s=i;dialogIndex=0;$('sw').textContent=w+1;$('ss').textContent=s+1;$('storyTitle').textContent=WORLDS[w][0]+' / '+WORLDS[w][4][s];renderStory();show('story')}
function storyBg(){return w===6?ASSETS.scene_castle:(w===5?ASSETS.scene_dungeon:ASSETS.scene_village)}
function imageForSpeaker(name){if(name==='タイチ')return ASSETS.taichi;if(name==='ハナ')return ASSETS.hana;if(name==='りょうちゃん')return ASSETS.ryo;if(name==='ますみん')return ASSETS.masumin;if(name==='パリピタイタイ')return ASSETS.paripi;if(name==='レインボー')return ASSETS.rainbow;if(name==='シャーキュン')return ASSETS.shark;return ASSETS.taichi}
function renderStory(){const line=storySets[w][dialogIndex];$('storyBg').src=storyBg();$('storyTa').src=ASSETS.taichi;$('storyHa').src=ASSETS.hana;const sp=line[0];const special={ゼロ:ASSETS.zero,りょうちゃん:ASSETS.ryo,パリピタイタイ:ASSETS.paripi,ますみん:ASSETS.masumin,レインボー:ASSETS.rainbow,シャーキュン:ASSETS.shark};$('storyRyo').src=special[sp]||((w===5)?ASSETS.paripi:(w===6?ASSETS.masumin:ASSETS.ryo));$('speaker').textContent=sp;$('dialogText').textContent=line[1];}
function nextStory(){dialogIndex++;if(dialogIndex<storySets[w].length){renderStory();return}startBattle()}
function startBattle(){enemyHP=(s===4?190:90)+w*28+s*12+level*5;playerHP=Math.min(120,90+level*6);turnLock=false;$('bw').textContent=w+1;$('bs').textContent=s+1;$('hp1').textContent=playerHP;$('hp2').textContent=Math.max(1,playerHP-10);$('hp3').textContent=Math.max(1,playerHP-5);bars();const boss=s===4;let name=boss?WORLDS[w][3]:(w===5&&s>=2?'パリピタイタイ':(Math.random()<.2?'りょうちゃん':WORLDS[w][3]));$('enemyTag').textContent=(boss?'👑 ':'')+name;$('enemyTag').className='enemyTag'+(boss?' bossTag':'');$('arenaBg').src=(w===6?ASSETS.scene_castle:(w===5?ASSETS.scene_dungeon:(w===1?ASSETS.scene_village:ASSETS.scene_village)));$('enemySprite').innerHTML=pixelEnemy(name);$('battleLog').textContent=name+' が あらわれた！';show('battle')}
function pixelEnemy(name){

  const P = {

    "りょうちゃん":[
      "#171717",
      "#d59b72",
      "#f0c46a",
      "#6b3f24",
      "#243047"
    ],

    "パリピタイタイ":[
      "#20132f",
      "#e7a878",

<style>
#bgmPanel{position:fixed;right:10px;bottom:10px;z-index:9999;display:flex;gap:6px;align-items:center;background:rgba(5,18,42,.92);border:2px solid #6fa9e4;border-radius:999px;padding:6px 8px;box-shadow:0 4px 14px #0006;backdrop-filter:blur(8px)}
#bgmPanel button{border:1px solid #fff;border-radius:999px;background:#1769d1;color:#fff;padding:7px 10px;font-size:12px;font-weight:900}
#bgmPanel .musicName{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:900;color:#fff}
@media(max-width:650px){#bgmPanel{right:8px;bottom:8px}.musicName{max-width:105px!important}}
/* SFC風・敵ドット絵 */

.enemySprite{
  position:absolute;
  right:8%;
  bottom:5%;
  width:42%;
  height:78%;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  z-index:2;
  image-rendering:pixelated;
}

.enemySprite img{
  width:100%;
  height:100%;
  object-fit:contain;
  image-rendering:pixelated;

  filter:drop-shadow(5px 6px 0 #13213f);
}</style>

<script>

(function(){
  let ctx=null, master=null, musicTimer=null, currentTrack="", noteIndex=0;
  let bgmOn=localStorage.getItem("th_bgm")!=="off";
  const tracks={
    title:{name:"♪ 冒険のはじまり", bpm:108, wave:"triangle", notes:[262,330,392,523,392,330,294,349,440,523,440,349]},
    map:{name:"♪ 七つの世界", bpm:96, wave:"sine", notes:[294,330,392,440,392,330,262,294,349,392,440,392]},
    w0:{name:"♪ モリモリの森", bpm:112, wave:"triangle", notes:[392,440,494,523,494,440,392,330,392,440,523,587]},
    w1:{name:"♪ シャーキュンの海", bpm:92, wave:"sine", notes:[262,330,392,330,294,349,440,392,330,294,262,220]},
    w2:{name:"♪ 灼熱ファイヤーランド", bpm:132, wave:"square", notes:[220,220,262,294,330,294,262,220,196,220,247,262]},
    w3:{name:"♪ フワフワ天空島", bpm:88, wave:"sine", notes:[392,494,587,659,587,494,440,523,659,784,659,523]},
    w4:{name:"♪ ユメユメの世界", bpm:76, wave:"triangle", notes:[330,392,440,523,494,440,392,349,330,294,349,392]},
    w5:{name:"♪ ゆがんだ時空", bpm:124, wave:"sawtooth", notes:[220,233,262,311,294,262,233,220,196,220,277,330]},
    w6:{name:"♪ ますみん城", bpm:82, wave:"triangle", notes:[196,247,294,330,294,247,220,262,330,392,330,262]},
    battle:{name:"♪ バトル！", bpm:138, wave:"square", notes:[196,196,247,294,262,247,220,220,294,330,294,247]},
    boss:{name:"♪ ボスバトル！", bpm:150, wave:"sawtooth", notes:[147,147,175,220,196,175,165,165,220,262,247,196]},
    ending:{name:"♪ ぼうけんのあとで", bpm:72, wave:"sine", notes:[262,330,392,523,494,440,392,330,349,440,523,659]}
  };

  function ensureAudio(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      ctx=new AC();
      master=ctx.createGain();
      master.gain.value=0.075;
      master.connect(ctx.destination);
    }
    if(ctx.state==="suspended") ctx.resume();
    return true;
  }
  function tone(freq,dur,when,vol,type){
    if(!ctx||!master||!bgmOn)return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||"triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),when+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    o.connect(g); g.connect(master); o.start(when); o.stop(when+dur+0.03);
  }
  function playTrack(key){
    if(!bgmOn)return;
    if(!ensureAudio())return;
    const t=tracks[key]||tracks.map;
    currentTrack=key; noteIndex=0;
    clearTimeout(musicTimer);
    const tick=()=>{
      if(!bgmOn || currentTrack!==key)return;
      const now=ctx.currentTime;
      const beat=60/t.bpm;
      const f=t.notes[noteIndex%t.notes.length];
      tone(f,beat*.72,now,.055,t.wave);
      if(noteIndex%4===0) tone(f/2,beat*.88,now,.022,"sine");
      if(noteIndex%8===4) tone(f*1.5,beat*.25,now,.018,"sine");
      noteIndex++;
      musicTimer=setTimeout(tick,beat*1000);
    };
    tick();
    updatePanel();
  }
  function stopMusic(){
    clearTimeout(musicTimer); musicTimer=null; currentTrack="";
    updatePanel();
  }
  function updatePanel(){
    const n=document.getElementById("musicName");
    const b=document.getElementById("bgmToggle");
    if(n)n.textContent=bgmOn?(tracks[currentTrack]?.name||"♪ BGM"): "♪ BGM OFF";
    if(b)b.textContent=bgmOn?"🎵 BGM ON":"🔇 BGM OFF";
  }
  function toggleBgm(){
    bgmOn=!bgmOn;
    localStorage.setItem("th_bgm",bgmOn?"on":"off");
    if(bgmOn){
      ensureAudio();
      musicForScreen(document.querySelector(".screen.active")?.id||"title");
    }else stopMusic();
    updatePanel();
  }
  function musicForScreen(id){
    if(!bgmOn)return;
    if(id==="title"){playTrack("title");return}
    if(id==="map"){playTrack("map");return}
    if(id==="battle"){
      playTrack((typeof s!=="undefined"&&s===4)?"boss":"battle");return
    }
    if(id==="result"){
      if(typeof w!=="undefined"&&typeof s!=="undefined"&&w===6&&s===4)playTrack("ending");
      else playTrack("map");
      return
    }
    if(id==="gallery"){playTrack("map");return}
    if(typeof w!=="undefined")playTrack("w"+w);
  }

  window.addEventListener("pointerdown",function(){
    if(bgmOn)ensureAudio();
  },{passive:true});

  const originalShow=window.show;
  window.show=function(id){
    originalShow(id);
    setTimeout(()=>musicForScreen(id),20);
  };

  const panel=document.createElement("div");
  panel.id="bgmPanel";
  panel.innerHTML='<span id="musicName" class="musicName">♪ BGM</span><button id="bgmToggle" type="button">🎵 BGM ON</button>';
  document.body.appendChild(panel);
  document.getElementById("bgmToggle").addEventListener("click",function(e){
    e.stopPropagation(); toggleBgm();
  });
  updatePanel();

  
  function sfx(freq,dur,vol){
    if(!bgmOn||!ensureAudio())return;
    const now=ctx.currentTime;
    tone(freq,dur,now,vol||.045,"square");
  }
  const oldAttack=window.attack, oldSkill=window.skill, oldHeal=window.heal, oldItem=window.item;
  if(oldAttack)window.attack=function(){sfx(330,.10,.06);setTimeout(()=>sfx(520,.08,.045),70);return oldAttack.apply(this,arguments)};
  if(oldSkill)window.skill=function(){sfx(440,.10,.055);setTimeout(()=>sfx(660,.16,.045),90);return oldSkill.apply(this,arguments)};
  if(oldHeal)window.heal=function(){sfx(523,.12,.05);return oldHeal.apply(this,arguments)};
  if(oldItem)window.item=function(){sfx(294,.10,.05);return oldItem.apply(this,arguments)};
})();
</script>
