<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>タイチとハナの大冒険</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    sans-serif;

  background:#1d3557;

  overflow:hidden;
}


/* =========================
   ゲーム全体
========================= */

#game{
  width:100vw;
  height:100vh;

  position:relative;

  overflow:hidden;

  background:

  radial-gradient(
    circle at 20% 20%,
    rgba(255,255,255,.5),
    transparent 25%
  ),

  linear-gradient(
    #87ceeb 0%,
    #87ceeb 45%,
    #72b64a 45%,
    #4f9138 100%
  );
}


/* =========================
   タイトル
========================= */

#title{

  position:absolute;

  top:12px;

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  width:95%;

  text-align:center;

  color:white;

  font-weight:bold;

  font-size:22px;

  text-shadow:
    2px 2px 0 #234,
    0 0 8px rgba(0,0,0,.4);

  pointer-events:none;

}


/* =========================
   ステータス
========================= */

#status{

  position:absolute;

  top:55px;

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  display:flex;

  gap:10px;

  color:#333;

}


.statusBox{

  background:rgba(255,255,255,.92);

  padding:8px 14px;

  border-radius:20px;

  font-weight:bold;

  box-shadow:
    0 4px 10px rgba(0,0,0,.2);

}


/* =========================
   キャラ選択
========================= */

#characterSelect{

  position:absolute;

  top:110px;

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  display:flex;

  gap:10px;

}


.characterButton{

  border:none;

  border-radius:18px;

  padding:10px 16px;

  font-size:15px;

  font-weight:bold;

  background:white;

  box-shadow:
    0 4px 10px rgba(0,0,0,.25);

}


.characterButton.active{

  background:#ffd54f;

  transform:scale(1.05);

}


/* =========================
   雲
========================= */

.cloud{

  position:absolute;

  font-size:55px;

  opacity:.8;

  pointer-events:none;

}


/* =========================
   木
========================= */

.tree{

  position:absolute;

  font-size:65px;

  pointer-events:none;

}


/* =========================
   虫
========================= */

.bug{

  position:absolute;

  width:48px;

  height:48px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:38px;

  z-index:5;

  user-select:none;

  pointer-events:none;

  filter:
    drop-shadow(
      2px 4px 2px rgba(0,0,0,.25)
    );

  animation:
    bugFloat
    1.5s
    ease-in-out
    infinite;

}


@keyframes bugFloat{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }

  100%{
    transform:translateY(0);
  }

}


/* =========================
   プレイヤー
========================= */

#player{

  position:absolute;

  width:62px;

  height:62px;

  z-index:10;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  transition:
    left .08s linear,
    top .08s linear;

  user-select:none;

}


#playerFace{

  width:48px;

  height:48px;

  border-radius:50%;

  background:#ffd7b5;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:28px;

  border:3px solid white;

  box-shadow:

    0 5px 8px rgba(0,0,0,.25);

}


#playerName{

  margin-top:2px;

  background:white;

  border-radius:12px;

  padding:2px 8px;

  font-size:12px;

  font-weight:bold;

  box-shadow:
    0 3px 6px rgba(0,0,0,.2);

}


/* =========================
   メッセージ
========================= */

#message{

  position:absolute;

  left:50%;

  top:45%;

  transform:
    translate(-50%,-50%)
    scale(0);

  z-index:50;

  width:80%;

  text-align:center;

  background:white;

  border-radius:25px;

  padding:25px;

  font-size:22px;

  font-weight:bold;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);

  transition:
    .3s;

}


#message.show{

  transform:
    translate(-50%,-50%)
    scale(1);

}


/* =========================
   操作ボタン
========================= */

#controls{

  position:absolute;

  bottom:20px;

  left:50%;

  transform:translateX(-50%);

  z-index:30;

  width:250px;

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  grid-template-rows:
    60px 60px;

  gap:8px;

}


.controlButton{

  border:none;

  border-radius:18px;

  font-size:28px;

  font-weight:bold;

  background:

    rgba(
      255,
      255,
      255,
      .92
    );

  box-shadow:

    0 5px 12px
    rgba(0,0,0,.25);

}


.controlButton:active{

  transform:scale(.92);

  background:#ffd54f;

}


#up{

  grid-column:2;

}


#left{

  grid-column:1;

  grid-row:2;

}


#down{

  grid-column:2;

  grid-row:2;

}


#right{

  grid-column:3;

  grid-row:2;

}


/* =========================
   スマホが小さい時
========================= */

@media(max-height:700px){

  #controls{

    bottom:8px;

  }

  #characterSelect{

    top:100px;

  }

}


</style>
</head>


<body>


<div id="game">


  <!-- タイトル -->

  <div id="title">

    🌍 タイチとハナの大冒険 🌍

  </div>



  <!-- ステータス -->

  <div id="status">

    <div class="statusBox">

      ⭐ ポイント：
      <span id="score">
        0
      </span>

    </div>

    <div class="statusBox">

      🐞
      <span id="remaining">
        6
      </span>

      匹

    </div>

  </div>



  <!-- キャラ選択 -->

  <div id="characterSelect">

    <button
      id="taichiButton"
      class="characterButton active"
    >

      🧒 タイチ

    </button>


    <button
      id="hanaButton"
      class="characterButton"
    >

      👧 ハナ

    </button>

  </div>



  <!-- 背景 -->

  <div
    class="cloud"
    style="
      left:5%;
      top:18%;
    "
  >

    ☁️

  </div>


  <div
    class="cloud"
    style="
      right:5%;
      top:25%;
    "
  >

    ☁️

  </div>


  <div
    class="tree"
    style="
      left:5%;
      bottom:180px;
    "
  >

    🌳

  </div>


  <div
    class="tree"
    style="
      right:5%;
      bottom:170px;
    "
  >

    🌲

  </div>



  <!-- プレイヤー -->

  <div id="player">

    <div id="playerFace">

      🧒

    </div>

    <div id="playerName">

      タイチ

    </div>

  </div>



  <!-- 虫 -->

  <div
    class="bug"
    style="
      left:15%;
      top:35%;
    "
  >

    🪲

  </div>


  <div
    class="bug"
    style="
      left:70%;
      top:32%;
    "
  >

    🦋

  </div>


  <div
    class="bug"
    style="
      left:40%;
      top:48%;
    "
  >

    🐛

  </div>


  <div
    class="bug"
    style="
      left:75%;
      top:55%;
    "
  >

    🐞

  </div>


  <div
    class="bug"
    style="
      left:18%;
      top:62%;
    "
  >

    🦗

  </div>


  <div
    class="bug"
    style="
      left:52%;
      top:68%;
    "
  >

    🪲

  </div>



  <!-- メッセージ -->

  <div id="message">

    🎉 すべての虫を見つけた！ 🎉

    <br><br>

    ⭐ 大冒険クリア！ ⭐

  </div>



  <!-- 操作ボタン -->

  <div id="controls">


    <button
      id="up"
      class="controlButton"
    >

      ↑

    </button>


    <button
      id="left"
      class="controlButton"
    >

      ←

    </button>


    <button
      id="down"
      class="controlButton"
    >

      ↓

    </button>


    <button
      id="right"
      class="controlButton"
    >

      →

    </button>


  </div>


</div>



<script>


/* =========================
   変数
========================= */


const player =
  document.getElementById(
    "player"
  );


const playerFace =
  document.getElementById(
    "playerFace"
  );


const playerName =
  document.getElementById(
    "playerName"
  );


const scoreText =
  document.getElementById(
    "score"
  );


const remainingText =
  document.getElementById(
    "remaining"
  );


const message =
  document.getElementById(
    "message"
  );


const taichiButton =
  document.getElementById(
    "taichiButton"
  );


const hanaButton =
  document.getElementById(
    "hanaButton"
  );


/* =========================
   プレイヤー位置
========================= */


let playerX =
  window.innerWidth / 2 - 30;


let playerY =
  window.innerHeight - 250;


let score = 0;


/* =========================
   キャラクター
========================= */


let character =
  "taichi";


/* =========================
   最初の位置
========================= */


function updatePlayer(){

  player.style.left =
    playerX + "px";


  player.style.top =
    playerY + "px";

}


updatePlayer();



/* =========================
   移動
========================= */


function move(dx, dy){

  const speed = 35;


  playerX +=
    dx * speed;


  playerY +=
    dy * speed;


  /* 左右の画面外防止 */


  if(playerX < 0){

    playerX = 0;

  }


  if(
    playerX >
    window.innerWidth - 62
  ){

    playerX =
      window.innerWidth - 62;

  }


  /* 上下の画面外防止 */


  if(playerY < 95){

    playerY = 95;

  }


  if(
    playerY >
    window.innerHeight - 210
  ){

    playerY =
      window.innerHeight - 210;

  }


  updatePlayer();


  checkBugs();

}



/* =========================
   虫チェック
========================= */


function checkBugs(){

  const bugs =
    document.querySelectorAll(
      ".bug"
    );


  bugs.forEach(
    function(bug){

      if(
        bug.dataset.collected ===
        "true"
      ){

        return;

      }


      const bugRect =
        bug.getBoundingClientRect();


      const playerRect =
        player.getBoundingClientRect();


      const playerCenterX =
        playerRect.left +
        playerRect.width / 2;


      const playerCenterY =
        playerRect.top +
        playerRect.height / 2;


      const bugCenterX =
        bugRect.left +
        bugRect.width / 2;


      const bugCenterY =
        bugRect.top +
        bugRect.height / 2;


      const distance =
        Math.sqrt(

          Math.pow(
            playerCenterX -
            bugCenterX,
            2
          )

          +

          Math.pow(
            playerCenterY -
            bugCenterY,
            2
          )

        );


      if(
        distance < 55
      ){

        collectBug(
          bug
        );

      }

    }
  );

}



/* =========================
   虫ゲット
========================= */


function collectBug(
  bug
){

  bug.dataset.collected =
    "true";


  bug.style.display =
    "none";


  score++;


  scoreText.textContent =
    score;


  const totalBugs =
    document.querySelectorAll(
      ".bug"
    ).length;


  const remaining =
    totalBugs -
    score;


  remainingText.textContent =
    remaining;


  if(
    remaining === 0
  ){

    setTimeout(
      function(){

        message.classList.add(
          "show"
        );

      },
      300
    );

  }

}



/* =========================
   画面の矢印
========================= */


document
.getElementById(
  "up"
)
.addEventListener(
  "click",
  function(){

    move(
      0,
      -1
    );

  }
);



document
.getElementById(
  "down"
)
.addEventListener(
  "click",
  function(){

    move(
      0,
      1
    );

  }
);



document
.getElementById(
  "left"
)
.addEventListener(
  "click",
  function(){

    move(
      -1,
      0
    );

  }
);



document
.getElementById(
  "right"
)
.addEventListener(
  "click",
  function(){

    move(
      1,
      0
    );

  }
);



/* =========================
   キーボード操作
========================= */


document.addEventListener(
  "keydown",
  function(event){


    if(
      event.key ===
      "ArrowUp"
    ){

      move(
        0,
        -1
      );

    }


    if(
      event.key ===
      "ArrowDown"
    ){

      move(
        0,
        1
      );

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      move(
        -1,
        0
      );

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      move(
        1,
        0
      );

    }

  }
);



/* =========================
   タイチ
========================= */


taichiButton.addEventListener(
  "click",
  function(){

    character =
      "taichi";


    playerFace.textContent =
      "🧒";


    playerName.textContent =
      "タイチ";


    taichiButton.classList.add(
      "active"
    );


    hanaButton.classList.remove(
      "active"
    );

  }
);



/* =========================
   ハナ
========================= */


hanaButton.addEventListener(
  "click",
  function(){

    character =
      "hana";


    playerFace.textContent =
      "👧";


    playerName.textContent =
      "ハナ";


    hanaButton.classList.add(
      "active"
    );


    taichiButton.classList.remove(
      "active"
    );

  }
);



/* =========================
   画面サイズ変更
========================= */


window.addEventListener(
  "resize",
  function(){

    if(
      playerX >
      window.innerWidth - 62
    ){

      playerX =
        window.innerWidth - 62;

    }


    if(
      playerY >
      window.innerHeight - 210
    ){

      playerY =
        window.innerHeight - 210;

    }


    updatePlayer();

  }
);


</script>


</body>
</html>
