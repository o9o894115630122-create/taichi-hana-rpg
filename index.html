<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>タイチとハナの大冒険</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    sans-serif;
}

body{
  background:#222;
}

/* =====================
   ゲーム画面
===================== */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #62b7e8 0%,
      #8ed2ef 43%,
      #69a941 44%,
      #3f7f2d 100%
    );
}

/* =====================
   タイトル
===================== */

#title{
  position:absolute;
  top:15px;
  left:50%;

  transform:
    translateX(-50%);

  width:100%;

  text-align:center;

  font-size:24px;
  font-weight:900;

  color:white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.45);

  z-index:20;
}

/* =====================
   ステージ
===================== */

#stageLabel{
  position:absolute;

  top:48px;
  left:50%;

  transform:
    translateX(-50%);

  background:
    rgba(33,100,35,.85);

  color:white;

  padding:
    6px 18px;

  border-radius:20px;

  font-size:15px;
  font-weight:900;

  z-index:20;
}

/* =====================
   ステータス
===================== */

#status{
  position:absolute;

  top:80px;
  left:50%;

  transform:
    translateX(-50%);

  display:flex;

  gap:8px;

  z-index:20;
}

.statusBox{
  background:
    rgba(255,255,255,.92);

  padding:
    10px 14px;

  border-radius:20px;

  font-size:17px;

  font-weight:900;

  box-shadow:
    0 5px 14px
    rgba(0,0,0,.2);
}

/* =====================
   キャラクター選択
===================== */

#characterSelect{
  position:absolute;

  top:135px;
  left:50%;

  transform:
    translateX(-50%);

  display:flex;

  gap:10px;

  z-index:20;
}

.characterButton{
  border:none;

  border-radius:20px;

  padding:
    10px 16px;

  font-size:18px;

  font-weight:900;

  background:white;

  color:#2870bb;

  box-shadow:
    0 5px 14px
    rgba(0,0,0,.2);
}

.characterButton.active{
  background:
    linear-gradient(
      135deg,
      #ffd94c,
      #ffb82e
    );

  color:white;
}

/* =====================
   背景
===================== */

.cloud{
  position:absolute;

  font-size:60px;

  pointer-events:none;
}

#cloud1{
  top:230px;
  left:25px;
}

#cloud2{
  top:310px;
  right:25px;
}

.tree{
  position:absolute;

  font-size:95px;

  bottom:300px;

  pointer-events:none;
}

#tree1{
  left:20px;
}

#tree2{
  right:20px;
}

/* =====================
   虫
===================== */

.bug{
  position:absolute;

  width:70px;
  height:70px;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:56px;

  z-index:10;

  cursor:pointer;

  user-select:none;

  -webkit-user-select:none;

  transition:
    transform .2s,
    opacity .25s;
}

.bug:active{
  transform:
    scale(1.25);
}

#bug1{
  top:250px;
  left:105px;
}

#bug2{
  top:270px;
  right:95px;
}

#bug3{
  top:410px;
  left:130px;
}

#bug4{
  top:390px;
  right:65px;
}

#bug5{
  top:500px;
  left:50%;
}

/* =====================
   プレイヤー
===================== */

#player{
  position:absolute;

  width:100px;

  left:50%;

  bottom:200px;

  transform:
    translateX(-50%);

  z-index:15;

  text-align:center;

  transition:
    left .1s linear,
    bottom .1s linear;
}

#playerFace{
  width:82px;
  height:82px;

  margin:auto;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:52px;

  background:white;

  border-radius:50%;

  box-shadow:
    0 6px 15px
    rgba(0,0,0,.3);
}

#playerName{
  display:inline-block;

  margin-top:5px;

  background:white;

  padding:
    5px 14px;

  border-radius:20px;

  font-size:17px;

  font-weight:900;
}

/* =====================
   メッセージ
===================== */

#message{
  position:absolute;

  top:205px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(-15px);

  padding:
    12px 20px;

  border-radius:25px;

  background:
    rgba(0,0,0,.75);

  color:white;

  font-size:19px;

  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .2s,
    transform .2s;

  z-index:50;

  white-space:nowrap;
}

#message.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =====================
   操作ボタン
===================== */

#controls{
  position:absolute;

  bottom:20px;

  left:50%;

  transform:
    translateX(-50%);

  width:100%;

  z-index:30;
}

#upRow{
  display:flex;

  justify-content:center;

  margin-bottom:8px;
}

#downRow{
  display:flex;

  justify-content:center;

  gap:12px;
}

.controlButton{
  width:90px;
  height:75px;

  border:none;

  border-radius:20px;

  background:
    rgba(255,255,255,.92);

  font-size:42px;

  color:#2477bd;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.25);

  user-select:none;

  -webkit-user-select:none;
}

/* =====================
   クリア画面
===================== */

#clearScreen{
  position:absolute;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.55);

  z-index:100;

  padding:20px;
}

#clearScreen.show{
  display:flex;
}

#clearBox{
  width:min(360px,100%);

  padding:
    32px 24px;

  text-align:center;

  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      #fff6a5,
      #ffffff
    );

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.35);
}

#clearTitle{
  font-size:30px;

  font-weight:900;

  color:#d88900;
}

#clearText{
  margin-top:15px;

  font-size:19px;

  font-weight:800;

  line-height:1.6;
}

#clearPoints{
  margin-top:15px;

  font-size:22px;

  font-weight:900;

  color:#e05d00;
}

#restartButton{
  margin-top:25px;

  width:100%;

  padding:16px;

  border:none;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      #4caf50,
      #218838
    );

  color:white;

  font-size:20px;

  font-weight:900;
}

/* =====================
   小さい画面
===================== */

@media(max-height:700px){

  #title{
    top:8px;
    font-size:20px;
  }

  #stageLabel{
    top:38px;
  }

  #status{
    top:68px;
  }

  #characterSelect{
    top:120px;
  }

  .controlButton{
    width:78px;
    height:65px;
    font-size:36px;
  }

}

</style>
</head>

<body>

<div id="game">

  <div id="title">
    🌍 タイチとハナの大冒険 🌍
  </div>

  <div id="stageLabel">
    🌲 ステージ1：虫の森
  </div>

  <div id="status">

    <div class="statusBox">
      ⭐ <span id="points">0</span>
    </div>

    <div class="statusBox">
      🐞 <span id="bugCount">0</span> / 5
    </div>

  </div>


  <div id="characterSelect">

    <button
      id="taichiButton"
      class="characterButton active"
    >
      🧒 タイチ
    </button>

    <button
      id="hanaButton"
      class="characterButton"
    >
      👧 ハナ
    </button>

  </div>


  <div
    id="cloud1"
    class="cloud"
  >
    ☁️
  </div>

  <div
    id="cloud2"
    class="cloud"
  >
    ☁️
  </div>


  <div
    id="tree1"
    class="tree"
  >
    🌳
  </div>

  <div
    id="tree2"
    class="tree"
  >
    🌲
  </div>


  <!-- 虫 -->

  <div
    class="bug"
    id="bug1"
    data-name="カブトムシ"
    data-points="10"
  >
    🪲
  </div>

  <div
    class="bug"
    id="bug2"
    data-name="ちょうちょ"
    data-points="5"
  >
    🦋
  </div>

  <div
    class="bug"
    id="bug3"
    data-name="バッタ"
    data-points="8"
  >
    🦗
  </div>

  <div
    class="bug"
    id="bug4"
    data-name="てんとう虫"
    data-points="6"
  >
    🐞
  </div>

  <div
    class="bug"
    id="bug5"
    data-name="いもむし"
    data-points="7"
  >
    🐛
  </div>


  <!-- プレイヤー -->

  <div id="player">

    <div id="playerFace">
      🧒
    </div>

    <div id="playerName">
      タイチ
    </div>

  </div>


  <!-- メッセージ -->

  <div id="message">
  </div>


  <!-- 操作ボタン -->

  <div id="controls">

    <div id="upRow">

      <button
        class="controlButton"
        id="upButton"
      >
        ↑
      </button>

    </div>


    <div id="downRow">

      <button
        class="controlButton"
        id="leftButton"
      >
        ←
      </button>

      <button
        class="controlButton"
        id="downButton"
      >
        ↓
      </button>

      <button
        class="controlButton"
        id="rightButton"
      >
        →
      </button>

    </div>

  </div>


  <!-- クリア画面 -->

  <div id="clearScreen">

    <div id="clearBox">

      <div id="clearTitle">
        🎉 ステージ1クリア！ 🎉
      </div>

      <div id="clearText">
        虫の森の虫を<br>
        全部見つけた！
      </div>

      <div id="clearPoints">
        ⭐ クリアボーナス +100！
      </div>

      <button id="restartButton">
        🔄 もう一度遊ぶ
      </button>

    </div>

  </div>

</div>


<script>

/* =====================
   要素
===================== */

const game =
  document.getElementById("game");

const player =
  document.getElementById("player");

const playerFace =
  document.getElementById("playerFace");

const playerName =
  document.getElementById("playerName");

const pointsDisplay =
  document.getElementById("points");

const bugCountDisplay =
  document.getElementById("bugCount");

const message =
  document.getElementById("message");

const clearScreen =
  document.getElementById("clearScreen");

const restartButton =
  document.getElementById("restartButton");

const taichiButton =
  document.getElementById("taichiButton");

const hanaButton =
  document.getElementById("hanaButton");


/* =====================
   ゲームデータ
===================== */

let points = 0;

let bugCount = 0;

const totalBugs = 5;

let gameCleared = false;


/* =====================
   プレイヤー位置
===================== */

let playerX = 50;

let playerY = 200;


/* =====================
   キャラクター変更
===================== */

taichiButton.addEventListener(
  "click",
  function(){

    if(gameCleared){
      return;
    }

    playerFace.textContent =
      "🧒";

    playerName.textContent =
      "タイチ";

    taichiButton.classList.add(
      "active"
    );

    hanaButton.classList.remove(
      "active"
    );

    showMessage(
      "🧒 タイチに交代！"
    );

  }
);


hanaButton.addEventListener(
  "click",
  function(){

    if(gameCleared){
      return;
    }

    playerFace.textContent =
      "👧";

    playerName.textContent =
      "ハナ";

    hanaButton.classList.add(
      "active"
    );

    taichiButton.classList.remove(
      "active"
    );

    showMessage(
      "👧 ハナに交代！"
    );

  }
);


/* =====================
   プレイヤー表示更新
===================== */

function updatePlayer(){

  player.style.left =
    playerX + "%";

  player.style.bottom =
    playerY + "px";

}


/* =====================
   移動
===================== */

function movePlayer(
  direction
){

  if(gameCleared){
    return;
  }


  const horizontalStep = 7;

  const verticalStep = 45;


  if(
    direction === "left"
  ){

    playerX -=
      horizontalStep;

  }


  if(
    direction === "right"
  ){

    playerX +=
      horizontalStep;

  }


  if(
    direction === "up"
  ){

    playerY +=
      verticalStep;

  }


  if(
    direction === "down"
  ){

    playerY -=
      verticalStep;

  }


  /* 画面外に出ない */

  if(playerX < 8){

    playerX = 8;

  }

  if(playerX > 92){

    playerX = 92;

  }

  if(playerY < 150){

    playerY = 150;

  }

  if(playerY > 520){

    playerY = 520;

  }


  updatePlayer();


  /*
    表示位置更新後に
    当たり判定を少し待つ
  */

  requestAnimationFrame(
    function(){

      checkBugCollisions();

    }
  );

}


/* =====================
   虫ゲット
===================== */

function catchBug(
  bug
){

  if(
    !bug ||
    bug.dataset.caught === "true" ||
    gameCleared
  ){

    return;

  }


  bug.dataset.caught =
    "true";


  const bugName =
    bug.dataset.name;


  const bugPoints =
    Number(
      bug.dataset.points
    );


  points +=
    bugPoints;


  bugCount += 1;


  pointsDisplay.textContent =
    points;


  bugCountDisplay.textContent =
    bugCount;


  bug.style.pointerEvents =
    "none";


  bug.style.transform =
    "scale(1.6) rotate(20deg)";


  bug.style.opacity =
    "0";


  showMessage(
    "🎉 " +
    bugName +
    "をゲット！ +" +
    bugPoints
  );


  setTimeout(
    function(){

      if(
        bug.parentNode
      ){

        bug.remove();

      }


      if(
        bugCount >= totalBugs
      ){

        stageClear();

      }

    },
    250
  );

}


/* =====================
   虫タップ
===================== */

const bugs =
  document.querySelectorAll(
    ".bug"
  );


bugs.forEach(
  function(bug){

    bug.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        catchBug(
          bug
        );

      }
    );

  }
);


/* =====================
   当たり判定
===================== */

function checkBugCollisions(){

  if(gameCleared){
    return;
  }


  const currentBugs =
    document.querySelectorAll(
      ".bug"
    );


  /*
    プレイヤーの顔だけを使う
  */

  const playerRect =
    playerFace.getBoundingClientRect();


  const playerCenterX =
    playerRect.left +
    playerRect.width / 2;


  const playerCenterY =
    playerRect.top +
    playerRect.height / 2;


  currentBugs.forEach(
    function(bug){

      if(
        bug.dataset.caught ===
        "true"
      ){

        return;

      }


      const bugRect =
        bug.getBoundingClientRect();


      const bugCenterX =
        bugRect.left +
        bugRect.width / 2;


      const bugCenterY =
        bugRect.top +
        bugRect.height / 2;


      /*
        X方向の距離
      */

      const distanceX =
        Math.abs(
          playerCenterX -
          bugCenterX
        );


      /*
        Y方向の距離
      */

      const distanceY =
        Math.abs(
          playerCenterY -
          bugCenterY
        );


      /*
        これが重要！

        iPhoneでも確実に
        「近づいたらゲット」
        になる広めの判定
      */

      if(
        distanceX < 65 &&
        distanceY < 65
      ){

        catchBug(
          bug
        );

      }

    }
  );

}


/* =====================
   操作ボタン
===================== */

document
.getElementById("upButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "up"
    );

  }
);


document
.getElementById("downButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "down"
    );

  }
);


document
.getElementById("leftButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "left"
    );

  }
);


document
.getElementById("rightButton")
.addEventListener(
  "click",
  function(){

    movePlayer(
      "right"
    );

  }
);


/* =====================
   ステージクリア
===================== */

function stageClear(){

  if(gameCleared){
    return;
  }


  gameCleared =
    true;


  setTimeout(
    function(){

      points +=
        100;


      pointsDisplay.textContent =
        points;


      clearScreen.classList.add(
        "show"
      );

    },
    500
  );

}


/* =====================
   リスタート
===================== */

restartButton.addEventListener(
  "click",
  function(){

    location.reload();

  }
);


/* =====================
   メッセージ
===================== */

let messageTimer;


function showMessage(
  text
){

  clearTimeout(
    messageTimer
  );


  message.textContent =
    text;


  message.classList.add(
    "show"
  );


  messageTimer =
    setTimeout(
      function(){

        message.classList.remove(
          "show"
        );

      },
      1400
    );

}


/* =====================
   PCキーボード
===================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "ArrowUp"
    ){

      movePlayer(
        "up"
      );

    }


    if(
      event.key ===
      "ArrowDown"
    ){

      movePlayer(
        "down"
      );

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      movePlayer(
        "left"
      );

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      movePlayer(
        "right"
      );

    }

  }
);


</script>

</body>
</html>
