<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>タイチとハナの大冒険</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  background:#71cfff;
}

button{
  font-family:inherit;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:720px;
  margin:auto;
  overflow:hidden;
  background:#87d8ff;
}

/* =====================
画面
===================== */

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.screen.active{
  display:flex;
}

/* =====================
タイトル
===================== */

#titleScreen{
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.9) 0 2%,transparent 3%),
    radial-gradient(circle at 80% 12%,rgba(255,255,255,.8) 0 3%,transparent 4%),
    linear-gradient(#70cdf8,#d8f7ff);
}

.gameLogo{
  font-size:clamp(34px,8vw,55px);
  font-weight:900;
  text-align:center;
  color:#f45d91;
  line-height:1.2;
  text-shadow:
    3px 3px 0 white,
    6px 6px 0 rgba(0,0,0,.12);
}

.logoSub{
  margin-top:15px;
  font-size:18px;
  font-weight:900;
  color:#26364b;
}

.titleCharacters{
  display:flex;
  gap:20px;
  margin:35px 0;
}

.titleCharacter{
  width:135px;
  height:180px;
  border-radius:32px;
  border:5px solid white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 0 rgba(0,0,0,.12);
}

.titleTaichi{
  background:linear-gradient(#75baff,#4389d8);
}

.titleHana{
  background:linear-gradient(#ff9bc4,#e7649d);
}

.bigEmoji{
  font-size:68px;
}

.charLabel{
  color:white;
  font-size:24px;
  font-weight:900;
  text-shadow:2px 2px 0 rgba(0,0,0,.2);
}

.bigButton{
  width:min(90%,430px);
  border:none;
  border-radius:28px;
  padding:19px;
  font-size:23px;
  font-weight:900;
  color:white;
  background:linear-gradient(#ff769f,#ed4f86);
  box-shadow:0 8px 0 #b83d69;
}

.bigButton:active{
  transform:translateY(5px);
  box-shadow:0 3px 0 #b83d69;
}

.continueButton{
  margin-top:15px;
  background:linear-gradient(#6b9cff,#4775cc);
  box-shadow:0 8px 0 #31569b;
}

/* =====================
上部バー
===================== */

.topBar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  min-height:72px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.94);
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  z-index:20;
}

.topTitle{
  font-size:18px;
  font-weight:900;
}

.topStatus{
  display:flex;
  gap:7px;
}

.statusPill{
  background:#edf7ff;
  padding:7px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:900;
}

.smallButton{
  border:none;
  border-radius:16px;
  padding:10px 14px;
  background:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.15);
  font-size:15px;
  font-weight:900;
}

/* =====================
ストーリー
===================== */

#storyScreen{
  background:linear-gradient(#9be2ff,#e9fbff);
}

.storyScene{
  width:100%;
  max-width:620px;
  margin-top:60px;
}

.storyCharacters{
  height:220px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:14px;
}

.storyChar{
  width:130px;
  height:165px;
  border-radius:30px;
  border:5px solid white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 0 rgba(0,0,0,.1);
}

.storyTaichi{
  background:#5a9bea;
}

.storyHana{
  background:#ef79aa;
}

.storyFriend{
  background:#72c984;
}

.storyEnemy{
  background:#d77272;
}

.storyCharEmoji{
  font-size:58px;
}

.storyCharName{
  margin-top:6px;
  font-size:18px;
  font-weight:900;
  color:white;
  text-shadow:2px 2px 0 rgba(0,0,0,.2);
}

.storyBox{
  width:100%;
  background:white;
  border-radius:25px;
  padding:22px;
  box-shadow:0 10px 25px rgba(0,0,0,.14);
}

.worldName{
  font-size:23px;
  font-weight:900;
  color:#437ee3;
  margin-bottom:10px;
}

.storyText{
  white-space:pre-line;
  min-height:155px;
  font-size:19px;
  line-height:1.75;
  font-weight:700;
}

.nextButton{
  width:100%;
  margin-top:16px;
  border:none;
  border-radius:18px;
  padding:16px;
  background:#4d8ff5;
  color:white;
  font-size:19px;
  font-weight:900;
}

/* =====================
マップ
===================== */

#mapScreen{
  justify-content:flex-start;
  padding-top:90px;
  background:linear-gradient(#83d8ff,#edfaff);
  overflow-y:auto;
}

.mapHeading{
  font-size:27px;
  font-weight:900;
  margin-bottom:18px;
}

.worldList{
  width:100%;
  max-width:620px;
  display:flex;
  flex-direction:column;
  gap:13px;
  padding-bottom:35px;
}

.worldButton{
  border:none;
  border-radius:24px;
  padding:14px;
  background:white;
  display:flex;
  align-items:center;
  gap:15px;
  text-align:left;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
}

.worldButton.locked{
  opacity:.48;
  filter:grayscale(1);
}

.worldIcon{
  width:64px;
  height:64px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  flex-shrink:0;
}

.worldInfo h2{
  margin:0;
  font-size:18px;
}

.worldInfo p{
  margin:5px 0 0;
  color:#666;
  font-size:13px;
  font-weight:700;
}

.world1{background:#79d66d;}
.world2{background:#64c7ff;}
.world3{background:#ff9b5f;}
.world4{background:#a98cff;}
.world5{background:#ff94cb;}
.world6{background:#7c76a8;}
.world7{background:#f0b15b;}

/* =====================
仲間
===================== */

#friendScreen{
  background:linear-gradient(#d9f8ff,#fff);
}

.friendEmoji{
  font-size:105px;
}

.friendName{
  font-size:30px;
  font-weight:900;
  text-align:center;
  margin:15px 0;
}

.friendBox{
  width:100%;
  max-width:580px;
  background:white;
  border-radius:25px;
  padding:24px;
  font-size:19px;
  font-weight:700;
  line-height:1.7;
  white-space:pre-line;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
}

/* =====================
バトル
===================== */

#battleScreen{
  justify-content:flex-start;
  padding-top:88px;
  background:linear-gradient(#ffd69e,#fff0d7);
}

.battleWrap{
  width:100%;
  max-width:650px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.enemyPanel{
  background:rgba(255,255,255,.92);
  border-radius:25px;
  padding:18px;
  text-align:center;
}

.enemyEmoji{
  font-size:78px;
}

.enemyName{
  font-size:23px;
  font-weight:900;
}

.hpOuter{
  width:100%;
  height:19px;
  border-radius:20px;
  overflow:hidden;
  background:#d9d9d9;
  margin-top:8px;
}

.hpInner{
  height:100%;
  width:100%;
  background:#50cf6f;
  transition:.35s;
}

.partyRow{
  display:flex;
  gap:10px;
}

.partyCard{
  flex:1;
  background:white;
  padding:11px;
  border-radius:20px;
  text-align:center;
  font-weight:900;
  font-size:13px;
}

.partyEmoji{
  font-size:34px;
}

.battleLog{
  min-height:105px;
  background:white;
  border-radius:22px;
  padding:16px;
  font-size:17px;
  font-weight:800;
  line-height:1.6;
  white-space:pre-line;
}

.commandGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.command{
  border:none;
  border-radius:19px;
  padding:17px 8px;
  color:white;
  font-size:17px;
  font-weight:900;
}

.command:disabled{
  opacity:.45;
}

.attackButton{background:#f05d5d;}
.skillButton{background:#7565e8;}
.healButton{background:#45c878;}
.runButton{background:#777;}

/* =====================
リザルト
===================== */

#resultScreen{
  background:linear-gradient(#91dcff,#eafaff);
}

.resultTitle{
  font-size:35px;
  font-weight:900;
  margin-bottom:18px;
}

.resultBox{
  width:100%;
  max-width:560px;
  background:white;
  border-radius:28px;
  padding:28px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.14);
}

.resultEmoji{
  font-size:90px;
}

.resultText{
  margin-top:15px;
  white-space:pre-line;
  font-size:20px;
  font-weight:800;
  line-height:1.7;
}

/* =====================
エンディング
===================== */

#endingScreen{
  background:
    radial-gradient(circle at 20% 20%,white 0 1%,transparent 2%),
    radial-gradient(circle at 80% 15%,white 0 1%,transparent 2%),
    linear-gradient(#17133e,#56328e,#ff8eb9);
  color:white;
}

.endingTitle{
  font-size:38px;
  font-weight:900;
  text-align:center;
}

.endingCharacters{
  margin:25px 0;
  font-size:44px;
  text-align:center;
  line-height:1.7;
}

.endingText{
  text-align:center;
  font-size:18px;
  font-weight:700;
  line-height:1.8;
  max-width:580px;
}

.toast{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  background:#222;
  color:white;
  padding:12px 20px;
  border-radius:30px;
  font-weight:900;
  z-index:100;
}

@media(max-height:700px){

  .titleCharacters{
    margin:20px 0;
  }

  .titleCharacter{
    height:145px;
    width:115px;
  }

  .storyCharacters{
    height:180px;
  }

  .storyChar{
    height:140px;
    width:110px;
  }

}

</style>
</head>

<body>

<div id="game">

<!-- タイトル -->

<div id="titleScreen" class="screen active">

  <div class="gameLogo">
    タイチとハナの大冒険
  </div>

  <div class="logoSub">
    〜世界をめぐる友情の冒険〜
  </div>

  <div class="titleCharacters">

    <div class="titleCharacter titleTaichi">
      <div class="bigEmoji">🧒🏻🪲</div>
      <div class="charLabel">タイチ</div>
    </div>

    <div class="titleCharacter titleHana">
      <div class="bigEmoji">👧🏻🌸</div>
      <div class="charLabel">ハナ</div>
    </div>

  </div>

  <button class="bigButton" onclick="newGame()">
    🌟 はじめから
  </button>

  <button
    id="continueButton"
    class="bigButton continueButton"
    onclick="continueGame()"
    style="display:none"
  >
    ▶️ つづきから
  </button>

</div>


<!-- マップ -->

<div id="mapScreen" class="screen">

  <div class="topBar">

    <div class="topTitle">
      🌍 世界マップ
    </div>

    <div class="topStatus">

      <div class="statusPill">
        Lv <span id="levelText">1</span>
      </div>

      <div class="statusPill">
        EXP <span id="expText">0</span>
      </div>

    </div>

  </div>

  <div class="mapHeading">
    次はどこへ行く？
  </div>

  <div id="worldList" class="worldList"></div>

</div>


<!-- ストーリー -->

<div id="storyScreen" class="screen">

  <div class="topBar">

    <div id="storyTopTitle" class="topTitle">
      冒険
    </div>

    <button class="smallButton" onclick="showMap()">
      マップ
    </button>

  </div>

  <div class="storyScene">

    <div id="storyCharacters" class="storyCharacters"></div>

    <div class="storyBox">

      <div id="worldName" class="worldName"></div>

      <div id="storyText" class="storyText"></div>

      <button class="nextButton" onclick="nextStory()">
        つぎへ ▶
      </button>

    </div>

  </div>

</div>


<!-- 仲間 -->

<div id="friendScreen" class="screen">

  <div id="friendEmoji" class="friendEmoji"></div>

  <div id="friendName" class="friendName"></div>

  <div id="friendBox" class="friendBox"></div>

  <button class="nextButton" onclick="startBattle()">
    一緒に進む！ ⚔️
  </button>

</div>


<!-- バトル -->

<div id="battleScreen" class="screen">

  <div class="topBar">

    <div class="topTitle">
      ⚔️ バトル！
    </div>

    <div class="statusPill">
      Lv <span id="battleLevel">1</span>
    </div>

  </div>

  <div class="battleWrap">

    <div class="enemyPanel">

      <div id="enemyEmoji" class="enemyEmoji"></div>

      <div id="enemyName" class="enemyName"></div>

      <div class="hpOuter">
        <div id="enemyHp" class="hpInner"></div>
      </div>

    </div>


    <div class="partyRow">

      <div class="partyCard">

        <div class="partyEmoji">🧒🏻🪲</div>

        タイチ

        <div class="hpOuter">
          <div id="taichiHp" class="hpInner"></div>
        </div>

      </div>


      <div class="partyCard">

        <div class="partyEmoji">👧🏻🌸</div>

        ハナ

        <div class="hpOuter">
          <div id="hanaHp" class="hpInner"></div>
        </div>

      </div>

    </div>


    <div id="battleLog" class="battleLog">
      敵が現れた！
    </div>


    <div class="commandGrid">

      <button
        id="attackButton"
        class="command attackButton"
        onclick="attack()"
      >
        ⚔️ こうげき
      </button>

      <button
        id="skillButton"
        class="command skillButton"
        onclick="skill()"
      >
        ✨ 友情パワー
      </button>

      <button
        id="healButton"
        class="command healButton"
        onclick="heal()"
      >
        💖 かいふく
      </button>

      <button
        id="runButton"
        class="command runButton"
        onclick="runAway()"
      >
        💨 にげる
      </button>

    </div>

  </div>

</div>


<!-- リザルト -->

<div id="resultScreen" class="screen">

  <div class="resultTitle">
    🎉 ワールドクリア！
  </div>

  <div class="resultBox">

    <div id="resultEmoji" class="resultEmoji"></div>

    <div id="resultText" class="resultText"></div>

  </div>

  <button class="nextButton" onclick="resultNext()">
    次の冒険へ！ 🌍
  </button>

</div>


<!-- エンディング -->

<div id="endingScreen" class="screen">

  <div class="endingTitle">
    🎉 大冒険クリア！ 🎉
  </div>

  <div class="endingCharacters">
    🧒🏻🪲 👧🏻🌸 🤖<br>
    🪲 🦈 🔥 ☁️ 🌙 🌀<br>
    🦎 🦗 👑
  </div>

  <div class="endingText">

    タイチとハナは、<br>
    たくさんの世界を旅して、<br>
    たくさんの仲間と出会いました。<br><br>

    そして、壊れかけのゼロとともに、<br>
    世界をつなぐ大切な力を取り戻しました。<br><br>

    でも……<br>
    タイチとハナの冒険は<br>
    これで終わりではありません。<br><br>

    まだ見ぬ世界が、<br>
    二人を待っているのでした……✨

  </div>

  <button
    class="bigButton"
    style="margin-top:28px"
    onclick="restartGame()"
  >
    もう一度遊ぶ！
  </button>

</div>


<div id="toast" class="toast"></div>

</div>


<script>

/* =========================
ゲームデータ
========================= */

const worlds = [

{
  name:"はじまりの世界",
  icon:"🤖",
  color:"world1",
  friend:"ゼロ",
  friendEmoji:"🤖",
  enemy:"時空のバグモンスター",
  enemyEmoji:"👾",
  intro:true,

  stories:[

`ある日、タイチとハナは
いつものように外で虫を探していました。`,

`タイチ「今日はどんなクワガタがいるかな？」`,

`ハナ「タイチー！あっち、ピカピカしてるよ！」`,

`二人が近づくと、
草むらの奥で不思議な光が輝いていました。`,

`その光の中から、
何かがゆっくりと落ちてきました。`,

`🤖「……ピ……ピピ……」`,

`それは、体のあちこちが壊れかけた
小さなロボットでした。`,

`🤖「タイチ……ハナ……
やっと……見つけた……」`,

`タイチ「え！？なんで僕たちの名前を知ってるの！？」`,

`🤖「ぼくの名前は……ゼロ。
世界間ゲートの案内役……」`,

`突然、空が大きくゆがみ始めました！`,

`ゼロ「まずい……！
ゲートが暴走している！」`

  ]
},

{
  name:"モリモリの森",
  icon:"🌲",
  color:"world1",
  friend:"レインボー",
  friendEmoji:"🪲",
  enemy:"森を荒らすバグビートル",
  enemyEmoji:"🐛",

  stories:[

`暴走したゲートに吸い込まれ、
タイチとハナがたどり着いたのは、
巨大な木々が広がる不思議な森でした。`,

`タイチ「すごい！
見たことない虫がいっぱいだ！」`,

`ハナ「でも、森のみんな困ってるよ……」`,

`すると、大きな木の上から
虹色に光るクワガタが現れました。`,

`🪲「ぼくはレインボー！
この森を守っているんだ！」`,

`森の奥では、
正体不明のモンスターが大暴れしていました。`,

`タイチ「よし！
みんなで森を守ろう！」`

  ]
},

{
  name:"シャーキュンの海",
  icon:"🌊",
  color:"world2",
  friend:"シャーキュン",
  friendEmoji:"🦈",
  enemy:"たこたこ",
  enemyEmoji:"🐙",

  stories:[

`次のゲートの先には、
青く広がる大きな海がありました。`,

`ハナ「わぁー！
お魚さんがいっぱい！」`,

`しかし海の奥から、
大きな渦が発生しています。`,

`🦈「待ってたよ！
ぼくはシャーキュン！」`,

`シャーキュンは、
海の仲間たちを守るために
ずっと戦っていました。`,

`🦈「たこたこが、
海のエネルギーを奪ってるんだ！」`,

`タイチ「みんなで助けに行こう！」`

  ]
},

{
  name:"灼熱ファイヤーランド",
  icon:"🔥",
  color:"world3",
  friend:"ファイヤー",
  friendEmoji:"🔥",
  enemy:"メラメラキング",
  enemyEmoji:"😈",

  stories:[

`次に現れたゲートの先は、
地面まで熱くなる灼熱の世界でした。`,

`ハナ「タイチ……
あついよぉ〜！」`,

`タイチ「でもあそこに誰かいる！」`,

`炎の中から、
元気な新しい仲間が飛び出しました。`,

`🔥「俺はファイヤー！
この世界の炎が暴走してるんだ！」`,

`巨大な炎の影が、
ゆっくりと近づいてきます。`,

`ゼロ「またゲートのバグが
世界のバランスを壊している……！」`

  ]
},

{
  name:"フワフワ天空島",
  icon:"☁️",
  color:"world4",
  friend:"くもくも",
  friendEmoji:"☁️",
  enemy:"ストームモンスター",
  enemyEmoji:"🌪️",

  stories:[

`雲を抜けると、
空に浮かぶ不思議な島が見えてきました。`,

`タイチ「本当に空の上に島がある！」`,

`ハナ「雲のベッドみたい！」`,

`☁️「こんにちは〜！
ぼくは、くもくもだよ〜！」`,

`しかし、島の周りでは
巨大な嵐が発生していました。`,

`くもくも「風が強すぎて、
みんな飛ばされちゃうよ〜！」`,

`タイチとハナは、
天空島を守るために立ち上がりました。`

  ]
},

{

  stories:[

},

{

  enemy:"パリピタイタイ",

  stories:[

  stories:[

`すべての世界を救ったタイチとハナ。`,

/* =========================
状態
========================= */

let currentWorld = 0;
let storyIndex = 0;

let level = 1;
let exp = 0;
let unlockedWorld = 0;

let enemyMaxHp = 100;
let enemyHp = 100;

let taichiMaxHp = 100;
let taichiHp = 100;

let hanaMaxHp = 100;
let hanaHp = 100;

let battleBusy = false;


/* =========================
初期化
========================= */

window.onload = function(){

  if(localStorage.getItem("taichiHanaSave")){
    document.getElementById("continueButton").style.display = "block";
  }

};


/* =========================
画面切り替え
========================= */

function showScreen(id){

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

}


/* =========================
新しいゲーム
========================= */

function newGame(){

  currentWorld = 0;
  storyIndex = 0;

  level = 1;
  exp = 0;
  unlockedWorld = 0;

  saveGame();

  enterWorld(0);

}


function continueGame(){

  const save =
    JSON.parse(
      localStorage.getItem("taichiHanaSave")
    );

  if(!save){
    newGame();
    return;
  }

  level = save.level;
  exp = save.exp;
  unlockedWorld = save.unlockedWorld;
  currentWorld = save.currentWorld;

  showMap();

}


/* =========================
セーブ
========================= */

function saveGame(){

  localStorage.setItem(
    "taichiHanaSave",
    JSON.stringify({
      level,
      exp,
      unlockedWorld,
      currentWorld
    })
  );

  document.getElementById("continueButton").style.display =
    "block";

}


/* =========================
マップ
========================= */

function showMap(){

  updateStatus();

  const list =
    document.getElementById("worldList");

  list.innerHTML = "";

  worlds.forEach((world,index)=>{

    const button =
      document.createElement("button");

    button.className =
      "worldButton";

    if(index > unlockedWorld){
      button.classList.add("locked");
    }

    button.innerHTML = `

      <div class="worldIcon ${world.color}">
        ${world.icon}
      </div>

      <div class="worldInfo">

        <h2>
          ${index + 1}. ${world.name}
        </h2>

        <p>
          ${index > unlockedWorld
            ? "🔒 まだ行けません"
            : "冒険に出発！"
          }
        </p>

      </div>

    `;

    button.onclick = ()=>{
      enterWorld(index);
    };

    list.appendChild(button);

  });

  showScreen("mapScreen");

}


function updateStatus(){

  document.getElementById("levelText").textContent =
    level;

  document.getElementById("expText").textContent =
    exp;

}


/* =========================
ワールド開始
========================= */

function enterWorld(index){

  if(index > unlockedWorld){

    showToast(
      "まだこのワールドには行けないよ！"
    );

    return;
  }

  currentWorld = index;
  storyIndex = 0;

  document.getElementById(
    "storyTopTitle"
  ).textContent =
    worlds[index].name;

  showStory();

  showScreen("storyScreen");

}


/* =========================
ストーリー
========================= */

function showStory(){

  const world =
    worlds[currentWorld];

  document.getElementById(
    "worldName"
  ).textContent =
    world.name;

  document.getElementById(
    "storyText"
  ).textContent =
    world.stories[storyIndex];

  renderStoryCharacters();

}


function renderStoryCharacters(){

  const area =
    document.getElementById(
      "storyCharacters"
    );

  area.innerHTML = "";

  const taichi =
    createCharacter(
      "🧒🏻🪲",
      "タイチ",
      "storyTaichi"
    );

  const hana =
    createCharacter(
      "👧🏻🌸",
      "ハナ",
      "storyHana"
    );

  area.appendChild(taichi);
  area.appendChild(hana);

}


function createCharacter(
  emoji,
  name,
  className
){

  const div =
    document.createElement("div");

  div.className =
    "storyChar " + className;

  div.innerHTML = `

    <div class="storyCharEmoji">
      ${emoji}
    </div>

    <div class="storyCharName">
      ${name}
    </div>

  `;

  return div;

}


function nextStory(){

  storyIndex++;

  if(
    storyIndex <
    worlds[currentWorld].stories.length
  ){

    showStory();

  }else{

    showFriend();

  }

}


/* =========================
仲間
========================= */

function showFriend(){

  const world =
    worlds[currentWorld];

  document.getElementById(
    "friendEmoji"
  ).textContent =
    world.friendEmoji;

  document.getElementById(
    "friendName"
  ).textContent =
    world.friend +
    " が仲間になった！";

  document.getElementById(
    "friendBox"
  ).textContent =
    `${world.friend} が
タイチとハナの仲間になった！

新しい力を手に入れた！

「これからは一緒に冒険しよう！」`;

  showScreen("friendScreen");

}


/* =========================
バトル開始
========================= */

function startBattle(){

  battleBusy = false;

  const world =
    worlds[currentWorld];

  enemyMaxHp =
    120 +
    currentWorld * 55 +
    level * 12;

  enemyHp =
    enemyMaxHp;

  taichiMaxHp =
    100 +
    (level - 1) * 25;

  hanaMaxHp =
    100 +
    (level - 1) * 25;

  taichiHp =
    taichiMaxHp;

  hanaHp =
    hanaMaxHp;

  document.getElementById(
    "enemyEmoji"
  ).textContent =
    world.enemyEmoji;

  document.getElementById(
    "enemyName"
  ).textContent =
    world.enemy;

  document.getElementById(
    "battleLevel"
  ).textContent =
    level;

  battleMessage(
    world.enemy +
    " が現れた！"
  );

  updateBattle();

  showScreen("battleScreen");

}


/* =========================
バトルバー
========================= */

function updateBattle(){

  document.getElementById(
    "enemyHp"
  ).style.width =
    Math.max(
      0,
      enemyHp / enemyMaxHp * 100
    ) + "%";

  document.getElementById(
    "taichiHp"
  ).style.width =
    Math.max(
      0,
      taichiHp / taichiMaxHp * 100
    ) + "%";

  document.getElementById(
    "hanaHp"
  ).style.width =
    Math.max(
      0,
      hanaHp / hanaMaxHp * 100
    ) + "%";

}


/* =========================
コマンド制御
========================= */

function setBattleButtons(disabled){

  [
    "attackButton",
    "skillButton",
    "healButton",
    "runButton"
  ].forEach(id=>{

    document.getElementById(id)
      .disabled = disabled;

  });

}


/* =========================
通常攻撃
========================= */

function attack(){

  if(battleBusy) return;

  battleBusy = true;

  setBattleButtons(true);

  const damage =
    random(20,35) +
    level * 3;

  enemyHp -= damage;

  battleMessage(
    "⚔️ タイチとハナのこうげき！\n" +
    damage +
    " ダメージ！"
  );

  updateBattle();

  setTimeout(
    checkEnemy,
    750
  );

}


/* =========================
友情パワー
========================= */

function skill(){

  if(battleBusy) return;

  battleBusy = true;

  setBattleButtons(true);

  const damage =
    random(40,65) +
    level * 5;

  enemyHp -= damage;

  battleMessage(
    "✨ 友情パワー発動！！\n\n" +
    "仲間たちの力が集まった！\n" +
    damage +
    " ダメージ！！"
  );

  updateBattle();

  setTimeout(
    checkEnemy,
    850
  );

}


/* =========================
回復
========================= */

function heal(){

  if(battleBusy) return;

  battleBusy = true;

  setBattleButtons(true);

  const amount =
    random(25,40) +
    level * 3;

  taichiHp =
    Math.min(
      taichiMaxHp,
      taichiHp + amount
    );

  hanaHp =
    Math.min(
      hanaMaxHp,
      hanaHp + amount
    );

  battleMessage(
    "💖 ハナのふしぎなパワー！\n\n" +
    "二人のHPが回復した！"
  );

  updateBattle();

  setTimeout(
    enemyAttack,
    750
  );

}


/* =========================
敵チェック
========================= */

function checkEnemy(){

  if(enemyHp <= 0){

    enemyHp = 0;

    updateBattle();

    winBattle();

  }else{

    enemyAttack();

  }

}


/* =========================
敵攻撃
========================= */

function enemyAttack(){

  const damage =
    random(12,24) +
    currentWorld * 4;

  if(Math.random() < 0.5){

    taichiHp -= damage;

    battleMessage(
      "敵の攻撃！\n\n" +
      "タイチに " +
      damage +
      " ダメージ！"
    );

  }else{

    hanaHp -= damage;

    battleMessage(
      "敵の攻撃！\n\n" +
      "ハナに " +
      damage +
      " ダメージ！"
    );

  }

  updateBattle();

  setTimeout(
    checkPlayer,
    650
  );

}


/* =========================
敗北チェック
========================= */

function checkPlayer(){

  if(
    taichiHp <= 0 &&
    hanaHp <= 0
  ){

    battleMessage(
      "二人は力を使い切ってしまった……\n\nもう一度挑戦しよう！"
    );

    setTimeout(
      startBattle,
      1500
    );

    return;

  }

  battleBusy = false;

  setBattleButtons(false);

}


/* =========================
勝利
========================= */

function winBattle(){

  const gainedExp =
    35 +
    currentWorld * 25;

  exp += gainedExp;

  while(exp >= level * 100){

    exp -= level * 100;

    level++;

    showToast(
      "🎉 レベルアップ！ Lv." +
      level
    );

  }

  saveGame();

  const world =
    worlds[currentWorld];

  document.getElementById(
    "resultEmoji"
  ).textContent =
    world.friendEmoji;

  document.getElementById(
    "resultText"
  ).textContent =
    `${world.enemy} を倒した！

🎉 勝利！！

EXP ${gainedExp} を獲得！

Lv.${level}
になった！`;

  if(
    currentWorld <
    worlds.length - 1
  ){

    unlockedWorld =
      Math.max(
        unlockedWorld,
        currentWorld + 1
      );

    saveGame();

  }

  showScreen("resultScreen");

}


/* =========================
リザルト次へ
========================= */

function resultNext(){

  if(
    currentWorld ===
    worlds.length - 1
  ){

    localStorage.removeItem(
      "taichiHanaSave"
    );

    document.getElementById(
      "continueButton"
    ).style.display =
      "none";

    showScreen("endingScreen");

    return;
  }

  currentWorld++;

  saveGame();

  enterWorld(currentWorld);

}


/* =========================
逃げる
========================= */

function runAway(){

  if(battleBusy) return;

  showToast(
    "💨 うまく逃げ切った！"
  );

  saveGame();

  setTimeout(
    showMap,
    700
  );

}


/* =========================
バトルメッセージ
========================= */

function battleMessage(text){

  document.getElementById(
    "battleLog"
  ).textContent =
    text;

}


/* =========================
ランダム
========================= */

function random(min,max){

  return Math.floor(
    Math.random() *
    (max - min + 1)
  ) + min;

}


/* =========================
トースト
========================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.style.display =
    "block";

  setTimeout(()=>{

    toast.style.display =
      "none";

  },2000);

}


/* =========================
最初から
========================= */

function restartGame(){

  localStorage.removeItem(
    "taichiHanaSave"
  );

  currentWorld = 0;
  storyIndex = 0;

  level = 1;
  exp = 0;

  unlockedWorld = 0;

  document.getElementById(
    "continueButton"
  ).style.display =
    "none";

  showScreen("titleScreen");

}

</script>
